<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام تشغيل الشركة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1c2321; --paper:#f6f4ef; --line:#dcd6c9; --panel:#ffffff;
  --brass:#8a6d3b; --brass-d:#5f4b28; --slate:#3f5a56; --slate-l:#e7eeec;
  --warn:#9a3b2e; --ok:#3d6b4f; --muted:#6b6659;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4{font-weight:600;margin:0 0 .5em}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

#app{display:flex;min-height:100vh}
/* Sidebar on the right for RTL */
#sidebar{
  width:250px;flex:none;background:var(--brass-d);color:#f3ede0;
  padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{font-size:19px;font-weight:700;margin-bottom:4px}
#sidebar .brand small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px}
#sidebar .grp{margin-top:18px}
#sidebar .grp-title{font-size:11px;opacity:.6;letter-spacing:.03em;margin:0 0 6px 4px}
#sidebar a.navlink{
  display:block;padding:7px 10px;border-radius:6px;color:#f3ede0;text-decoration:none;
  font-size:14px;margin-bottom:2px;opacity:.88
}
#sidebar a.navlink:hover{background:rgba(255,255,255,.08)}
#sidebar a.navlink.active{background:#f3ede0;color:var(--brass-d);opacity:1;font-weight:600}
#userbox{margin-top:16px;padding:10px;background:rgba(0,0,0,.15);border-radius:8px;font-size:13px}
#userbox select{width:100%;margin-top:6px;padding:5px;border-radius:5px;border:none}

#main{flex:1;min-width:0;padding:26px 34px;max-width:980px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:10px}
.pagehead{margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:14px}
.pagehead h1{font-size:26px}
.pagehead p{color:var(--muted);margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;color:var(--brass-d);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}#sidebar{position:fixed;right:0;z-index:5;transform:translateX(100%);transition:.2s}#sidebar.open{transform:none}#main{padding:18px}}

.flowmap{display:flex;flex-wrap:wrap;gap:0;align-items:center;justify-content:center;margin:20px 0}
.flownode{background:var(--panel);border:1.5px solid var(--brass);border-radius:9px;padding:12px 16px;font-size:14px;cursor:pointer;min-width:130px;text-align:center;transition:.15s}
.flownode:hover{background:var(--slate-l);border-color:var(--slate)}
.flowarrow{color:var(--brass);font-size:20px;padding:0 8px}

.orgtier{margin-bottom:22px}
.orgtier .lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
.orgrow{display:flex;flex-wrap:wrap;gap:12px}
.orgcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer;min-width:150px}
.orgcard:hover{border-color:var(--brass)}
.orgcard b{display:block;font-size:15px}
.orgcard span{font-size:12.5px;color:var(--muted)}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;margin-inline-end:6px}
.b-slate{background:var(--slate-l);color:var(--slate)}
.b-warn{background:#f4e2de;color:var(--warn)}
.b-ok{background:#e1ece4;color:var(--ok)}

ul.plain{margin:0;padding-inline-start:18px}
ul.plain li{margin-bottom:5px}

.do-dont{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.do-dont .col{border-radius:9px;padding:14px}
.do-dont .do{background:#e9f1ea;border:1px solid var(--ok)}
.do-dont .dont{background:#f6e7e4;border:1px solid var(--warn)}

.sopcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.sopcard:hover{border-color:var(--brass)}
.sopcard .meta{font-size:12px;color:var(--muted);margin-top:4px}

.qa-item{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.qa-item .q{font-weight:600;cursor:pointer}
.qa-item .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted)}
.qa-item.open .a{display:block}

.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.steps li .n{background:var(--brass);color:#fff;border-radius:50%;width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}

.chk{display:block;margin-bottom:6px;font-size:14px}
.chk input{margin-inline-end:8px}

.taskrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;background:var(--panel)}
.taskrow .t{font-weight:600;font-size:14px}
.taskrow .d{font-size:12px;color:var(--muted)}

.progresswrap{background:var(--line);border-radius:20px;height:10px;overflow:hidden;margin:10px 0}
.progressbar{background:var(--ok);height:100%}

#search{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin-bottom:14px}
.searchres{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.searchres .k{font-size:11px;color:var(--brass-d)}

.mockbtn{display:inline-block;background:var(--brass);color:#fff;padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-size:14px}
.mockbtn:hover{background:var(--brass-d)}
.linkbtn{background:none;border:1px solid var(--brass);color:var(--brass-d);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}

.mono-note{background:#fbf6e8;border:1px solid #e3d19c;border-radius:8px;padding:10px 14px;font-size:13px;color:#6b5a1e;margin-bottom:14px}

/* ---- profits section ---- */
.uploadrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=file]{flex:1;min-width:200px;padding:9px;border:1px dashed var(--brass);border-radius:8px;background:var(--slate-l)}
.tablewrap{overflow-x:auto}
table.pr{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
table.pr th,table.pr td{border:1px solid var(--line);padding:7px 9px;text-align:center;white-space:nowrap}
table.pr th{background:var(--slate);color:#fff;font-weight:600}
table.pr td.lbl{text-align:right;font-weight:600;white-space:normal;min-width:170px}
table.pr tr.total td{background:#ffe699;font-weight:700;color:#1c2321}
table.pr tr.profit td{background:#d1fae5;font-weight:700;color:#1c2321}
table.pr tr.info td{background:var(--slate-l);font-style:italic}
table.pr th.tot{background:var(--brass-d)}
table.pr td.tot{font-weight:700;background:#f3ead6;color:#1c2321}
/* الجدول المختصر */
table.sum{border-collapse:collapse;width:100%;font-size:15px;min-width:640px}
table.sum th,table.sum td{border:1px solid var(--line);padding:10px 12px;text-align:center;white-space:nowrap}
table.sum th.grp{font-size:16px;color:#fff}
table.sum th.g-dream{background:#5b3f7a}
table.sum th.g-cara{background:#2f5f73}
table.sum th.g-rs{background:#a0456e}
table.sum th.g-bloom{background:#3d7a5a}
table.sum th.act{background:#e7eeec;color:#3f5a56}
table.sum th.exp{background:#fbf0d9;color:#5f4b28}
table.sum td.act{background:var(--panel)}
table.sum td.exp{background:#fdf8ec;color:#1c2321}
table.sum td.lbl{text-align:right;font-weight:600;background:var(--panel)}
table.sum tr.big td{font-size:17px;font-weight:700}
table.sum td.pos{color:#1f7a45 !important;font-weight:700}
table.sum td.neg{color:#b3261e !important;font-weight:700}
table.sum td.sep,table.sum th.sep{border-inline-start:3px solid var(--brass-d)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.tasks3{gap:12px}
.tcol{background:var(--slate-l);border-radius:8px;padding:10px 12px}
h4.tk{font-size:13px;color:var(--slate);margin:0 0 6px}
.none{color:var(--muted);font-size:13px;margin:0}
.subhead{font-weight:700;font-size:14.5px;margin:4px 0 8px;cursor:pointer}
.subhead span{font-weight:400;font-size:12.5px;color:var(--muted);margin-inline-start:6px}
hr.sep{border:none;border-top:1px dashed var(--line);margin:14px 0}
h2.sectitle{font-size:17px;color:var(--muted);margin:26px 0 12px;border-top:1px solid var(--line);padding-top:16px}
input.adsIn{width:75px;padding:4px;border:1px solid var(--brass);border-radius:5px;background:#dcfce7;color:#1c2321;text-align:center}
input.plainIn{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:140px}
.kpi{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kpi b{color:var(--brass-d)}

/* ================= SQUAD section (نظام الأوردرات) =================
   كل الستايلات هنا متقفلة جوه #sq-root عشان ماتتعارضش مع باقي النظام */
#sq-root{--sq-green:#276749;--sq-green-soft:#e4f3ea;--sq-red:#b3423a;--sq-red-soft:#fbeae8;--sq-pend:#9a6b14;--sq-pend-soft:#fdf3dd}
#sq-root .sq-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--brass-d);color:#f3ede0;border-radius:10px;padding:8px 10px;margin-bottom:22px}
#sq-root .sq-tabs{display:flex;flex-wrap:wrap;gap:4px}
#sq-root .sq-tab{padding:8px 15px;border-radius:7px;border:none;background:transparent;color:#f3ede0;opacity:.85;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
#sq-root .sq-tab:hover{opacity:1;background:rgba(255,255,255,.08)}
#sq-root .sq-tab.active{background:#f3ede0;color:var(--brass-d);opacity:1}
#sq-root .sq-user{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
#sq-root .sq-logout{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#f3ede0;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#sq-root .sq-logout:hover{border-color:rgba(255,255,255,.6)}

#sq-root .sq-auth{max-width:400px;margin:10px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px 28px}
#sq-root .sq-auth h2{font-size:22px;margin:0 0 20px}
#sq-root .sq-field{margin-bottom:14px}
#sq-root .sq-field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
#sq-root .sq-field input,#sq-root .sq-field textarea,#sq-root .sq-field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;color:var(--ink);background:var(--panel);font-family:inherit}
#sq-root .sq-field input:focus,#sq-root .sq-field textarea:focus,#sq-root .sq-field select:focus{outline:none;border-color:var(--brass)}
#sq-root .sq-field textarea{resize:vertical;min-height:70px}
#sq-root .sq-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--brass);color:#fff}
#sq-root .sq-btn:hover{background:var(--brass-d)}
#sq-root .sq-btn:disabled{opacity:.5;cursor:not-allowed}
#sq-root .sq-btn.block{width:100%}
#sq-root .sq-btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#sq-root .sq-btn.ghost:hover{border-color:var(--brass)}
#sq-root .sq-switch{margin-top:16px;font-size:14px;color:var(--muted);text-align:center}
#sq-root .sq-switch button{background:none;border:none;padding:0;color:var(--brass-d);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit;font-size:inherit}
#sq-root .sq-err{background:var(--sq-red-soft);color:var(--sq-red);border:1px solid #efc7c2;padding:10px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px}
#sq-root .sq-ok{background:var(--sq-green-soft);color:var(--sq-green);border:1px solid #bfe1cc;padding:10px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px}

#sq-root .sq-hype{display:flex;align-items:center;gap:14px;background:var(--slate);color:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px}
#sq-root .sq-hype.lead{background:linear-gradient(135deg,var(--brass-d),var(--brass))}
#sq-root .sq-hype .e{font-size:28px;line-height:1;flex-shrink:0}
#sq-root .sq-hype .t{font-size:15.5px;font-weight:700;margin-bottom:2px}
#sq-root .sq-hype .s{font-size:13px;opacity:.85}

#sq-root .sq-stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:22px}
#sq-root .sq-stat{padding:18px 20px;border-inline-start:1px solid var(--line)}
#sq-root .sq-stat:first-child{border-inline-start:none}
#sq-root .sq-stat .n{font-size:26px;font-weight:700;line-height:1}
#sq-root .sq-stat .n.gold{color:var(--brass)}
#sq-root .sq-stat .n.green{color:var(--ok)}
#sq-root .sq-stat .l{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:720px){#sq-root .sq-stats{grid-template-columns:repeat(2,1fr)}#sq-root .sq-stat:nth-child(3){border-inline-start:none}}

#sq-root .sq-form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:560px}
#sq-root .sq-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){#sq-root .sq-row2{grid-template-columns:1fr}}

#sq-root .sq-tablecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
#sq-root table.sq-table{width:100%;border-collapse:collapse}
#sq-root .sq-table th{text-align:right;font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--slate-l);white-space:nowrap}
#sq-root .sq-table td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);vertical-align:middle}
#sq-root .sq-table tbody tr:last-child td{border-bottom:none}
#sq-root .sq-table .amount{font-weight:700}
#sq-root .sq-table .mut{color:var(--muted);font-size:13px}
#sq-root .sq-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
#sq-root .sq-badge.pending{background:var(--sq-pend-soft);color:var(--sq-pend)}
#sq-root .sq-badge.delivered{background:var(--sq-green-soft);color:var(--sq-green)}
#sq-root .sq-badge.cancelled{background:var(--sq-red-soft);color:var(--sq-red)}
#sq-root select.sq-status{padding:6px 8px;font-size:13px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer;font-family:inherit}
#sq-root .sq-actions{display:flex;gap:6px}
#sq-root .sq-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
#sq-root .sq-icon:hover{border-color:var(--brass)}
#sq-root .sq-icon.danger:hover{border-color:var(--sq-red);background:var(--sq-red-soft)}
#sq-root .sq-empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:14.5px}
#sq-root .sq-loading{padding:56px 20px;text-align:center;color:var(--muted)}
@media (max-width:680px){
  #sq-root .sq-table,#sq-root .sq-table thead,#sq-root .sq-table tbody,#sq-root .sq-table tr,#sq-root .sq-table td{display:block;width:100%}
  #sq-root .sq-table thead{position:absolute;inset-inline-start:-9999px}
  #sq-root .sq-table tbody tr{border-bottom:8px solid var(--paper);padding:4px 0}
  #sq-root .sq-table tbody td{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
  #sq-root .sq-table tbody td::before{content:attr(data-label);font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0}
}

#sq-root .sq-board-row{display:grid;grid-template-columns:44px 1fr 90px 90px 110px;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#sq-root .sq-board-row:last-child{border-bottom:none}
#sq-root .sq-board-row.head{background:var(--slate-l);font-size:12px;font-weight:600;color:var(--muted);padding:11px 18px}
#sq-root .sq-board-row .c{text-align:center}
@media (max-width:640px){#sq-root .sq-board-row{grid-template-columns:32px 1fr 60px 60px 84px;padding:12px 10px;gap:6px;font-size:13px}}
#sq-root .sq-rank{width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#sq-root .sq-rank.r1{background:#f4e3b0;color:#7a5a0e}
#sq-root .sq-rank.r2{background:#e4e8ec;color:#4b5a6b}
#sq-root .sq-rank.r3{background:#ebd3c2;color:#7a4b2e}
#sq-root .sq-name{font-weight:600}
#sq-root .sq-metric{font-weight:700;font-size:16px}
#sq-root .sq-metric.gold{color:var(--brass)}

#sq-root .sq-modal-bg{position:fixed;inset:0;background:rgba(28,35,33,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#sq-root .sq-modal{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:10px;padding:26px}
#sq-root .sq-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
#sq-root .sq-modal-head h2{font-size:19px;margin:0}
#sq-root .sq-modal-x{background:transparent;border:none;cursor:pointer;font-size:20px;color:var(--muted);padding:4px}
#sq-root .sq-modal-actions{display:flex;gap:10px;margin-top:6px}
#sq-root .sq-modal-actions .sq-btn{flex:1}

/* 📋 ليستة الطلب + 💰 العمولة */
#sq-root .sq-hint{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:6px}
#sq-root .sq-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
#sq-root .sq-pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel)}
#sq-root .sq-pick.on{border-color:var(--brass);background:var(--slate-l)}
#sq-root .sq-pick.extra{border-style:dashed}
#sq-root .sq-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#sq-root .sq-type{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:12px 10px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
#sq-root .sq-type.on{background:var(--brass-d);border-color:var(--brass-d);color:#fff}
#sq-root .sq-hide{display:none}
#sq-root .sq-pick label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);margin:0}
#sq-root .sq-pick input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);flex:none;margin:0;padding:0}
#sq-root .sq-field .sq-pick input.sq-qty{width:58px;flex:none;padding:5px 6px;text-align:center;font-size:14px}
#sq-root .sq-field .sq-pick input.sq-qty:disabled{opacity:.35}
#sq-root .sq-commprev{font-size:13px;color:var(--muted);background:var(--slate-l);border-radius:8px;padding:8px 12px;margin:-4px 0 14px}
#sq-root .sq-commprev b{color:var(--brass-d)}
#sq-root .sq-commnote{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--muted);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:14px}

const CHANNELS = "WhatsApp, Messenger, Instagram, TikTok, Phone";

/* ---------------- PROFITS DATA/LOGIC ---------------- */
const PR_BRANDS=["dream","dream msg site","dream wa","msg","lo gel nails","fastplt","cara silver","cara silver un","cara wa","rs kids","bloom"];
const PR_PNL_BRANDS=PR_BRANDS.filter(b=>b!=="lo gel nails");
const PR_SOLO="lo gel nails";
const PR_MSG_GROUP=["msg","dream msg site","fastplt"];
const PR_COLS=[
 {type:"brand",key:"dream",h:"DREAM"},{type:"brand",key:"dream msg site",h:"DREAM MSG SITE"},
 {type:"brand",key:"dream wa",h:"DREAM WA"},{type:"agg",key:"dream_group",h:"DREAM المجمع",brands:["dream","dream msg site","dream wa"]},
 {type:"brand",key:"msg",h:"MSG"},{type:"brand",key:"fastplt",h:"FASTPLT"},
 {type:"brand",key:"cara silver",h:"CARA SILVER"},{type:"brand",key:"cara silver un",h:"CARA SILVER UN"},
 {type:"brand",key:"cara wa",h:"CARA WA"},
 {type:"agg",key:"cara_group",h:"CARA مجمع",brands:["cara silver","cara silver un","cara wa"]},
 {type:"brand",key:"rs kids",h:"RS KIDS",sum:true}, // بيظهر كمان في جدول الخلاصة
 {type:"brand",key:"bloom",h:"BLOOM",sum:true}      // 🌸 براند جديد — بيظهر كمان في جدول الخلاصة
];
// راتب مساعد مدير المكتب: 16000 شهريًا
const PR_A_SAL_D=16000/30, PR_MSG_SAL_D=150, PR_SHR_SAL_D=300, PR_RENT_D=200;
const PR_COGS_NO=65.2, PR_COGS_YES=94, PR_BRANCH_PCT=0.145, PR_PEND_VAL=75;
const PR_OFD_RATE=0.35, PR_HOLD_RATE=0.15;
const PR_RATE_OVERRIDES={
  "cara silver":{ofd:0.30,hold:0.10},
  "cara silver un":{ofd:0.25,hold:0.08},
  "cara wa":{ofd:0.30,hold:0.10},
  "rs kids":{ofd:0.70,hold:0.30},
  "bloom":{ofd:0.60,hold:0.30}
};
const prRatesFor=b=>PR_RATE_OVERRIDES[b]||{ofd:PR_OFD_RATE,hold:PR_HOLD_RATE};
// براندات تكلفة بضاعتها نسبة ثابتة من المبيعات (بدل 65.2 / 94 للقطعة)
const PR_COGS_PCT={"rs kids":0.50,"bloom":0.45};
const PR_statusCol=15,PR_priceCol=5,PR_shipCol=6,PR_notesCol=10,PR_contentsCol=12,PR_returnedCol=9,PR_dateCol=11;

// البنود اليدوية — بتتكتب مرة واحدة في الجدول الأساسي وبتتطبق على الجدولين
const PR_MANUAL=[
  {id:"ads",  lbl:"📢 إعلانات"},
  {id:"other",lbl:"🧾 هوالك - نثريات - أخرى"}
];
let prManualVals={}; // prManualVals[id][brand]
const prMan=(id,b)=>(prManualVals[id]&&prManualVals[id][b])||0;

let prBrandCalc={}, prPendingTotal=0, prRealCols=[], prExpCols=[], prUnbranded=[];

function prGetBrand(note){
  const n=String(note||"").toLowerCase().trim().split("\n")[0].trim();
  if(n.startsWith("bloom"))return"bloom"; // 🌸 براند BLOOM
  if(n.startsWith("rs kids")||n.startsWith("rskids")||n.startsWith("rs-kids")||n.startsWith("rs_kids"))return"rs kids"; // براند RS KIDS
  if(/^rs(\s|$|[^a-z])/.test(n))return"rs kids"; // ملاحظة "rs" لوحدها = براند RS
  if(n.startsWith("dream msg site"))return"dream msg site";
  if(n.startsWith("drew wa"))return"dream wa"; // خطأ إملائي شائع لـ dream wa
  if(n.startsWith("dream wa"))return"dream wa";
  if(n.startsWith("dream"))return"dream";
  if(n.startsWith("re"))return"msg"; // أي ملاحظة بتبدأ بـ re بتتصنف MSG
  if(n.startsWith("msg"))return"msg";
  if(n.startsWith("lo gel nails")||n.startsWith("lo gel")||n.startsWith("logel"))return"lo gel nails";
  if(n.startsWith("fastlpt"))return"fastplt"; // خطأ إملائي شائع لـ fastplt
  if(n.startsWith("fastplt"))return"fastplt";
  if(n.startsWith("cara silver un"))return"cara silver un";
  if(n.startsWith("cara siver"))return"cara silver"; // خطأ إملائي شائع لـ cara silver
  if(n.startsWith("cara silver"))return"cara silver";
  if(n.startsWith("wa"))return"cara wa"; // ملاحظة "wa" لوحدها = براند جديد
  return null;
}
const prHasInsial=c=>String(c||"").includes("انسيال");
const prNum=v=>parseFloat(String(v).replace(/[^\d.-]/g,""))||0;

function prRunReport(){
  const f=document.getElementById('prFileIn').files[0];
  const status=document.getElementById('prStatus');
  if(!f){status.textContent="اختار ملف الأول.";return;}
  status.textContent="بيقرأ الملف...";
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      rows.shift();
      prProcess(rows);
      status.textContent="تم بنجاح ✅ — "+rows.length+" صف اتقروا.";
    }catch(err){status.textContent="فيه خطأ: "+err.message;}
  };
  reader.readAsArrayBuffer(f);
}

function prProcess(rows){
  const byBrand={}; PR_BRANDS.forEach(b=>byBrand[b]=[]);
  prUnbranded=[];
  rows.forEach(r=>{const b=prGetBrand(r[PR_notesCol-1]); if(b)byBrand[b].push(r); else prUnbranded.push(r);});

  function calcOne(brand){
    const rs=byBrand[brand];
    const delivered=rs.filter(r=>r[PR_statusCol-1]==="Delivered");
    const returned=rs.filter(r=>{const v=r[PR_returnedCol-1];return v&&String(v).trim()!==""&&String(v).trim()!=="NaT";});
    const holdRows=rs.filter(r=>r[PR_statusCol-1]==="Hold");
    const ofdRows=rs.filter(r=>r[PR_statusCol-1]==="Out for Delivery");
    const undelRows=rs.filter(r=>r[PR_statusCol-1]==="Undelivered");
    const hold=holdRows.length, ofd=ofdRows.length, undel=undelRows.length;
    const revenue=delivered.reduce((s,r)=>s+prNum(r[PR_priceCol-1]),0);
    const shipAll=rs.reduce((s,r)=>s+prNum(r[PR_shipCol-1]),0);
    const shipDel=delivered.reduce((s,r)=>s+prNum(r[PR_shipCol-1]),0);
    const shipRet=returned.reduce((s,r)=>s+prNum(r[PR_shipCol-1]),0);
    // الشحن البايظ: Undelivered وملوش تاريخ إرجاع (اللي له تاريخ إرجاع بيتحسب في المرتجعات بس)
    const isRet=r=>{const v=r[PR_returnedCol-1];return v&&String(v).trim()!==""&&String(v).trim()!=="NaT";};
    const shipUndel=undelRows.filter(r=>!isRet(r)).reduce((s,r)=>s+prNum(r[PR_shipCol-1]),0);
    const wIns=delivered.filter(r=>prHasInsial(r[PR_contentsCol-1])).length;
    const cogs=(brand in PR_COGS_PCT)
      ? revenue*PR_COGS_PCT[brand]
      : wIns*PR_COGS_YES+(delivered.length-wIns)*PR_COGS_NO;
    return {n:rs.length,delivered:delivered.length,returned:returned.length,hold,ofd,undel,revenue,shipAll,shipDel,shipRet,shipUndel,cogs};
  }
  prBrandCalc={}; PR_BRANDS.forEach(b=>prBrandCalc[b]=calcOne(b));

  let times=[]; rows.forEach(r=>{const v=r[PR_dateCol-1]; if(!v)return; const d=v instanceof Date?v:new Date(v); if(!isNaN(d))times.push(+d);});
  const days=times.length?Math.max(1,Math.floor((Math.max(...times)-Math.min(...times))/86400000)+1):1;
  const A_SAL=PR_A_SAL_D*days, MSG_SAL=PR_MSG_SAL_D*days, SHR_SAL=PR_SHR_SAL_D*days, RENT=PR_RENT_D*days;

  const totalOrders=PR_PNL_BRANDS.reduce((s,b)=>s+prBrandCalc[b].n,0);
  const msgTotal=PR_MSG_GROUP.reduce((s,b)=>s+prBrandCalc[b].n,0);

  prRealCols=PR_PNL_BRANDS.map(b=>{
    const c=prBrandCalc[b];
    const share=totalOrders?c.n/totalOrders:0;
    const msgSal=(PR_MSG_GROUP.includes(b)&&msgTotal)?MSG_SAL*(c.n/msgTotal):0;
    return {key:b,revenue:c.revenue,shipDel:c.shipDel,shipUndel:c.shipUndel,shipRet:c.shipRet,
      aSal:A_SAL*share,msgSal,shrSal:SHR_SAL*share,rent:RENT*share,cogs:c.cogs};
  });

  prExpCols=PR_PNL_BRANDS.map(b=>{
    const c=prBrandCalc[b];
    const avgPrice=c.delivered?c.revenue/c.delivered:0;
    const avgCogs=c.delivered?c.cogs/c.delivered:0;
    const avgShip=c.delivered?c.shipDel/c.delivered:0;
    const rt=prRatesFor(b);
    const count=c.ofd*rt.ofd+c.hold*rt.hold;
    return {key:b,count,revenue:count*avgPrice,shipExp:count*avgShip,cogsExp:count*avgCogs};
  });

  prPendingTotal=PR_BRANDS.reduce((s,b)=>{
    const rs=byBrand[b].filter(r=>{
      const ret=r[PR_returnedCol-1]; const isRet=ret&&String(ret).trim()!==""&&String(ret).trim()!=="NaT";
      return r[PR_statusCol-1]!=="Delivered"&&!isRet;
    });
    return s+rs.length;
  },0);

  prBuildTable('F'); // الجدول الأساسي: الفعلي + المتوقع
  prBuildTable('A'); // الجدول الفعلي قبل التوقع
  prBuildSummaryTable();
  prBuildCountsTable();
  prBuildUnbrandedTable();
  prBuildItemsTable(rows);
  prRecalc();
  document.getElementById('prResults').style.display='block';
}

function prFmt(n){return (Math.round(n*10)/10).toLocaleString('ar-EG');}

/* pfx = 'F' (الفعلي + المتوقع) أو 'A' (الفعلي فقط) */
function prBuildTable(pfx){
  const full=pfx==='F';
  const t=document.getElementById(full?'prFullTable':'prActTable');
  const val=(k,f)=>{
    const r=prRealCols.find(x=>x.key===k)||{}, e=prExpCols.find(x=>x.key===k)||{};
    let v=r[f]||0;
    if(full){
      if(f==='revenue')v+=e.revenue||0;
      else if(f==='shipDel')v+=e.shipExp||0;
      else if(f==='cogs')v+=e.cogsExp||0;
    }
    return v;
  };
  const expVal=(k,f)=>{const e=prExpCols.find(x=>x.key===k)||{};return e[f]||0;};
  const rowFor=g=>PR_COLS.map(c=>c.type==='agg'?c.brands.reduce((s,b)=>s+g(b),0):g(c.key));
  const totalFor=g=>PR_PNL_BRANDS.reduce((s,b)=>s+g(b),0);
  const tr=(lbl,row,total,cls)=>`<tr${cls?` class="${cls}"`:''}><td class="lbl">${lbl}</td><td class="tot">${prFmt(total)}</td>${row.map(v=>`<td>${prFmt(v)}</td>`).join('')}</tr>`;
  const autoRow=(lbl,f)=>{const g=b=>val(b,f);const row=rowFor(g),tot=totalFor(g);return {html:tr(lbl,row,tot),row,tot};};
  const manRow=m=>`<tr><td class="lbl">${m.lbl}${full?' (عدّل يدوي)':''}</td><td class="tot" id="${pfx}_${m.id}_total">0</td>`+
    PR_COLS.map(c=>(full&&c.type!=='agg')
      ?`<td><input class="adsIn" data-man="${m.id}" data-brand="${c.key}" type="number" value="${prMan(m.id,c.key)}" oninput="prRecalc()"></td>`
      :`<td id="${pfx}_${m.id}_${c.key}">0</td>`).join('')+`</tr>`;
  const idRow=(lbl,id,cls)=>`<tr${cls?` class="${cls}"`:''}><td class="lbl">${lbl}</td><td class="tot" id="${pfx}_${id}_total">0</td>`+PR_COLS.map(c=>`<td id="${pfx}_${id}_${c.key}">0</td>`).join('')+`</tr>`;
  const sfx=full?' (فعلي + متوقع)':'';

  let h='<tr><th>البند</th><th class="tot">الإجمالي</th>'+PR_COLS.map(c=>`<th>${c.h}</th>`).join('')+'</tr>';
  if(full){
    const gc=b=>expVal(b,'count'), gr=b=>expVal(b,'revenue');
    h+=tr('🔮 أوردرات متوقع تسليمها (من OFD و Hold)',rowFor(gc),totalFor(gc),'info');
    h+=tr('↳ منها مبيعات متوقعة (داخلة في المبيعات تحت)',rowFor(gr),totalFor(gr),'info');
  }
  const rev=autoRow('📥 مبيعات التسليمات'+sfx,'revenue');
  const sd =autoRow('🚚 شحن التسليمات'+sfx,'shipDel');
  const su =autoRow('💔 شحن بايظ (Undelivered)','shipUndel');
  const sr =autoRow('↩️ شحن المرتجعات','shipRet');
  const as =autoRow('👤 راتب مساعد مدير المكتب','aSal');
  const ms =autoRow('💬 خدمة عملاء','msgSal');
  const ss =autoRow('👥 راتب مشترك (مدير مكتب)','shrSal');
  const rt =autoRow('🏢 إيجار مكتب','rent');
  const cg =autoRow('📦 تكلفة البضاعة'+sfx,'cogs');

  h+=rev.html+sd.html+su.html+sr.html;
  h+=manRow(PR_MANUAL[0]);
  h+=idRow('📊 نسبة الإعلانات','adsPct');
  h+=as.html+ms.html+ss.html+rt.html;
  PR_MANUAL.slice(1).forEach(m=>h+=manRow(m));
  h+=cg.html;
  h+=idRow('🔴 إجمالي التكاليف','cost','total');
  h+=idRow('✅ صافي الربح'+(full?' بعد التوقع':' الفعلي'),'prof','profit');
  h+=idRow('📊 نسبة الربح %','pct');
  t.innerHTML=h;

  const parts=[sd,su,sr,as,ms,ss,rt,cg];
  const fixRow=PR_COLS.map((c,i)=>parts.reduce((s,p)=>s+p.row[i],0));
  const totalFix=parts.reduce((s,p)=>s+p.tot,0);
  t.dataset.rev=JSON.stringify(rev.row); t.dataset.fix=JSON.stringify(fixRow);
  t.dataset.totalrev=rev.tot; t.dataset.totalfix=totalFix;
}

function prRecalc(){
  // اقرأ البنود اليدوية من الجدول الأساسي
  document.querySelectorAll('#prFullTable input[data-man]').forEach(inp=>{
    (prManualVals[inp.dataset.man]=prManualVals[inp.dataset.man]||{})[inp.dataset.brand]=prNum(inp.value);
  });
  const colMan=(id,c)=>c.type==='agg'?c.brands.reduce((s,b)=>s+prMan(id,b),0):prMan(id,c.key);
  const totMan=id=>PR_PNL_BRANDS.reduce((s,b)=>s+prMan(id,b),0);
  const setT=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'—';
  const profits={F:0,A:0};

  ['F','A'].forEach(pfx=>{
    const t=document.getElementById(pfx==='F'?'prFullTable':'prActTable');
    if(!t||!t.dataset.rev)return;
    const rev=JSON.parse(t.dataset.rev), fix=JSON.parse(t.dataset.fix);
    const totalRev=+t.dataset.totalrev, totalFix=+t.dataset.totalfix;
    PR_COLS.forEach((c,i)=>{
      let man=0;
      PR_MANUAL.forEach(m=>{const v=colMan(m.id,c); man+=v; setT(`${pfx}_${m.id}_${c.key}`,prFmt(v));});
      const cost=fix[i]+man, prof=rev[i]-cost;
      setT(`${pfx}_adsPct_${c.key}`,pct(colMan('ads',c),rev[i]));
      setT(`${pfx}_cost_${c.key}`,prFmt(cost));
      setT(`${pfx}_prof_${c.key}`,prFmt(prof));
      setT(`${pfx}_pct_${c.key}`,pct(prof,rev[i]));
      if(c.type==='agg'||c.sum){ // المجمعات + أي براند ظاهر في جدول الخلاصة (زي RS KIDS و BLOOM)
        const sid=k=>`S_${k}_${c.key}_${pfx}`;
        setT(sid('rev'),prFmt(rev[i])); setT(sid('cost'),prFmt(cost)); setT(sid('prof'),prFmt(prof));
        setT(sid('pct'),pct(prof,rev[i])); setT(sid('ads'),pct(colMan('ads',c),rev[i]));
        ['prof','pct'].forEach(k=>{const e=document.getElementById(sid(k)); if(e){e.classList.toggle('pos',prof>0);e.classList.toggle('neg',prof<0);}});
      }
    });
    let manTotal=0;
    PR_MANUAL.forEach(m=>{const v=totMan(m.id); manTotal+=v; setT(`${pfx}_${m.id}_total`,prFmt(v));});
    const totalCost=totalFix+manTotal, totalProf=totalRev-totalCost;
    setT(`${pfx}_adsPct_total`,pct(totMan('ads'),totalRev));
    setT(`${pfx}_cost_total`,prFmt(totalCost));
    setT(`${pfx}_prof_total`,prFmt(totalProf));
    setT(`${pfx}_pct_total`,pct(totalProf,totalRev));
    profits[pfx]=totalProf;
  });

  const branchSales=prNum(document.getElementById('prBranchSales').value);
  const branchCogs=branchSales*PR_BRANCH_PCT, branchProfit=branchSales-branchCogs;
  setT('prBranchCogs',prFmt(branchCogs));
  setT('prBranchProfit',prFmt(branchProfit));
  setT('prBranchProfit2',prFmt(branchProfit));
  setT('prBrandsProfit',prFmt(profits.A));
  const grandTotal=profits.A+branchProfit;
  setT('prTotalProfit',prFmt(grandTotal));
  setT('prTotalExpected',prFmt(profits.F+branchProfit));
  setT('prPendingCount',prPendingTotal);
  const pendingVal=prPendingTotal*PR_PEND_VAL;
  setT('prPendingValue',prFmt(pendingVal));
  setT('prSafeValue',prFmt(grandTotal-pendingVal));
}

function prAggRow(label,brands){
  const agg=brands.reduce((a,b)=>{
    const c=prBrandCalc[b];
    a.n+=c.n;a.delivered+=c.delivered;a.returned+=c.returned;a.hold+=c.hold;a.ofd+=c.ofd;a.undel+=c.undel;a.revenue+=c.revenue;a.shipAll+=c.shipAll;
    return a;
  },{n:0,delivered:0,returned:0,hold:0,ofd:0,undel:0,revenue:0,shipAll:0});
  const rate=agg.n?((agg.delivered/agg.n)*100).toFixed(1)+'%':'0%';
  return `<tr class="total"><td class="lbl">${label}</td><td>${agg.n}</td><td>${agg.delivered}</td><td>${agg.returned}</td><td>${agg.hold}</td><td>${agg.ofd}</td><td>${agg.undel}</td><td>${prFmt(agg.revenue)}</td><td>${prFmt(agg.shipAll)}</td><td>${rate}</td></tr>`;
}

function prBuildSummaryTable(){
  const t=document.getElementById('prSummaryTable');
  let h='<tr><th>البراند</th><th>إجمالي</th><th>مُسلَّم</th><th>مرتجع</th><th>Hold</th><th>OFD</th><th>Undelivered</th><th>مبيعات</th><th>شحن</th><th>نسبة تسليم</th></tr>';
  PR_BRANDS.filter(b=>b!==PR_SOLO).forEach(b=>{
    const c=prBrandCalc[b];
    const rate=c.n?((c.delivered/c.n)*100).toFixed(1)+'%':'0%';
    h+=`<tr><td class="lbl">${b.toUpperCase()}</td><td>${c.n}</td><td>${c.delivered}</td><td>${c.returned}</td><td>${c.hold}</td><td>${c.ofd}</td><td>${c.undel}</td><td>${prFmt(c.revenue)}</td><td>${prFmt(c.shipAll)}</td><td>${rate}</td></tr>`;
  });
  h+=prAggRow('DREAM مجمع',['dream','dream msg site','dream wa']);
  h+=prAggRow('CARA مجمع',['cara silver','cara silver un','cara wa']);
  t.innerHTML=h;
}

function prBuildCountsTable(){
  const t=document.getElementById('prCountsTable');
  const total=PR_BRANDS.reduce((s,b)=>s+prBrandCalc[b].n,0);
  let h='<tr><th>البراند</th><th>عدد الأوردرات</th></tr>';
  PR_BRANDS.forEach(b=>{
    h+=`<tr><td class="lbl">${b.toUpperCase()}${b===PR_SOLO?' ⭐':''}</td><td>${prBrandCalc[b].n}</td></tr>`;
  });
  h+=`<tr><td class="lbl">بدون براند (غير محسوبة)</td><td>${prUnbranded.length}</td></tr>`;
  h+=`<tr class="total"><td class="lbl">الإجمالي (كل الملف)</td><td>${total+prUnbranded.length}</td></tr>`;
  t.innerHTML=h;
}

function prFmtDate(v){
  if(!v)return'—';
  const d=v instanceof Date?v:new Date(v);
  return isNaN(d)?String(v):d.toLocaleDateString('ar-EG');
}

function prBuildUnbrandedTable(){
  const box=document.getElementById('prUnbrandedWrap');
  const countEl=document.getElementById('prUnbrandedCount');
  countEl.textContent=prUnbranded.length;
  if(!prUnbranded.length){box.innerHTML='<p style="color:var(--muted)">كل الأوردرات في الملف اتصنّفت على براند ✅</p>';return;}
  let h='<table class="pr"><tr><th>#</th><th>التاريخ</th><th>الملاحظة</th><th>السعر</th><th>الحالة</th></tr>';
  prUnbranded.forEach((r,i)=>{
    h+=`<tr><td>${i+1}</td><td>${prFmtDate(r[PR_dateCol-1])}</td><td class="lbl" style="text-align:right">${(r[PR_notesCol-1]||'—')}</td><td>${prFmt(prNum(r[PR_priceCol-1]))}</td><td>${r[PR_statusCol-1]||'—'}</td></tr>`;
  });
  h+='</table>';
  box.innerHTML=h;
}

/* توحيد الكتابة للمقارنة: بيشيل المسافات والأقواس والرموز والحروف المخفية والتشكيل،
   وبيوحّد ة/ه و ى/ي و أ/إ/آ/ا */
function prNorm(x){
  return String(x||'')
    .replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[^\p{L}\p{N}]/gu,'')

}

/* إحصائية تفاصيل الطلبات (العمود L) */
function prBuildItemsTable(rows){
  const map={};
  rows.forEach(r=>{
    const key=String(r[PR_contentsCol-1]||'').replace(/\s+/g,' ').trim()||'(فاضي)';
    const m=map[key]||(map[key]={n:0,d:0});
    m.n++; if(r[PR_statusCol-1]==='Delivered')m.d++;
  });
  const list=Object.entries(map).sort((a,b)=>b[1].n-a[1].n);
  const totN=list.reduce((s,[,m])=>s+m.n,0), totD=list.reduce((s,[,m])=>s+m.d,0);
  const pct=(d,n)=>n?((d/n)*100).toFixed(1)+'%':'—';
  document.getElementById('prItemsCount').textContent=list.length;
  let h='<table class="pr"><tr><th>#</th><th>تفاصيل الطلب</th><th>اتكرر كام مرة</th><th>اتسلم منهم</th><th>نسبة التسليم</th></tr>';
  h+=`<tr class="total"><td>—</td><td class="lbl">الإجمالي</td><td>${totN}</td><td>${totD}</td><td>${pct(totD,totN)}</td></tr>`;
  list.forEach(([k,m],i)=>{
    h+=`<tr data-n="${prNorm(k)}"><td>${i+1}</td><td class="lbl" style="text-align:right">${k.replace(/</g,'&lt;')}</td><td>${m.n}</td><td>${m.d}</td><td>${pct(m.d,m.n)}</td></tr>`;
  });
  h+='</table>';
  document.getElementById('prItemsWrap').innerHTML=h;

  // باكدج ولا لأ
  const g={yes:{n:0,d:0,o:0,h:0},no:{n:0,d:0,o:0,h:0},s1:{n:0,d:0,o:0,h:0},s2:{n:0,d:0,o:0,h:0},rest:{n:0,d:0,o:0,h:0}};
  // أوردرات محددة بتتفصل من "بدون باكدج" (المقارنة بتتجاهل المسافات)
  const nos=prNorm;
  const SP1='طقم سلسله ومحبس وحلق ( ايطالي )';
  const SP2='طقم سلسله ومحبس وحلق ( ايطالي ) انسيال فصوص زاركونيا ايطالي';
  rows.forEach(r=>{
    const k=String(r[PR_contentsCol-1]||'').includes('باكدج')?'yes':'no';
    const st=r[PR_statusCol-1];
    const add=m=>{m.n++; if(st==='Delivered')m.d++; if(st==='Out for Delivery')m.o++; if(st==='Hold')m.h++;};
    add(g[k]);
    if(k==='no'){
      const c=nos(r[PR_contentsCol-1]);
      add(c.includes(nos(SP2))?g.s2:c.includes(nos(SP1))?g.s1:g.rest);
    }
  });
  const all=g.yes.n+g.no.n;
  const row=(lbl,m,cls)=>`<tr${cls?` class="${cls}"`:''}><td class="lbl">${lbl}</td><td>${m.n}</td><td>${pct(m.n,all)}</td><td>${m.d}</td><td>${pct(m.d,m.n)}</td><td>${m.o}</td><td>${m.h}</td></tr>`;
  document.getElementById('prPkgTable').innerHTML=
    '<tr><th>النوع</th><th>عدد الأوردرات</th><th>النسبة من الإجمالي</th><th>اتسلم منهم</th><th>نسبة التسليم</th><th>🚚 لسه تحت التسليم</th><th>⏸️ Hold</th></tr>'+
    row('📦 فيها كلمة "باكدج"',g.yes)+row('بدون "باكدج"',g.no)+
    row('↳ منها: '+SP1,g.s1,'info')+
    row('↳ منها: '+SP2,g.s2,'info')+
    row('↳ منها: باقي الأوردرات',g.rest,'info')+
    row('الإجمالي',{n:all,d:g.yes.d+g.no.d,o:g.yes.o+g.no.o,h:g.yes.h+g.no.h},'total');
}

/* ---------------- ROUTER ---------------- */
function el(html){const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild;}
function go(hash){location.hash=hash;}
window.addEventListener('hashchange', render);

function render(){
  const main = document.getElementById('main');
  const hash = location.hash.replace('#/','') || 'home';
  const [route, param] = hash.split('/');
  document.querySelectorAll('#sidebar a.navlink').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#/'+route));
  let html = '';
  if(route==='home') html = viewHome();
  else if(route==='org') html = viewOrg();
  else if(route==='staff') html = viewStaff();
  else if(route==='employee') html = viewEmployee(param);
  else if(route==='dept') html = viewDept(param);
  else if(route==='flow') html = viewCompanyFlow();
  else if(route==='tasks') html = viewTasks();
  else if(route==='handover') html = viewHandover();
  else if(route==='profits') html = viewProfits();
  else if(route==='squad') html = '<div id="sq-root"></div>';
  else if(route==='sop') html = viewSopLibrary();
  else if(route==='sopdetail') html = viewSopDetail(param);
  else if(route==='training') html = viewTraining();
  else if(route==='search') html = viewSearch();
  else if(route==='policies') html = viewPolicies();
  else if(route==='onboarding') html = viewOnboarding();
  else if(route==='whatnow') html = viewWhatNow();
  else html = viewHome();
  main.innerHTML = html;
  wireCommon();
  if(route==='squad') Squad.mount();
}

function wireCommon(){
  document.querySelectorAll('.qa-item .q').forEach(q=>{
    q.onclick=()=>q.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('input[type=checkbox][data-ls]').forEach(cb=>{
    const key='chk_'+cb.dataset.ls;
    cb.checked = localStorage.getItem(key)==='1';
    cb.onchange=()=>localStorage.setItem(key, cb.checked?'1':'0');
  });
  const s=document.getElementById('liveSearch');
  if(s) s.oninput=()=>renderSearchResults(s.value);
}

function renderSearchResults(q){
  const box=document.getElementById('searchResults'); if(!box) return;
  q=q.trim();
  if(!q){box.innerHTML='';return;}
  const results=[];
  SOPS.forEach(s=>{ if((s.name+s.purpose+s.dept).includes(q)) results.push({k:'إجراء',t:s.name,href:'#/sopdetail/'+s.id}); });
  Object.entries(DEPTS).forEach(([k,d])=>{ if((d.name+d.purpose).includes(q)) results.push({k:'قسم',t:d.name,href:'#/dept/'+k}); });
  Object.entries(EMP).forEach(([k,e])=>{ if((e.name+e.title+e.role).includes(q)) results.push({k:'موظف',t:e.name,href:'#/employee/'+k}); });
  box.innerHTML = results.length? results.map(r=>`<div class="searchres" onclick="go('${r.href}')"><div class="k">${r.k}</div>${r.t}</div>`).join('') : '<p style="color:var(--muted)">لا نتائج.</p>';
}

     📋 ليستة الطلبات — خدمة العملاء بتختار منها (حاجة أو أكتر) بدل الكتابة
     زوّد أو شيل منتجات من هنا
     ===================================================================== */
  const ORDER_PRODUCTS = [
    'طقم محبس',
    'طقم فص',
    'طقم محبس وانسيال',
    'طقم فص وانسيال',
    'طقم محبس ودبلة تنجستين',
    'طقم فص ودبلة تنجستين',
    'طقم لازوردي',
    'طقم ضهر حية',
    'طقم ضهر حية وانسيال',
    'سلسلة اية كرسي',
    'طقم اية كرسي',
    
    'اسورة اية كرسي',
  ];

  // مصادر الأوردر اللي بتظهر في القايمة — زوّد أو شيل من هنا
  const ORDER_SOURCES = ['واتساب', 'بيدج كارا', 'بيدج دريم', 'فون', 'إرسال صفحة'];

  /* =====================================================================
     💰 العمولة
     - order     = عمولة الأوردر وهو لسه قيد التنفيذ
     - delivered = عمولة التسليم (بتحل مكان عمولة الأوردر، مش بتتجمع عليها)
     - عمولة الأوردر قبل التسليم بتتفعّل بس لو نسبة تسليمات الموظف أكتر من 50%
       (نسبة التسليم = اللي اتسلم ÷ (اللي اتسلم + اللي اتلغى)، والأوردرات اللي لسه قيد التنفيذ مش داخلة فيها)
     - النظام ده بيتطبق على كل الأوردرات، القديمة والجديدة
     - ⚠️ النسبة اللي بتظهر للموظفين في الشاشات (delRate) = اللي اتسلم ÷ إجمالي الأوردرات
     ===================================================================== */
  const RULES_FROM = '2026-10-07';
  const STD_COMM = { order:5, delivered:15 };
  const SOURCE_COMM = {
    'واتساب':      STD_COMM,
    'بيدج كارا':   STD_COMM,
    'بيدج دريم':   STD_COMM,
    'فون':         STD_COMM,
    'إرسال صفحة':  { order:10, delivered:30 },
  };
  const MIN_RATE = 0.5;

  // النظام القديم (حسب السعر) — للأوردرات اللي قبل RULES_FROM بس
  function oldCommission(amount){
    const amt = Number(amount);
    if(!amt || amt <= 0) return 0;
    if(amt <= 350) return 20;
    if(amt <= 500) return 45;
    if(amt <= 700) return 60;
    if(amt <= 850) return 85;
    return Math.round(amt * 0.10 * 100) / 100;
  }
  const pad2 = n => String(n).padStart(2, '0');
  const localYmd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const isNewRule = () => true; // كل الأوردرات (القديمة والجديدة) بتتحسب بالنظام الجديد
  const rulesFor = o => SOURCE_COMM[o && o.page_name] || STD_COMM;
  function deliveredCommission(o){
    if(isNewRule(o)) return rulesFor(o).delivered;
    const amt = Number(o && o.amount);
    if(amt && amt > 0) return oldCommission(amt);
    return Math.round((Number(o && o.commission) || 0) * 100) / 100;
  }
  const pendingCommission = o => isNewRule(o) ? rulesFor(o).order : 0;
  // 📏 لو عمود المقاس لسه مش متضاف في Supabase، الأوردر بيتسجل من غيره بدل ما يفشل خالص
  const missingSizeCol = e => !!e && /size/i.test(e.message || '') && /column|schema/i.test(e.message || '');
  const SIZE_SQL_MSG = 'المقاس مااتحفظش في قاعدة البيانات — لازم سطر الـ SQL بتاع عمود المقاس يتشغّل في Supabase. (المقاس اتبعت للشيت عادي)';
  function commissionSummary(orders){
    let delivered = 0, cancelled = 0, pending = 0, delComm = 0, pendComm = 0;
    (orders || []).forEach(o => {
      if(o.status === 'delivered'){ delivered++; delComm += deliveredCommission(o); }
      else if(o.status === 'cancelled') cancelled++;
      else { pending++; pendComm += pendingCommission(o); }
    });
    const decided = delivered + cancelled;
    const rate = decided ? delivered / decided : null;
    const active = rate !== null && rate > MIN_RATE;
    const r2 = n => Math.round(n * 100) / 100;
    const totalN = (orders || []).length;
    const delRate = totalN ? delivered / totalN : null; // ✅ نسبة التسليم الصح = اتسلم ÷ إجمالي الأوردرات
    return { total:totalN, delivered, cancelled, pending, rate, delRate, active,
      delComm:r2(delComm), pendComm:r2(pendComm), commission:r2(delComm + (active ? pendComm : 0)) };
  }
  const rateTxt = r => r === null || r === undefined ? '—' : (Math.round(r * 1000) / 10) + '%';

  /* ✅ عميل Supabase واحد مشترك للصفحة كلها (Squad + الدخول + المخزن + EOD + ...)
     قبل كده كان فيه عميلين بيجدّدوا التوكن في نفس الوقت، فواحد فيهم يفضل ماسك
     توكن قديم ويطلع "JWT expired". ولو حصل وانتهى التوكن، الطلب بيجدّده ويعيد نفسه مرة. */
  const sb = window.__sbClient || (window.__sbClient = (function(){
    if(!(window.supabase && window.supabase.createClient)) return null;
    let client = null;
    const isExpired = async r => {
      if(r.status !== 401) return false;
      try{ return /jwt expired|invalid jwt|jwt/i.test(await r.clone().text()); }catch(e){ return false; }
    };
    const smartFetch = async (input, init) => {
      let res = await fetch(input, init);
      const url = typeof input === 'string' ? input : ((input && input.url) || '');
      if(client && !url.includes('/auth/v1/') && await isExpired(res)){
        const { data, error } = await client.auth.refreshSession();
        if(!error && data && data.session){
          const headers = new Headers((init && init.headers) || {});
          headers.set('Authorization', 'Bearer ' + data.session.access_token);
          res = await fetch(input, { ...(init || {}), headers });
        } else {
          window.dispatchEvent(new Event('sb-session-dead')); // الجلسة خلصت خالص → بوابة الدخول بتطلب تسجيل دخول تاني
        }
      }
      return res;
    };
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false },
      global: { fetch: smartFetch }
    });
    // لما الشاشة ترجع بعد ما الجهاز نام أو التاب اتساب فترة، جدّد الجلسة على طول
    document.addEventListener('visibilitychange', () => { if(!document.hidden) client.auth.getSession(); });
    return client;
  })());

  let state = {
    ready: false,
    view: 'login', // login | signup | dashboard | new-order | leaderboard
    session: null,
    profile: null,
    loading: false,
    error: '',
    info: '',
    editingOrder: null,
    myOrders: [],
    board: null,
    boardLoading: false,
    viewAgent: null,      // {id, name} — الأدمن بيتفرج على أوردرات حد
    agentOrders: null,
    agentFilter: 'all',
    agentQ: '',
    sync: { from:'', loading:false, msg:'', err:'', done:'', result:null, sel:new Set(), applying:false },
  };
  const canViewAll = () => !!(window.AuthGate && window.AuthGate.isFull && window.AuthGate.isFull());
  // عدد الأوردرات من كل مصدر: [['إرسال صفحة',7],['واتساب',3]]
  function sourceCounts(orders){
    const m = {};
    (orders || []).forEach(o => { const k = (o.page_name || '').trim() || 'بدون مصدر'; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  const sourceChips = list => list.length
    ? `<div class="sq-srcs">${list.map(([k, n]) => `<span class="sq-src">${esc(k)} <b>${n}</b></span>`).join('')}</div>` : '';
  let profileNameMap = {};
  let pendingView = null; // لو حد داس "فتح نظام الطلبات" من صفحة تانية قبل ما يسجل دخول

  function setState(patch){ state = { ...state, ...patch }; render(); }

  /* ---------- helpers ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const usernameToEmail = u => `${u.trim().toLowerCase()}@${EMAIL_DOMAIN}`;
  const emailToUsername = e => e.split('@')[0];
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { day:'numeric', month:'short', year:'numeric' }) + ' — ' +
           d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  }
  // التاريخ والساعة بالظبط بتوقيت القاهرة (للشيت)
  function cairoStamp(d){
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone:'Africa/Cairo', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).formatToParts(d).forEach(x => p[x.type] = x.value);
    const date = `${p.year}-${p.month}-${p.day}`, time = `${p.hour === '24' ? '00' : p.hour}:${p.minute}:${p.second}`;
    return { date, time, full: date + ' ' + time };
  }
  function statusLabel(s){
    if(s === 'delivered') return { text:'اتسلم', cls:'delivered' };
    if(s === 'cancelled') return { text:'اتلغى', cls:'cancelled' };
    return { text:'قيد التنفيذ', cls:'pending' };
  }

  /* ---------- Toasts (بتظهر في أي صفحة) ---------- */
  function showToast(message, type){
    const stack = document.getElementById('sq-toasts');
    if(!stack) return;
    const t = document.createElement('div');
    t.className = 'sq-toast' + (type ? ` ${type}` : '');
    const emoji = type === 'error' ? '⚠️' : type === 'success' ? '✅' : '🔔';
    t.innerHTML = `<span>${emoji}</span><span>${esc(message)}</span>`;
    stack.appendChild(t);
    setTimeout(() => {
      t.style.transition = 'opacity .25s ease, transform .25s ease';
      t.style.opacity = '0';
      t.style.transform = 'translateY(-8px)';
      setTimeout(() => t.remove(), 250);
    }, 4200);
  }

  /* ---------- Auth ---------- */
  async function doLogin(username, password){
    setState({ loading:true, error:'' });
    const { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
    if(error){ setState({ loading:false, error:'اليوزرنيم أو الباسورد غلط. جرب تاني.' }); return; }
    await afterAuth(data.session);
  }

  async function doSignup(username, fullName, password){
    setState({ loading:true, error:'' });
    const { data, error } = await sb.auth.signUp({
      email: usernameToEmail(username),
      password,
      options: { data: { username: username.trim().toLowerCase(), full_name: fullName } }
    });
    if(error){
      if(String(error.message||'').toLowerCase().includes('already')){
        setState({ loading:false, error:'اليوزرنيم ده متسجل قبل كده. جرب تسجيل دخول أو اسم تاني.' });
      } else {
        setState({ loading:false, error:'حصلت مشكلة: ' + error.message });
      }
      return;
    }
    if(data.user){
      await sb.from('profiles').upsert({ id: data.user.id, username: username.trim().toLowerCase(), full_name: fullName });
    }
    if(data.session){
      await afterAuth(data.session);
    } else {
      setState({ loading:false, view:'login', info:'اتعمل الحساب. لو مطلوب تأكيد إيميل هيوصلك، وإلا سجل دخول دلوقتي.' });
    }
  }

  async function doLogout(){
    unsubscribeOrderFeed();
    await sb.auth.signOut();
    setState({ view:'login', session:null, profile:null, myOrders:[], board:null, info:'', error:'' });
  }

  async function afterAuth(session){
    const { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    let profile = prof;
    if(!profile){
      const username = emailToUsername(session.user.email);
      await sb.from('profiles').upsert({ id: session.user.id, username });
      profile = { id: session.user.id, username };
    }
    const view = pendingView || 'dashboard';
    pendingView = null;
    setState({ loading:false, session, profile, view, error:'' });
    loadMyOrders();
    loadLeaderboard();
    subscribeOrderFeed();
  }

  /* ---------- Data ---------- */
  async function loadMyOrders(){
    const { data, error } = await sb.from('orders').select('*')
      .eq('agent_id', state.session.user.id)
      .order('created_at', { ascending:false });
    if(!error) setState({ myOrders: data || [] });
  }

  async function createOrder(payload){
    setState({ loading:true, error:'' });
    const newRow = {
      agent_id: state.session.user.id,
      customer_name: payload.customer_name,
      customer_phone: payload.customer_phone,
      customer_address: payload.customer_address,
      page_name: payload.page_name,
      amount: payload.amount ? Number(payload.amount) : null,
      order_details: payload.order_details,
      size: payload.size || null,
      status: 'pending',
      commission: rulesFor(payload).delivered
    };
    let { data: row, error } = await sb.from('orders').insert(newRow).select().maybeSingle();
    if(missingSizeCol(error)){
      delete newRow.size;
      ({ data: row, error } = await sb.from('orders').insert(newRow).select().maybeSingle());
      if(!error) showToast(SIZE_SQL_MSG, 'error');
    }
    if(error){ setState({ loading:false, error:'مقدرناش نضيف الأوردر: ' + error.message }); return; }
    // الوقت بالظبط اللي الأوردر اتسجل بيه في السيستم (من قاعدة البيانات نفسها)
    sendOrderToGoogleSheet(payload, row && row.created_at ? new Date(row.created_at) : new Date());
    newOrderType = '';
    await loadMyOrders();
    setState({ loading:false, view:'dashboard', info:'اتضاف الأوردر بنجاح.' });
    showToast('اتسجل الأوردر بنجاح وبقى تحت اسمك 🎉', 'success');
  }

  function sendOrderToGoogleSheet(payload, when){
    if(!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.startsWith('PASTE-')) return;
    const agentUsername = state.profile?.username
      || (state.session?.user?.email ? emailToUsername(state.session.user.email) : '');
    const st = cairoStamp(when || new Date());
    // A اسم / B رقم تلفون / C عنوان / D سعر / E اسم المستخدم / F فاضي / G الطلب / H مصدر البيدج / I المقاس
    // + order_datetime / order_date / order_time = وقت تسجيل الأوردر بالظبط (بتوقيت القاهرة)
    fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        customer_name: payload.customer_name,
        customer_phone: payload.customer_phone,
        customer_address: payload.customer_address,
        amount: payload.amount,
        agent_username: agentUsername,
        order_details: payload.order_details,
        page_name: payload.page_name,
        size: payload.size || '',
        order_type: payload.order_type || '',
        order_datetime: st.full,
        order_date: st.date,
        order_time: st.time,
        created_at: (when || new Date()).toISOString()
      })
    }).catch(() => {});
  }

  async function updateOrderStatus(orderId, status){
    const { data, error } = await sb.from('orders').update({ status }).eq('id', orderId).select('id');
    if(error || !data || !data.length)
      showToast('الحالة مااتغيرتش' + (error ? ': ' + error.message : ' — قاعدة البيانات رفضت التعديل.'), 'error');
    await loadMyOrders();
    loadLeaderboard();
  }

  async function submitEditOrder(order, payload){
    setState({ loading:true, error:'' });
    const patch = {
      customer_name: payload.customer_name,
      customer_phone: payload.customer_phone,
      customer_address: payload.customer_address,
      page_name: payload.page_name,
      amount: payload.amount ? Number(payload.amount) : null,
      order_details: payload.order_details,
      size: payload.size || null,
      commission: isNewRule(order) ? rulesFor(payload).delivered : oldCommission(payload.amount)
    };
    let { data: upd, error } = await sb.from('orders').update(patch).eq('id', order.id).select('id');
    if(missingSizeCol(error)){
      delete patch.size;
      ({ data: upd, error } = await sb.from('orders').update(patch).eq('id', order.id).select('id'));
      if(!error) showToast(SIZE_SQL_MSG, 'error');
    }
    if(error){ setState({ loading:false, error:'مقدرناش نعدّل الأوردر: ' + error.message }); return; }
    if(!upd || !upd.length){ setState({ loading:false, error:'التعديل مااتحفظش — قاعدة البيانات رفضت التعديل. لازم كود الـ SQL الجديد يتشغّل في Supabase.' }); return; }
    await loadMyOrders();
    loadLeaderboard();
    setState({ loading:false, editingOrder:null });
    showToast('اتعدّل الأوردر بنجاح.', 'success');
  }

  async function deleteOrder(order){
    const label = order.customer_name ? `أوردر "${order.customer_name}"` : 'الأوردر ده';
    if(!window.confirm(`متأكد إنك عايز تمسح ${label}؟ الخطوة دي مش هترجع.`)) return;
    // .select() بيرجّع الصفوف اللي اتمسحت فعلاً — لو رجع فاضي يبقى قاعدة البيانات رفضت المسح من غير ما تطلع إيرور
    const { data, error } = await sb.from('orders').delete().eq('id', order.id).select('id');
    if(error){ showToast('مقدرناش نمسح الأوردر: ' + error.message, 'error'); return; }
    if(!data || !data.length){
      showToast('الأوردر مااتمسحش — قاعدة البيانات مش مدية صلاحية المسح. لازم كود الـ SQL الجديد يتشغّل في Supabase.', 'error');
      await loadMyOrders();
      return;
    }
    await loadMyOrders();
    loadLeaderboard();
    showToast('اتمسح الأوردر.', 'success');
  }

  async function loadLeaderboard(){
    setState({ boardLoading:true });
    const { data, error } = await sb.from('orders').select('agent_id, status, amount, commission, page_name, created_at');
    if(error){ setState({ boardLoading:false, boardError:'مقدرناش نجيب بيانات اللوحة.' }); return; }
    const { data: profiles } = await sb.from('profiles').select('id, username, full_name');
    const nameMap = {};
    (profiles||[]).forEach(p => nameMap[p.id] = p.full_name || p.username || 'موظف');
    profileNameMap = nameMap;

    const byAgent = {};
    (data||[]).forEach(o => (byAgent[o.agent_id] = byAgent[o.agent_id] || []).push(o));
    const rows = Object.keys(byAgent).map(id => {
      const s = commissionSummary(byAgent[id]);
      return { id, name: nameMap[id] || 'موظف', total: s.total, delivered: s.delivered, rate: s.rate, delRate: s.delRate, commission: s.commission, sources: sourceCounts(byAgent[id]) };
    }).sort((a,b) => b.delivered - a.delivered || b.total - a.total);
    setState({ boardLoading:false, board: rows });
  }

  /* ---------- Realtime: إشعار بأي أوردر جديد ---------- */
  let orderFeedChannel = null;
  function subscribeOrderFeed(){
    if(orderFeedChannel) return;
    orderFeedChannel = sb.channel('orders-feed')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'orders' }, (payload) => {
        const o = payload.new;
        const isMine = o.agent_id === state.session?.user?.id;
        const agentName = isMine ? 'إنت' : (profileNameMap[o.agent_id] || 'زميلك');
        const who = isMine ? 'سجّلت أوردر جديد' : `${agentName} سجّل أوردر جديد`;
        const customer = o.customer_name ? ` — ${o.customer_name}` : '';
        showToast(`🧾 ${who}${customer}`, isMine ? 'success' : null);
        if(isMine) loadMyOrders();
        loadLeaderboard();
      })
      .subscribe();
  }
  function unsubscribeOrderFeed(){
    if(orderFeedChannel){ sb.removeChannel(orderFeedChannel); orderFeedChannel = null; }
  }

  /* ---------- Views ---------- */
  const head = (t, p) => `<div class="pagehead"><h1>${t}</h1><p>${p}</p></div>`;

  function SignupView(){
    return head('🏆 Squad', 'اعمل حساب واحد لكل موظف، والأوردرات هتتسجل على اسمه.') + `
      <div class="sq-auth">
        <h2>حساب جديد</h2>
        ${state.error ? `<div class="sq-err">${esc(state.error)}</div>` : ''}
        <form id="sq-signup-form">
          <div class="sq-field"><label for="sq-signup-fullname">الاسم كامل</label>
            <input type="text" id="sq-signup-fullname" required></div>
          <div class="sq-field"><label for="sq-signup-username">اليوزرنيم (من غير مسافات)</label>
            <input type="text" id="sq-signup-username" pattern="[A-Za-z0-9_\.]+" required></div>

  // "طقم محبس ×2 + طقم فص" ← [{name:'طقم محبس',qty:2},{name:'طقم فص',qty:1}]
  function parseDetails(s){
    const out = [];
    String(s || '').split(/\s*\+\s*|\n/).map(x => x.trim()).filter(Boolean).forEach(p => {
      const m = p.match(/^(.*?)\s*×\s*(\d+)$/);
      const name = (m ? m[1] : p).trim(), qty = m ? +m[2] : 1;
      const ex = out.find(x => x.name === name);
      if(ex) ex.qty += qty; else out.push({ name, qty });
    });
    return out;
  }
  function productPicker(prefix, details){
    const sel = parseDetails(details);
    const names = ORDER_PRODUCTS.slice();
    sel.forEach(x => { if(!names.includes(x.name)) names.push(x.name); }); // أوردر قديم مكتوب بالإيد بيفضل ظاهر
    return `<div class="sq-field"><label>الطلب <span class="sq-hint">اختار حاجة أو أكتر، وغيّر العدد لو العميل طالب أكتر من واحدة</span></label>
      <div class="sq-picks" id="${prefix}-picks">
      ${names.map(n => { const s = sel.find(x => x.name === n), extra = !ORDER_PRODUCTS.includes(n);
        return `<div class="sq-pick ${s ? 'on' : ''}${extra ? ' extra' : ''}">
          <label><input type="checkbox" data-pick="${esc(n)}" ${s ? 'checked' : ''}><span>${esc(n)}</span></label>

  /* =====================================================================
     🔄 مطابقة أوردرات الـ Squad مع QP برقم موبايل العميل (للأدمن بس)
     - بيجيب الأوردرات اللي لسه "قيد التنفيذ" ويدوّر على نفس الرقم في QP
     - أوردر QP لازم يكون من يوم قبل أوردر الـ Squad لحد 20 يوم بعده
     - لو العميل ليه كذا أوردر في QP، بيفرّق بالسعر، ولو لسه مش واضح بيحطه في "محتاج مراجعة"
     - مفيش أي تغيير بيحصل غير لما الأدمن يدوس "تأكيد"
     ===================================================================== */
  const isAdminUser = () => !!(window.AuthGate && window.AuthGate.me && (window.AuthGate.me() || {}).is_admin);
  const numVal = v => parseFloat(String(v ?? '').replace(/[^\d.-]/g, '')) || 0;
  function phoneKey(v){
    let p = String(v || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
    if(p.startsWith('00')) p = p.slice(2);
    if(p.startsWith('20') && p.length >= 12) p = p.slice(2);
    if(p.startsWith('0')) p = p.slice(1);
    return p.length >= 9 ? p.slice(-10) : '';
  }
  function setSync(p){ state.sync = { ...state.sync, ...p }; render(); }
  const qpApi = () => window.QP && window.QP.api;
  const DAY = 864e5;

  async function runSync(){
    if(!isAdminUser()) return;
    const api = qpApi();
    if(!api || !api.hasCreds()){ setSync({ err:'لازم تسجّل دخول QP الأول من قسم 🚚 QP على الجهاز ده، وبعدين ترجع هنا.', result:null }); return; }
    setSync({ loading:true, err:'', done:'', result:null, msg:'بيجيب الأوردرات اللي لسه قيد التنفيذ...' });
    const { data: pend, error } = await sb.from('orders').select('*').or('status.is.null,status.eq.pending').order('created_at', { ascending:true });
    if(error){ setSync({ loading:false, err:'مقدرناش نجيب الأوردرات: ' + error.message }); return; }
    if(!pend || !pend.length){ setSync({ loading:false, result:{ empty:true } }); return; }

    const earliest = localYmd(new Date(pend[0].created_at));
    const from = state.sync.from && state.sync.from > earliest ? state.sync.from : earliest;
    const list = pend.filter(o => localYmd(new Date(o.created_at)) >= from);
    const qpFrom = localYmd(new Date(new Date(from + 'T12:00:00').getTime() - 2 * DAY));
    const to = localYmd(new Date());

    let qp;
    try{
      setSync({ msg:`بيجيب أوردرات QP من ${qpFrom} لـ ${to}...` });
      qp = await api.fetchRange(qpFrom, to, n => setSync({ msg:`بيجيب أوردرات QP... ${n} أوردر` }));
    }catch(e){
      setSync({ loading:false, err: /Failed to fetch|NetworkError/i.test(e.message) ? 'مش قادر يوصل لموقع QP. اتأكد من الإنترنت ومن دخول QP.' : 'خطأ من QP: ' + e.message });
      return;
    }

    // فهرس أوردرات QP برقم الموبايل
    const idx = {};
    qp.forEach(q => [q.phone, q.phone2, q.customer_phone].forEach(ph => {
      const k = phoneKey(ph); if(!k) return;
      (idx[k] = idx[k] || []); if(!idx[k].includes(q)) idx[k].push(q);
    }));
    const used = new Set();
    const res = { deliver:[], review:[], shipping:[], nomatch:[], skipped: pend.length - list.length, qpCount: qp.length, from };
    list.forEach(o => {
      const k = phoneKey(o.customer_phone);
      if(!k){ res.nomatch.push({ o, why:'رقم الموبايل مش مكتوب صح' }); return; }
      const t0 = new Date(o.created_at).getTime();
      let c = (idx[k] || []).filter(q => !used.has(q.serial)).filter(q => {
        const t = new Date(q.order_date).getTime();
        return isNaN(t) || (t >= t0 - 1.5 * DAY && t <= t0 + 20 * DAY);
      });
      if(!c.length){ res.nomatch.push({ o, why:'الرقم ده مش موجود في QP في الفترة دي' }); return; }
      const amt = Number(o.amount);
      if(c.length > 1 && amt > 0){ const m = c.filter(q => Math.abs(numVal(q.price) - amt) < 1); if(m.length) c = m; }
      c.sort((a, b) => Math.abs(new Date(a.order_date) - t0) - Math.abs(new Date(b.order_date) - t0));
      const anyDel = c.some(q => api.category(q) === 'delivered');
      const cats = new Set(c.map(q => api.category(q)));
      if(c.length === 1 || cats.size === 1){
        used.add(c[0].serial);
        (api.category(c[0]) === 'delivered' ? res.deliver : res.shipping).push({ o, q:c[0] });
      } else if(!anyDel){
        res.shipping.push({ o, q:c[0] });
      } else {
        res.review.push({ o, cands:c });
      }
    });
    setSync({ loading:false, msg:'', result:res, sel:new Set(res.deliver.map(x => String(x.o.id))) });
  }

  async function applySync(){
    const ids = [...state.sync.sel];
    if(!ids.length) return;
    if(!window.confirm(`هيتعلم ${ids.length} أوردر "اتسلم" والعمولة هتتحسب عليهم. تكمل؟`)) return;
    setSync({ applying:true, err:'' });
    let ok = 0;
    for(let i = 0; i < ids.length; i += 100){
      const part = ids.slice(i, i + 100);
      const { data, error } = await sb.from('orders').update({ status:'delivered' }).in('id', part).select('id');
      if(error){ setSync({ applying:false, err:'حصل خطأ أثناء التحديث: ' + error.message }); return; }
      ok += (data || []).length;
    }
    const fail = ids.length - ok;
    setSync({ applying:false, result:null, sel:new Set(),
      done: `✅ اتعلم ${ok} أوردر "اتسلم".` + (fail ? ` ⚠️ ${fail} أوردر مااتحدّثش — قاعدة البيانات رافضة إن الأدمن يعدّل أوردرات غيره، لازم كود الـ SQL يتشغّل.` : '') });
    loadMyOrders(); loadLeaderboard();
  }
