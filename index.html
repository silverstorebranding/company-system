    if(!isAdminUser()) return head('غير متاح', 'المطابقة مع QP للأدمن بس.');
    const S = state.sync, api = qpApi(), logged = !!(api && api.hasCreds());
    let h = head('🔄 مطابقة مع QP', 'بيقارن الأوردرات اللي لسه قيد التنفيذ بأوردرات QP برقم موبايل العميل، واللي اتسلم هناك تقدر تعلّمه "اتسلم" هنا.') + `
      <div class="sq-form" style="max-width:none;margin-bottom:18px">
        ${logged ? '' : '<div class="sq-err">لازم تسجّل دخول QP الأول من قسم <a href="#/qp">🚚 QP</a> على الجهاز ده.</div>'}
        <div class="sq-agentbar" style="margin:0">
          <label class="sq-synclbl">من تاريخ <input type="date" id="sq-sync-from" class="sq-agentq" style="flex:none" value="${esc(S.from)}"></label>
          <button type="button" class="sq-btn" id="sq-sync-run" ${S.loading || S.applying || !logged ? 'disabled' : ''}>${S.loading ? '⏳ بيطابق...' : '🔄 ابدأ المطابقة'}</button>
          <span class="sq-hint" style="margin:0">سيب التاريخ فاضي عشان يطابق كل الأوردرات اللي لسه قيد التنفيذ.</span>
        </div>
      </div>`;
    if(S.err) h += `<div class="sq-err">${esc(S.err)}</div>`;
    if(S.done) h += `<div class="sq-ok">${esc(S.done)}</div>`;
    if(S.loading) return h + `<div class="sq-loading">${esc(S.msg || 'بيشتغل...')}</div>`;
    const R = S.result; if(!R) return h;
    if(R.empty) return h + `<div class="sq-empty">مفيش أوردرات قيد التنفيذ دلوقتي.</div>`;

    const nm = id => esc(profileNameMap[id] || '—');
    const qd = q => { const d = new Date(q.order_date); return isNaN(d) ? '—' : d.toLocaleDateString('ar-EG', { day:'numeric', month:'short' }); };
    const qInfo = q => `<b>${esc(q.serial)}</b> · ${qd(q)} · ${numVal(q.price)} ج · <span class="sq-src">${esc(api.label(q))}</span>`;
    const base = o => `<td data-label="الموظف">${nm(o.agent_id)}</td><td data-label="العميل">${esc(o.customer_name || '—')}</td>
      <td class="mut" data-label="الموبايل">${esc(o.customer_phone || '—')}</td><td class="sq-det" data-label="الطلب">${esc(o.order_details || '—')}</td>
      <td class="mut" data-label="القيمة">${o.amount ? esc(o.amount) + ' ج' : '—'}</td><td class="mut" data-label="تاريخ الأوردر">${fmtDate(o.created_at)}</td>`;
    const ck = o => `<td data-label="تعليم"><input type="checkbox" class="sq-syncck" data-sync-ck="${esc(o.id)}" ${S.sel.has(String(o.id)) ? 'checked' : ''} aria-label="علّمه اتسلم"></td>`;
    const thead = extra => `<thead><tr>${extra ? '<th></th>' : ''}<th>الموظف</th><th>العميل</th><th>الموبايل</th><th>الطلب</th><th>القيمة</th><th>تاريخ الأوردر</th><th>في QP</th></tr></thead>`;

    h += `<div class="sq-stats">
      <div class="sq-stat"><div class="n green">${R.deliver.length}</div><div class="l">اتسلمت في QP</div></div>
      <div class="sq-stat"><div class="n gold">${R.review.length}</div><div class="l">محتاجة مراجعة</div></div>
      <div class="sq-stat"><div class="n">${R.shipping.length}</div><div class="l">لسه عند الشحن</div></div>
      <div class="sq-stat"><div class="n">${R.nomatch.length}</div><div class="l">مالهاش مطابقة</div></div>
    </div>
    <div class="sq-agentbar">
      <button type="button" class="sq-btn" id="sq-sync-apply" ${S.applying || !S.sel.size ? 'disabled' : ''}>${S.applying ? '⏳ بيحدّث...' : `✅ تأكيد — علّم <span id="sq-sync-n">${S.sel.size}</span> أوردر "اتسلم"`}</button>
      <button type="button" class="sq-btn ghost sq-sm" data-sync-all="1">تحديد كل اللي اتسلم</button>
      <button type="button" class="sq-btn ghost sq-sm" data-sync-all="0">شيل التحديد</button>
      <span class="sq-hint" style="margin:0">اتقارن ${R.qpCount} أوردر من QP${R.skipped ? ` · ${R.skipped} أوردر أقدم من التاريخ المختار مش داخلين` : ''}</span>
    </div>`;

    h += `<h3 class="sq-synch">✅ اتسلمت في QP — ${R.deliver.length}</h3><div class="sq-tablecard">${R.deliver.length
      ? `<table class="sq-table">${thead(true)}<tbody>${R.deliver.map(x => `<tr>${ck(x.o)}${base(x.o)}<td data-label="في QP">${qInfo(x.q)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="sq-empty">مفيش أوردرات اتسلمت في QP من اللي لسه قيد التنفيذ.</div>'}</div>`;

    if(R.review.length) h += `<h3 class="sq-synch">⚠️ محتاجة مراجعة — ${R.review.length}</h3>
      <p class="sq-hint" style="margin:0 0 8px">العميل ليه أكتر من أوردر في QP بحالات مختلفة ومش واضح أنهي فيهم. راجعها وعلّم اللي متأكد إنه اتسلم.</p>
      <div class="sq-tablecard"><table class="sq-table">${thead(true)}<tbody>${R.review.map(x => `<tr>${ck(x.o)}${base(x.o)}<td data-label="في QP">${x.cands.map(qInfo).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`;

    if(R.shipping.length) h += `<details class="sq-syncdet"><summary>🚚 لسه عند الشحن (مش متسلمة في QP) — ${R.shipping.length}</summary>
      <div class="sq-tablecard"><table class="sq-table">${thead(false)}<tbody>${R.shipping.map(x => `<tr>${base(x.o)}<td data-label="في QP">${qInfo(x.q)}</td></tr>`).join('')}</tbody></table></div></details>`;

    if(R.nomatch.length) h += `<details class="sq-syncdet"><summary>❓ مالهاش مطابقة في QP — ${R.nomatch.length}</summary>
      <div class="sq-tablecard"><table class="sq-table">${thead(false)}<tbody>${R.nomatch.map(x => `<tr>${base(x.o)}<td data-label="السبب" class="mut">${esc(x.why)}</td></tr>`).join('')}</tbody></table></div></details>`;
    return h;
  }

  /* ---------- 👁 أوردرات موظف معيّن (للأدمن ومن عنده كل الصلاحيات) ---------- */
  async function openAgent(id, name){
    if(!canViewAll()) return;
    setState({ view:'agent-orders', viewAgent:{ id, name }, agentOrders:null, agentFilter:'all', agentQ:'', error:'' });
    window.scrollTo({ top:0, behavior:'smooth' });
    const { data, error } = await sb.from('orders').select('*').eq('agent_id', id).order('created_at', { ascending:false });
    if(state.view !== 'agent-orders' || !state.viewAgent || state.viewAgent.id !== id) return;
    if(error){ setState({ agentOrders:[], error:'مقدرناش نجيب أوردرات الموظف: ' + error.message }); return; }
    setState({ agentOrders: data || [] });
  }

  function agentFiltered(){
    const q = state.agentQ.trim().toLowerCase();
    return (state.agentOrders || []).filter(o =>
      (state.agentFilter === 'all' || (state.agentFilter === 'pending' ? (o.status !== 'delivered' && o.status !== 'cancelled') : o.status === state.agentFilter)) &&
      (!q || [o.customer_name, o.customer_phone, o.order_details, o.size, o.page_name, o.customer_address].some(v => String(v || '').toLowerCase().includes(q))));
  }

  function AgentOrdersView(){
    const a = state.viewAgent || {};
    const back = `<button type="button" class="sq-btn ghost" id="sq-agent-back">→ رجوع للترتيب</button>`;
    if(!canViewAll()) return head('غير متاح', '') + back;
    let h = head(`أوردرات ${esc(a.name || '')}`, 'كل الأوردرات اللي الموظف ده سجلها.') + `<div class="sq-agentbar">${back}</div>`;
    if(state.error) h += `<div class="sq-err">${esc(state.error)}</div>`;
    if(state.agentOrders === null) return h + `<div class="sq-loading">بنجيب الأوردرات...</div>`;
    const all = state.agentOrders, s = commissionSummary(all), list = agentFiltered();
    const chip = (k, l, n) => `<button type="button" class="sq-fchip ${state.agentFilter === k ? 'on' : ''}" data-afilter="${k}">${l} <b>${n}</b></button>`;
    h += `<div class="sq-stats">
        <div class="sq-stat"><div class="n">${s.total}</div><div class="l">إجمالي الأوردرات</div></div>
        <div class="sq-stat"><div class="n green">${s.delivered}</div><div class="l">اتسلم</div></div>
        <div class="sq-stat"><div class="n">${rateTxt(s.delRate)}</div><div class="l">نسبة التسليم</div></div>
        <div class="sq-stat"><div class="n gold">${s.commission} ج</div><div class="l">إجمالي العمولة</div></div>
      </div>
      <div class="sq-agentsrc"><span>مصادر الأوردرات:</span>${sourceChips(sourceCounts(all)) || '<span class="sq-src">—</span>'}</div>
      <div class="sq-agentbar">
        ${chip('all', 'الكل', s.total)}${chip('pending', 'قيد التنفيذ', s.pending)}${chip('delivered', 'اتسلم', s.delivered)}${chip('cancelled', 'اتلغى', s.cancelled)}
        <input type="search" id="sq-agent-q" class="sq-agentq" placeholder="🔍 بحث بالاسم أو الموبايل أو الطلب..." value="${esc(state.agentQ)}">
        ${window.XLSX ? '<button type="button" class="sq-btn ghost sq-sm" id="sq-agent-xlsx">⬇️ Excel</button>' : ''}
      </div>
      <div class="sq-tablecard">
        ${list.length ? `<table class="sq-table">
          <thead><tr><th>العميل</th><th>الموبايل</th><th>العنوان</th><th>الطلب</th><th>المقاس</th><th>المصدر</th><th>القيمة</th><th>العمولة</th><th>الحالة</th><th>التاريخ</th></tr></thead>
          <tbody>${list.map(o => { const st = statusLabel(o.status); return `<tr>
            <td data-label="العميل">${esc(o.customer_name || '—')}</td>
            <td class="mut" data-label="الموبايل">${esc(o.customer_phone || '—')}</td>
            <td class="sq-det" data-label="العنوان">${esc(o.customer_address || '—')}</td>
            <td class="sq-det" data-label="الطلب">${esc(o.order_details || '—')}</td>
            <td data-label="المقاس">${esc(o.size || '—')}</td>
            <td class="mut" data-label="المصدر">${esc(o.page_name || '—')}</td>
            <td class="amount" data-label="القيمة">${o.amount ? esc(o.amount) + ' ج' : '—'}</td>
            <td class="mut" data-label="العمولة">${commCell(o, s.active)}</td>
            <td data-label="الحالة"><span class="sq-badge ${st.cls}">${st.text}</span></td>
            <td class="mut" data-label="التاريخ">${fmtDate(o.created_at)}</td></tr>`; }).join('')}</tbody></table>`
        : `<div class="sq-empty">${all.length ? 'مفيش أوردرات بالفلتر ده.' : 'الموظف ده لسه مسجلش أوردرات.'}</div>`}
      </div>`;
    return h;
  }

  function exportAgent(){
    const a = state.viewAgent || {}, list = agentFiltered();
    const ws = XLSX.utils.json_to_sheet(list.map(o => ({
      'العميل': o.customer_name || '', 'الموبايل': o.customer_phone || '', 'العنوان': o.customer_address || '',
      'الطلب': o.order_details || '', 'المقاس': o.size || '', 'المصدر': o.page_name || '', 'القيمة': o.amount ?? '',
      'الحالة': statusLabel(o.status).text, 'التاريخ': cairoStamp(new Date(o.created_at)).full })));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'الأوردرات');
    XLSX.writeFile(wb, `أوردرات ${a.name || ''} ${localYmd(new Date())}.xlsx`);
  }

  function LeaderboardView(){
    if(!state.board) return head('ترتيب الـSquad', 'ترتيب حسب عدد الأوردرات اللي اتسلمت.') + `<div class="sq-loading">بنجيب النتائج...</div>`;
    const rows = state.board;
    return head('ترتيب الـSquad', 'ترتيب حسب عدد الأوردرات اللي اتسلمت.') + `
      <div class="sq-tablecard">
        <div class="sq-board-row head"><div>#</div><div>الاسم</div><div class="c">إجمالي</div><div class="c">اتسلم</div><div class="c">العمولة</div></div>
        ${rows.length ? rows.map((r,i) => `
          <div class="sq-board-row">
            <div class="sq-rank ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</div>
            <div class="sq-name"><bdi>${esc(r.name)}</bdi> <small class="sq-rate">· نسبة التسليم ${rateTxt(r.delRate)}</small>
              ${sourceChips(r.sources)}
              ${canViewAll() ? `<button type="button" class="sq-viewbtn" data-view-agent="${esc(r.id)}" data-agent-name="${esc(r.name)}">👁 عرض الأوردرات</button>` : ''}</div>
            <div class="sq-metric c">${r.total}</div>
            <div class="sq-metric c">${r.delivered}</div>
            <div class="sq-metric gold c">${r.commission} ج</div>
          </div>`).join('') : `<div class="sq-empty">لسه مفيش أوردرات متسجلة من حد.</div>`}
      </div>`;
  }

  /* ---------- Render ---------- */
  function render(){
    const root = document.getElementById('sq-root');
    if(!root) return; // المستخدم في صفحة تانية من النظام
    if(!sb){
      root.innerHTML = head('🏆 Squad', '') + `<div class="sq-err">مكتبة Supabase ماتحمّلتش. اتأكد إن فيه إنترنت وحدّث الصفحة.</div>`;
      return;
    }
    if(!state.ready){ root.innerHTML = `<div class="sq-loading">بنجهز الـSquad...</div>`; return; }
    if(!state.session){
      root.innerHTML = state.view === 'signup' ? SignupView() : LoginView();
      wireAuthEvents();
      return;
    }
    let body;
    if(state.view === 'new-order') body = NewOrderView();
    else if(state.view === 'leaderboard') body = LeaderboardView();
    else if(state.view === 'agent-orders') body = AgentOrdersView();
    else if(state.view === 'qp-sync') body = SyncView();
    else body = DashboardView();
    root.innerHTML = Bar() + body;
    wireAppEvents();
  }

  function wireAuthEvents(){
    const $ = id => document.getElementById(id);
    if($('sq-go-signup')) $('sq-go-signup').onclick = () => setState({ view:'signup', error:'', info:'' });
    if($('sq-go-login')) $('sq-go-login').onclick = () => setState({ view:'login', error:'', info:'' });
    if($('sq-login-form')) $('sq-login-form').onsubmit = e => {
      e.preventDefault();
      doLogin($('sq-login-username').value, $('sq-login-password').value);
    };
    if($('sq-signup-form')) $('sq-signup-form').onsubmit = e => {
      e.preventDefault();
      doSignup($('sq-signup-username').value, $('sq-signup-fullname').value, $('sq-signup-password').value);
    };
  }

  function wireAppEvents(){
    const $ = id => document.getElementById(id);
    document.querySelectorAll('[data-sqnav]').forEach(btn => {
      btn.onclick = () => {
        const v = btn.getAttribute('data-sqnav');
        setState({ view:v, error:'', info:'' });
        if(v === 'leaderboard' || v === 'dashboard') loadLeaderboard();
      };
    });
    if($('sq-logout')) $('sq-logout').onclick = doLogout;

    // 🔄 مطابقة مع QP
    if($('sq-sync-from')) $('sq-sync-from').onchange = e => { state.sync.from = e.target.value; };
    if($('sq-sync-run')) $('sq-sync-run').onclick = runSync;
    if($('sq-sync-apply')) $('sq-sync-apply').onclick = applySync;
    const syncCount = () => {
      const n = $('sq-sync-n'); if(n) n.textContent = state.sync.sel.size;
      const b = $('sq-sync-apply'); if(b) b.disabled = state.sync.applying || !state.sync.sel.size;
    };
    document.querySelectorAll('#sq-root [data-sync-ck]').forEach(cb => {
      cb.onchange = () => { const id = cb.getAttribute('data-sync-ck'); if(cb.checked) state.sync.sel.add(id); else state.sync.sel.delete(id); syncCount(); };
    });
    document.querySelectorAll('#sq-root [data-sync-all]').forEach(b => {
      b.onclick = () => {
        const R = state.sync.result; if(!R) return;
        setSync({ sel: b.getAttribute('data-sync-all') === '1' ? new Set(R.deliver.map(x => String(x.o.id))) : new Set() });
      };
    });

    // 👁 أوردرات أي موظف (للأدمن ومن عنده كل الصلاحيات)
    document.querySelectorAll('#sq-root [data-view-agent]').forEach(b => {
      b.onclick = () => openAgent(b.getAttribute('data-view-agent'), b.getAttribute('data-agent-name'));
    });
    if($('sq-agent-back')) $('sq-agent-back').onclick = () => { setState({ view:'leaderboard', viewAgent:null, agentOrders:null, error:'' }); loadLeaderboard(); };
    document.querySelectorAll('#sq-root [data-afilter]').forEach(b => { b.onclick = () => setState({ agentFilter: b.getAttribute('data-afilter') }); });
    if($('sq-agent-q')) $('sq-agent-q').oninput = e => {
      const pos = e.target.selectionStart;
      setState({ agentQ: e.target.value });
      const n = $('sq-agent-q'); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(x){} }
    };
    if($('sq-agent-xlsx')) $('sq-agent-xlsx').onclick = exportAgent;

    // 📋 ليستة الطلب: تفعيل خانة العدد لما الحاجة تتختار
    document.querySelectorAll('#sq-root .sq-pick input[type=checkbox]').forEach(cb => {
      cb.onchange = () => {
        const div = cb.closest('.sq-pick');
        div.classList.toggle('on', cb.checked);
        const q = div.querySelector('.sq-qty');
        q.disabled = !cb.checked;
        if(!cb.checked) q.value = 1;
      };
    });

    document.querySelectorAll('#sq-new-types .sq-type').forEach(b => {
      b.onclick = () => setOrderType('sq-new', b.dataset.otype);
    });
    if($('sq-order-form')) $('sq-order-form').onsubmit = e => {
      e.preventDefault();
      if(!newOrderType){ showToast('حدد الأول البراند: اكسسوارات ولا RS ولا Bloom.', 'error'); return; }
      const p = readFields('sq-new');
      if(newOrderType === 'acc' && !p.order_details){ showToast('اختار الطلب من الليستة الأول.', 'error'); return; }
      createOrder(p);
    };

    document.querySelectorAll('#sq-root .sq-status').forEach(sel => {
      sel.onchange = () => updateOrderStatus(sel.getAttribute('data-order-id'), sel.value);
    });
    const findOrder = id => (state.myOrders || []).find(o => String(o.id) === String(id));
    document.querySelectorAll('#sq-root [data-edit-id]').forEach(btn => {
      btn.onclick = () => { const o = findOrder(btn.getAttribute('data-edit-id')); if(o) setState({ editingOrder:o, error:'' }); };
    });
    document.querySelectorAll('#sq-root [data-delete-id]').forEach(btn => {
      btn.onclick = () => { const o = findOrder(btn.getAttribute('data-delete-id')); if(o) deleteOrder(o); };
    });

    const close = () => setState({ editingOrder:null, error:'' });
    if($('sq-edit-form')) $('sq-edit-form').onsubmit = e => {
      e.preventDefault();
      const p = readFields('sq-edit');
      if(!p.order_details){ showToast('اختار الطلب من الليستة الأول.', 'error'); return; }
      submitEditOrder(state.editingOrder, p);
    };
    if($('sq-edit-close')) $('sq-edit-close').onclick = close;
    if($('sq-edit-cancel')) $('sq-edit-cancel').onclick = close;
    if($('sq-edit-bg')) $('sq-edit-bg').onclick = e => { if(e.target.id === 'sq-edit-bg') close(); };
  }

  /* ---------- Public API ---------- */
  async function init(){
    if(!sb){ state.ready = true; render(); return; }
    const { data: { session } } = await sb.auth.getSession();
    state.ready = true;
    if(session) await afterAuth(session);
    else render();
  }
  // بيتنده كل ما المستخدم يفتح صفحة Squad من القائمة
  function mount(){
    render();
    if(state.session) loadLeaderboard();
  }
  // زرار "فتح نظام الطلبات" في صفحات خدمة العملاء والإجراءات
  function openNewOrder(){
    if(state.session) state.view = 'new-order';
    else pendingView = 'new-order';
    state.error = ''; state.info = '';
    if(location.hash === '#/squad') render(); else go('#/squad');
  }

  return { init, mount, openNewOrder };
})();

/* ---------------- INIT ---------------- */
(function init(){
  const who=document.getElementById('whoami');
  who.innerHTML = Object.entries(EMP).map(([k,e])=>`<option value="${k}" ${k===currentUser?'selected':''}>${e.name} — ${e.title}</option>`).join('');
  document.getElementById('deptlinks').innerHTML = DEPT_ORDER.map(k=>[k,DEPTS[k]]).map(([k,d])=>`<a class="navlink" href="#/dept/${k}">${d.emoji} ${d.name}</a>`).join('');
  render();
  Squad.init(); // بيرجّع جلسة الدخول لو موجودة ويشغّل إشعارات الأوردرات الجديدة في كل الصفحات
})();

</script>

<style>

.ads-toolbar input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-family:inherit}
.ads-toolbar .mockbtn:disabled{opacity:.6;cursor:wait}
.ads-upd{font-size:12px;color:var(--muted)}
.ads-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:720px){.ads-kpis{grid-template-columns:repeat(2,1fr)}}
.ads-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ads-kpi .n{font-size:23px;font-weight:700;color:var(--brass)}
.ads-kpi .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.ads-brand{border-top:4px solid var(--c)}
.ads-brand h3{color:var(--c)}
.ads-share{background:var(--line);height:8px;border-radius:8px;overflow:hidden;margin-top:12px}
.ads-share i{display:block;height:100%;background:var(--c)}
.ads-sh{font-size:12px;color:var(--muted);margin-top:5px}
.ads-chart{overflow-x:auto}
.ads-chart svg{display:block;height:auto}
.ads-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.ads-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
table.pr td.cpo-good{color:#1f7a45;font-weight:700}
table.pr td.cpo-bad{color:#b3261e;font-weight:700}
.ads-fill{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px}
.ads-fill span{font-size:12.5px;color:var(--muted)}
/* ---- البوصلة ---- */
.cmp-set{display:flex;flex-wrap:wrap;gap:12px 18px;margin-bottom:10px}
.cmp-set label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.cmp-set input{width:95px;padding:6px 8px;border:1px solid var(--brass);border-radius:6px;background:var(--panel);color:var(--ink);text-align:center;font-family:inherit}
.ads-toolbar select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px}
table.pr td.cmp-pos{color:#1f7a45;font-weight:700}
table.pr td.cmp-neg{color:#b3261e;font-weight:700}
table.pr tr.cmp-row{cursor:pointer}
table.pr tr.cmp-row:hover td{background:var(--slate-l)}
table.pr tr.cmp-sel td{background:var(--slate-l);font-weight:700}
.cmp-verdict{border-inline-start:6px solid var(--muted)}
.cmp-verdict.pos{border-inline-start-color:#1f7a45}
.cmp-verdict.neg{border-inline-start-color:#b3261e}
.cmp-big{font-size:40px;font-weight:700;line-height:1.1;margin:4px 0 8px}
.cmp-verdict.pos .cmp-big{color:#1f7a45}
.cmp-verdict.neg .cmp-big{color:#b3261e}
.cmp-verdict p{margin:0 0 6px;font-size:14px}
</style>

<script>
(function(){
  /* ---------- إعدادات الشيت ---------- */
  const ADS_SHEET_ID = '1ZLQLKF-aNBXXeF_0ltB2RH_K7eH1tfCyKmtRri44DWw';
  const ADS_GID      = '1578295146';           // رقم التاب (من اللينك بعد gid=)
  const ADS_YEAR     = new Date().getFullYear(); // الشيت مكتوب فيه اليوم والشهر بس
  // أرقام الأعمدة: A=0, B=1, C=2 ... — لو ضفت براند جديد في الشيت ضيفه هنا
  // pr = اسم العمود اللي الإعلانات بتتحط فيه في جدول الأرباح
  const ADS_GROUPS = [
    { key:'dream',   name:'DREAM',   color:'#5b3f7a', spend:1, orders:2,  msgs:3,    pr:'dream',       prBrands:['dream','dream msg site','dream wa'] },
    { key:'cara',    name:'CARA',    color:'#2f5f73', spend:5, orders:6,  msgs:7,    pr:'cara silver', prBrands:['cara silver','cara silver un','cara wa'] },
    { key:'fastplt', name:'FASTPLT', color:'#8a6d3b', spend:9, orders:10, msgs:null, pr:'fastplt',     prBrands:['fastplt'] },
  ];
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  let adsData = null, adsLoading = false, adsError = '', adsLoadedAt = null, adsPromise = null;
  let adsFrom = '', adsTo = '';
  let prOrdersRange = null;

  /* ---------- helpers ---------- */
  const pad2 = n => String(n).padStart(2,'0');
  const adsKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const adsNum = v => { const s = String(v ?? '').trim(); if(!s || s.includes('#')) return 0; return parseFloat(s.replace(/[^\d.-]/g,'')) || 0; };
  const fmt = n => Math.round(n).toLocaleString('ar-EG');
  const cpoTxt = (s,o) => o ? fmt(s/o) : '—';
  const adsMonth = name => { const n = String(name).toLowerCase(); return MONTHS.findIndex(m => n.length >= 3 && m.startsWith(n.slice(0,3))); };
  const hasSpend = r => ADS_GROUPS.some(G => r.g[G.key].spend > 0 || r.g[G.key].orders > 0);
  const daySpend = r => ADS_GROUPS.reduce((s,G) => s + r.g[G.key].spend, 0);
  const dayOrders = r => ADS_GROUPS.reduce((s,G) => s + r.g[G.key].orders, 0);

  /* ---------- قراءة الشيت ---------- */
  function adsCSV(t){
    const rows = []; let row = [], cur = '', q = false;
    for(let i = 0; i < t.length; i++){
      const c = t[i];
      if(q){ if(c === '"'){ if(t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
      else if(c === '"') q = true;
      else if(c === ','){ row.push(cur); cur = ''; }
      else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if(cur || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function adsJsonp(base){
    return new Promise((resolve, reject) => {
      const cb = '__adsCb' + Date.now();
      const s = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 12000);
      function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){} s.remove(); }
      window[cb] = resp => {
        cleanup();
        if(!resp || resp.status === 'error' || !resp.table){ reject(new Error('sheet')); return; }
        resolve((resp.table.rows || []).map(r => (r.c || []).map(c => c ? (c.v ?? c.f ?? '') : '')));
      };
      s.src = base + '&tqx=responseHandler:' + cb;
      s.onerror = () => { cleanup(); reject(new Error('network')); };
      document.body.appendChild(s);
    });
  }

  async function adsFetchRows(){
    const base = `https://docs.google.com/spreadsheets/d/${ADS_SHEET_ID}/gviz/tq?gid=${ADS_GID}&headers=0`;
    try{
      const res = await fetch(base + '&tqx=out:csv&_=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const txt = await res.text();
      if(/<html/i.test(txt.slice(0,300))) throw new Error('not csv');
      return adsCSV(txt);
    }catch(e){
      return await adsJsonp(base); // طريقة بديلة لو المتصفح منع الأولى
    }
  }

  // بياخد الصفوف اللي أولها تاريخ زي "9September" ويتجاهل صفوف العناوين والإجماليات
  function adsParse(rows){
    const out = [];
    rows.forEach(r => {
      const m = String(r[0] ?? '').trim().match(/^(\d{1,2})\s*([A-Za-z]+)/);
      if(!m) return;
      const mon = adsMonth(m[2]); if(mon < 0) return;
      const d = new Date(ADS_YEAR, mon, +m[1]);
      const g = {};
      ADS_GROUPS.forEach(G => {
        g[G.key] = { spend: adsNum(r[G.spend]), orders: adsNum(r[G.orders]), msgs: G.msgs == null ? 0 : adsNum(r[G.msgs]) };
      });
      out.push({ key: adsKey(d), date: d, g });
    });
    return out.sort((a,b) => a.date - b.date);
  }

  function adsLoad(force){
    if(adsLoading) return adsPromise;
    if(adsData && !force) return Promise.resolve(adsData);
    adsLoading = true; adsError = ''; adsRerender();
    adsPromise = (async () => {
      try{
        const parsed = adsParse(await adsFetchRows());
        if(!parsed.length) throw new Error('empty');
        adsData = parsed; adsLoadedAt = new Date();
      }catch(e){
        adsError = e.message === 'empty'
          ? 'الشيت اتقرا بس مفيهوش صفوف بتواريخ (زي 1September). اتأكد إن رقم التاب (gid) صح.'
          : 'مش قادر يقرأ الشيت. اتأكد إن الشيت متشارك "Anyone with the link" بصلاحية Viewer وإن فيه إنترنت، وبعدين دوس "تحديث من الشيت".';
      }finally{ adsLoading = false; }
      adsRerender();
      return adsData;
    })();
    return adsPromise;
  }

  const inRange = (r, f, t) => (!f || r.key >= f) && (!t || r.key <= t);
  function adsSum(rows){
    const t = {};
    ADS_GROUPS.forEach(G => t[G.key] = { spend:0, orders:0, msgs:0 });
    rows.forEach(r => ADS_GROUPS.forEach(G => { const a = t[G.key], b = r.g[G.key]; a.spend += b.spend; a.orders += b.orders; a.msgs += b.msgs; }));
    return t;
  }

  /* ---------- الرسم البياني ---------- */
  function adsChart(days){
    if(!days.length) return '<p class="none">مفيش صرف في الفترة دي.</p>';
    const max = Math.max(1, ...days.map(daySpend));
    const bw = 20, gap = 8, H = 190, top = 8, bottom = 22, W = days.length * (bw + gap) + gap;
    let s = `<svg viewBox="0 0 ${W} ${H + top + bottom}" width="${Math.max(W, 320)}" role="img" aria-label="الصرف اليومي على الإعلانات">`;
    s += `<line x1="0" x2="${W}" y1="${H + top}" y2="${H + top}" style="stroke:var(--line)"/>`;
    days.forEach((r, i) => {
      const x = gap + i * (bw + gap);
      let y = H + top;
      ADS_GROUPS.forEach(G => {
        const v = r.g[G.key].spend; if(!v) return;
        const h = v / max * H; y -= h;
        s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${G.color}"><title>${r.date.getDate()}/${r.date.getMonth()+1} — ${G.name}: ${fmt(v)} ج</title></rect>`;
      });
      s += `<text x="${x + bw/2}" y="${H + top + 15}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${r.date.getDate()}</text>`;
    });
    return s + '</svg>';
  }

  /* ---------- صفحة الإعلانات ---------- */
  function viewAds(){
    const minK = adsData?.length ? adsData[0].key : '', maxK = adsData?.length ? adsData[adsData.length-1].key : '';
    const upd = adsLoadedAt ? 'آخر تحديث: ' + adsLoadedAt.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }) : '';
    let h = `<div class="pagehead"><h1>📢 الإعلانات</h1><p>المصروف على الإعلانات لكل براند يوم بيوم، والبيانات جاية مباشرة من جوجل شيت.</p></div>
    <div class="ads-toolbar">
      <label>من <input type="date" value="${adsFrom}" min="${minK}" max="${maxK}" onchange="Ads.setRange(this.value,null)"></label>
      <label>إلى <input type="date" value="${adsTo}" min="${minK}" max="${maxK}" onchange="Ads.setRange(null,this.value)"></label>
      <button class="linkbtn" onclick="Ads.quick('all')">الكل</button>
      <button class="linkbtn" onclick="Ads.quick('7d')">آخر 7 أيام</button>
      <button class="linkbtn" onclick="Ads.quick('yesterday')">امبارح</button>
      <button class="linkbtn" onclick="Ads.quick('today')">النهارده</button>
      <button class="mockbtn" onclick="Ads.refresh()" ${adsLoading ? 'disabled' : ''}>${adsLoading ? '⏳ بيحدّث...' : '🔄 تحديث من الشيت'}</button>
      <span class="ads-upd">${upd}</span>
    </div>`;

    if(adsError) h += `<div class="mono-note">${adsError}</div>`;
    if(!adsData){
      if(adsLoading) h += `<div class="card"><p class="none">بيجيب البيانات من جوجل شيت...</p></div>`;
      return h;
    }

    const rows = adsData.filter(r => inRange(r, adsFrom, adsTo));
    const days = rows.filter(hasSpend);
    const t = adsSum(rows);
    const T = Object.values(t).reduce((a,b) => ({ spend:a.spend+b.spend, orders:a.orders+b.orders }), { spend:0, orders:0 });

    h += `<div class="ads-kpis">
      <div class="ads-kpi"><div class="n">${fmt(T.spend)} ج</div><div class="l">إجمالي الصرف</div></div>
      <div class="ads-kpi"><div class="n">${fmt(T.orders)}</div><div class="l">إجمالي الأوردرات</div></div>
      <div class="ads-kpi"><div class="n">${cpoTxt(T.spend, T.orders)} ج</div><div class="l">متوسط تكلفة الأوردر (CPO)</div></div>
      <div class="ads-kpi"><div class="n">${days.length}</div><div class="l">أيام فيها صرف</div></div>
    </div>`;

    h += `<div class="grid3">` + ADS_GROUPS.map(G => {
      const a = t[G.key], sh = T.spend ? a.spend / T.spend * 100 : 0;
      return `<div class="card ads-brand" style="--c:${G.color}"><h3>${G.name}</h3>
        <div class="kpi">الصرف <b>${fmt(a.spend)} ج</b></div>
        <div class="kpi">الأوردرات <b>${fmt(a.orders)}</b></div>
        <div class="kpi">متوسط CPO <b>${cpoTxt(a.spend, a.orders)} ج</b></div>
        ${G.msgs != null ? `<div class="kpi">رسائل WA/MSG <b>${fmt(a.msgs)}</b></div>` : ''}
        <div class="ads-share"><i style="width:${sh}%"></i></div>
        <div class="ads-sh">${sh.toFixed(1)}% من إجمالي الصرف</div></div>`;
    }).join('') + `</div>`;

    h += `<div class="card"><h3>الصرف اليومي</h3>
      <div class="ads-chart" dir="ltr">${adsChart(days)}</div>
      <div class="ads-legend">${ADS_GROUPS.map(G => `<span><i style="background:${G.color}"></i>${G.name}</span>`).join('')}</div></div>`;

    // جدول يوم بيوم — الـCPO بيتلوّن مقارنة بمتوسط البراند في نفس الفترة
    const avg = {}; ADS_GROUPS.forEach(G => avg[G.key] = t[G.key].orders ? t[G.key].spend / t[G.key].orders : 0);
    const z = v => v ? fmt(v) : '—';
    const cpoCell = (s, o, a) => {
      if(!o) return `<td>${s ? '∞' : '—'}</td>`;
      const v = s / o, cls = a ? (v > a * 1.15 ? 'cpo-bad' : v < a * 0.9 ? 'cpo-good' : '') : '';
      return `<td class="${cls}">${fmt(v)}</td>`;
    };
    let tb = '<tr><th rowspan="2">اليوم</th>' +
      ADS_GROUPS.map(G => `<th colspan="3" style="background:${G.color}">${G.name}</th>`).join('') +
      '<th colspan="3" class="tot">الإجمالي</th></tr><tr>' +
      [...ADS_GROUPS, null].map(() => '<th>صرف</th><th>أوردرات</th><th>CPO</th>').join('') + '</tr>';
    tb += '<tr class="total"><td class="lbl">إجمالي الفترة</td>' +
      ADS_GROUPS.map(G => `<td>${z(t[G.key].spend)}</td><td>${z(t[G.key].orders)}</td><td>${cpoTxt(t[G.key].spend, t[G.key].orders)}</td>`).join('') +
      `<td>${z(T.spend)}</td><td>${z(T.orders)}</td><td>${cpoTxt(T.spend, T.orders)}</td></tr>`;
    [...days].reverse().forEach(r => {
      tb += `<tr><td class="lbl">${r.date.toLocaleDateString('ar-EG', { weekday:'short', day:'numeric', month:'short' })}</td>` +
        ADS_GROUPS.map(G => { const b = r.g[G.key]; return `<td>${z(b.spend)}</td><td>${z(b.orders)}</td>${cpoCell(b.spend, b.orders, avg[G.key])}`; }).join('') +
        `<td class="tot">${z(daySpend(r))}</td><td class="tot">${z(dayOrders(r))}</td><td class="tot">${cpoTxt(daySpend(r), dayOrders(r))}</td></tr>`;
    });
    h += `<div class="card"><h3>تفاصيل كل يوم</h3>
      <div class="tablewrap"><table class="pr">${tb}</table></div>
      <div class="ads-legend"><span style="color:#1f7a45">أخضر = CPO أقل من متوسط البراند بـ10% أو أكتر</span><span style="color:#b3261e">أحمر = أعلى من المتوسط بـ15% أو أكتر</span></div></div>`;
    return h;
  }

  /* ---------- ربط الإعلانات بجدول الأرباح ---------- */
  function adsInjectProfitsBtn(){
    const tbl = document.getElementById('prFullTable');
    if(!tbl || document.getElementById('adsFillBox')) return;
    const box = document.createElement('div');
    box.id = 'adsFillBox'; box.className = 'ads-fill';
    box.innerHTML = `<button class="mockbtn" onclick="Ads.fill()">📢 املأ الإعلانات من جوجل شيت</button>
      <span id="adsFillStatus">بيجمع الصرف لنفس فترة ملف الأوردرات: DREAM في عمود DREAM، وCARA في CARA SILVER، وFASTPLT في FASTPLT.</span>`;
    tbl.closest('.card').insertBefore(box, tbl.parentElement);
  }

  async function adsFill(){
    const st = document.getElementById('adsFillStatus');
    const inputs = [...document.querySelectorAll('#prFullTable input[data-man="ads"]')];
    if(!inputs.length){ st.textContent = 'شغّل التقرير الأول.'; return; }
    st.textContent = 'بيجيب الإعلانات من الشيت...';
    await adsLoad(true);
    if(!adsData){ st.textContent = adsError; return; }
    const R = prOrdersRange || { from:'', to:'' };
    const t = adsSum(adsData.filter(r => inRange(r, R.from, R.to)));
    ADS_GROUPS.forEach(G => inputs.forEach(inp => { if(inp.dataset.brand === G.pr) inp.value = Math.round(t[G.key].spend); }));
    if(typeof prRecalc === 'function') prRecalc();
    const period = R.from ? `من ${R.from} لـ ${R.to}` : 'لكل الشيت';
    st.textContent = `✅ اتملت ${period}: ` + ADS_GROUPS.map(G => `${G.name} ${fmt(t[G.key].spend)} ج`).join('، ');
  }

  /* =====================================================================
     🧭 البوصلة — الربح المتوقع لكل يوم من أرقام الإعلانات
     التكاليف نسبة من المبيعات المتوقعة، والإعلانات بالمبلغ الفعلي من الشيت
     ===================================================================== */
  const COMPASS_COSTS = [
    { lbl:'🧾 نثريات',        pct:0.03 },
    { lbl:'📦 بضاعة',         pct:0.11 },
    { lbl:'🚚 شحن',           pct:0.15 },
    { lbl:'👥 رواتب وإيجار',   pct:0.05 },
    { lbl:'💔 هوالك وأخرى',    pct:0.02 },
  ];
  const COMPASS_FIXED = COMPASS_COSTS.reduce((s,c) => s + c.pct, 0);
  let cmpDay = '', cmpMsg = '';
  let cmpSet = (() => { try{ return JSON.parse(localStorage.getItem('compass_settings')) || {}; }catch(e){ return {}; } })();
  cmpSet.aov = cmpSet.aov || {};
  if(cmpSet.dr == null) cmpSet.dr = 100;
  const cmpSave = () => { try{ localStorage.setItem('compass_settings', JSON.stringify(cmpSet)); }catch(e){} };
  const pctTxt = v => v == null ? '—' : (v * 100).toFixed(1) + '%';
  const sign = v => v == null || !v ? '' : v > 0 ? 'cmp-pos' : 'cmp-neg';

  function cmpCalc(spend, orders, aov){
    const dr = (+cmpSet.dr || 0) / 100;
    const rev = orders * aov * dr;
    const costs = COMPASS_COSTS.map(c => rev * c.pct);
    const total = spend + costs.reduce((s,v) => s + v, 0);
    const profit = rev - total;
    return { spend, orders, aov, rev, costs, total, profit,
      pct: rev ? profit / rev : null, adsPct: rev ? spend / rev : null,
      cpo: orders ? spend / orders : null, beCpo: aov * dr * (1 - COMPASS_FIXED) };
  }
  // بيحسب كل براند لوحده وبعدين الإجمالي
  function cmpCalcRows(rows){
    const per = {};
    ADS_GROUPS.forEach(G => {
      const s = rows.reduce((a,r) => a + r.g[G.key].spend, 0), o = rows.reduce((a,r) => a + r.g[G.key].orders, 0);
      per[G.key] = cmpCalc(s, o, +cmpSet.aov[G.key] || 0);
    });
    const P = Object.values(per), dr = (+cmpSet.dr || 0) / 100;
    const tot = { spend:0, orders:0, rev:0, total:0, profit:0, costs: COMPASS_COSTS.map(() => 0), wAov:0 };
    P.forEach(p => { tot.spend += p.spend; tot.orders += p.orders; tot.rev += p.rev; tot.total += p.total; tot.profit += p.profit; tot.wAov += p.orders * p.aov; p.costs.forEach((v,i) => tot.costs[i] += v); });
    tot.aov = tot.orders ? tot.wAov / tot.orders : 0;
    tot.pct = tot.rev ? tot.profit / tot.rev : null;
    tot.adsPct = tot.rev ? tot.spend / tot.rev : null;
    tot.cpo = tot.orders ? tot.spend / tot.orders : null;
    tot.beCpo = tot.aov * dr * (1 - COMPASS_FIXED);
    return { per, tot };
  }

  function cmpAovFromProfits(){
    if(typeof prBrandCalc === 'undefined' || !prBrandCalc || !Object.keys(prBrandCalc).length) return null;
    const out = {};
    ADS_GROUPS.forEach(G => {
      let rev = 0, del = 0;
      G.prBrands.forEach(b => { const c = prBrandCalc[b]; if(c){ rev += c.revenue; del += c.delivered; } });
      if(del) out[G.key] = Math.round(rev / del);
    });
    return Object.keys(out).length ? out : null;
  }

  const dayLabel = r => r.date.toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long' });

  function viewCompass(){
    let h = `<div class="pagehead"><h1>🧭 البوصلة</h1><p>الربح المتوقع لكل يوم، محسوب من الصرف وعدد الأوردرات اللي في شيت الإعلانات.</p></div>`;
    const days = adsData ? adsData.filter(r => r.g && ADS_GROUPS.some(G => r.g[G.key].spend > 0 || r.g[G.key].orders > 0)) : [];
    if(days.length && !days.some(d => d.key === cmpDay)) cmpDay = days[days.length-1].key;
    const r = days.find(d => d.key === cmpDay);

    h += `<div class="ads-toolbar">
      <label>اليوم <select onchange="Compass.pick(this.value)">${[...days].reverse().map(d => `<option value="${d.key}" ${d.key===cmpDay?'selected':''}>${dayLabel(d)}</option>`).join('')}</select></label>
      <button class="mockbtn" onclick="Ads.refresh()" ${adsLoading ? 'disabled' : ''}>${adsLoading ? '⏳ بيحدّث...' : '🔄 تحديث من الشيت'}</button>
    </div>`;
    if(adsError) h += `<div class="mono-note">${adsError}</div>`;
    if(!adsData){ if(adsLoading) h += `<div class="card"><p class="none">بيجيب البيانات من جوجل شيت...</p></div>`; return h; }
    if(!r) return h + `<div class="card"><p class="none">مفيش أيام فيها صرف في الشيت لسه.</p></div>`;

    // الإعدادات
    h += `<div class="card"><h3>⚙️ متوسط سعر الأوردر ونسبة التسليم</h3>
      <div class="cmp-set">
        ${ADS_GROUPS.map(G => `<label>${G.name} <input type="number" min="0" value="${cmpSet.aov[G.key] || ''}" placeholder="مثلاً 650" onchange="Compass.setAov('${G.key}',this.value)"> ج</label>`).join('')}
        <label>نسبة التسليم المتوقعة <input type="number" min="0" max="100" value="${cmpSet.dr}" onchange="Compass.setDr(this.value)"> %</label>
      </div>
      <div class="ads-fill"><button class="linkbtn" onclick="Compass.fromProfits()">خد متوسط السعر من تقرير الأرباح</button><span>${cmpMsg}</span></div>
      <p class="none">المبيعات المتوقعة = عدد الأوردرات × متوسط سعر الأوردر × نسبة التسليم. خلّي نسبة التسليم 100% لو عايز تحسب على كل الأوردرات. الأرقام دي بتتحفظ على الجهاز ده.</p>
    </div>`;

    const { per, tot } = cmpCalcRows([r]);
    const missing = ADS_GROUPS.filter(G => per[G.key].orders > 0 && !per[G.key].aov);
    if(missing.length) h += `<div class="mono-note">اكتب متوسط سعر الأوردر لـ ${missing.map(G => G.name).join(' و')} فوق، من غيره مبيعاته هتتحسب صفر.</div>`;

    // جدول تفاصيل اليوم
    const cols = [tot, ...ADS_GROUPS.map(G => per[G.key])];
    const z = v => v ? fmt(v) : '—';
    const row = (lbl, f, cls, tdCls) => `<tr${cls ? ` class="${cls}"` : ''}><td class="lbl">${lbl}</td>` +
      cols.map((c,i) => `<td class="${i===0 ? 'tot ' : ''}${tdCls ? tdCls(c) : ''}">${f(c)}</td>`).join('') + '</tr>';
    let tb = '<tr><th>البند</th><th class="tot">الإجمالي</th>' + ADS_GROUPS.map(G => `<th style="background:${G.color}">${G.name}</th>`).join('') + '</tr>';
    tb += row('🛒 عدد الأوردرات', c => z(c.orders));
    tb += row('🎯 سعر الكونفرجن (CPO)', c => c.cpo == null ? '—' : fmt(c.cpo));
    tb += row('💵 متوسط سعر الأوردر', c => z(c.aov));
    tb += row('📥 المبيعات المتوقعة', c => z(c.rev), 'info');
    tb += row('📢 الإعلانات (متغيرة)', c => c.spend ? `${fmt(c.spend)} <small>(${pctTxt(c.adsPct)})</small>` : '—');
    COMPASS_COSTS.forEach((k,i) => { tb += row(`${k.lbl} ${Math.round(k.pct*100)}%`, c => z(c.costs[i])); });
    tb += row('🔴 إجمالي التكاليف', c => z(c.total), 'total');
    tb += row('✅ صافي الربح المتوقع', c => (c.spend || c.rev) ? fmt(c.profit) : '—', 'profit', c => sign(c.profit));
    tb += row('📊 نسبة الربح', c => pctTxt(c.pct), '', c => sign(c.pct));
    tb += row('🧭 أقصى CPO قبل الخسارة', c => c.beCpo ? fmt(c.beCpo) : '—');
    h += `<div class="card"><h3>حسبة ${dayLabel(r)}</h3><div class="tablewrap"><table class="pr">${tb}</table></div></div>`;

    // كل الأيام
    const all = cmpCalcRows(days).tot;
    let dt = '<tr><th>اليوم</th><th>أوردرات</th><th>صرف</th><th>CPO</th><th>مبيعات متوقعة</th><th>نسبة الإعلانات</th><th>ربح متوقع</th><th>نسبة الربح</th></tr>';
    const dRow = (lbl, c, cls, click) => `<tr class="${cls}"${click ? ` onclick="Compass.pick('${click}')"` : ''}><td class="lbl">${lbl}</td><td>${z(c.orders)}</td><td>${z(c.spend)}</td><td>${c.cpo == null ? '—' : fmt(c.cpo)}</td><td>${z(c.rev)}</td><td>${pctTxt(c.adsPct)}</td><td class="${sign(c.profit)}">${fmt(c.profit)}</td><td class="${sign(c.pct)}">${pctTxt(c.pct)}</td></tr>`;
    dt += dRow('إجمالي كل الأيام', all, 'total');
    [...days].reverse().forEach(d => { dt += dRow(dayLabel(d), cmpCalcRows([d]).tot, 'cmp-row' + (d.key === cmpDay ? ' cmp-sel' : ''), d.key); });
    h += `<div class="card"><h3>كل الأيام</h3><p class="none" style="margin-bottom:8px">دوس على أي يوم عشان تشوف حسبته بالتفصيل.</p>
      <div class="tablewrap" style="max-height:420px;overflow-y:auto"><table class="pr">${dt}</table></div></div>`;

    // الخلاصة
    const cls = tot.pct == null ? '' : tot.pct > 0 ? 'pos' : 'neg';
    h += `<div class="card cmp-verdict ${cls}"><h3>🧭 نسبة الربح المتوقعة: ${dayLabel(r)}</h3>
      <div class="cmp-big">${pctTxt(tot.pct)}</div>
      ${tot.rev ? `<p>صافي ربح متوقع <b>${fmt(tot.profit)} ج</b> من مبيعات متوقعة <b>${fmt(tot.rev)} ج</b>.</p>
      <p>الإعلانات أخدت <b>${pctTxt(tot.adsPct)}</b> من المبيعات، وباقي التكاليف ثابتة <b>${Math.round(COMPASS_FIXED*100)}%</b>.</p>
      <p>عشان تفضل كسبان لازم الـ CPO يفضل تحت <b>${fmt(tot.beCpo)} ج</b>، والنهارده كان <b>${tot.cpo == null ? '—' : fmt(tot.cpo) + ' ج'}</b>.</p>`
      : `<p>اكتب متوسط سعر الأوردر فوق عشان النسبة تتحسب.</p>`}
    </div>`;
    return h;
  }

  // بنحفظ فترة ملف الأوردرات لما التقرير يشتغل
  if(typeof prProcess === 'function'){
    const _prProcess = prProcess;
    prProcess = function(rows){
      try{
        const ts = [];
        rows.forEach(r => { const v = r[PR_dateCol-1]; if(!v) return; const d = v instanceof Date ? v : new Date(v); if(!isNaN(d)) ts.push(+d); });
        prOrdersRange = ts.length ? { from: adsKey(new Date(Math.min(...ts))), to: adsKey(new Date(Math.max(...ts))) } : null;
      }catch(e){ prOrdersRange = null; }
      return _prProcess.apply(this, arguments);
    };
  }

  /* ---------- الربط مع الراوتر والقائمة ---------- */
  const route = () => (location.hash.replace('#/','') || 'home').split('/')[0];
  function adsRerender(){
    const r = route();
    if(r !== 'ads' && r !== 'compass') return;
    const main = document.getElementById('main');
    if(main) main.innerHTML = r === 'ads' ? viewAds() : viewCompass();
  }
  function adsAfterRender(){
    const r = route();
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/' + r));
    if(r === 'ads' || r === 'compass'){ adsRerender(); if(!adsData && !adsLoading) adsLoad(); }
    else if(r === 'profits') adsInjectProfitsBtn();
  }

  const profitsLink = document.querySelector('#sidebar a.navlink[href="#/profits"]');
  if(profitsLink && !document.querySelector('#sidebar a.navlink[href="#/ads"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/ads'; a.textContent = '📢 الإعلانات';
    profitsLink.after(a);
    const c = document.createElement('a');
    c.className = 'navlink'; c.href = '#/compass'; c.textContent = '🧭 البوصلة';
    a.after(c);
  }

  const _render = render;
  render = function(){ _render.apply(this, arguments); adsAfterRender(); };
  window.addEventListener('hashchange', adsAfterRender);

  window.Ads = {
    setRange(f, t){ if(f !== null) adsFrom = f; if(t !== null) adsTo = t; adsRerender(); },
    quick(k){
      const d = new Date(), day = 86400000;
      if(k === 'all'){ adsFrom = adsTo = ''; }
      else if(k === 'today'){ adsFrom = adsTo = adsKey(d); }
      else if(k === 'yesterday'){ adsFrom = adsTo = adsKey(new Date(+d - day)); }
      else if(k === '7d'){ adsFrom = adsKey(new Date(+d - 6*day)); adsTo = adsKey(d); }
      adsRerender();
    },
    refresh(){ adsLoad(true); },
    fill: adsFill,
  };

  window.Compass = {
    pick(k){ cmpDay = k; adsRerender(); },
    setAov(k, v){ cmpSet.aov[k] = Math.max(0, +v || 0); cmpSave(); adsRerender(); },
    setDr(v){ cmpSet.dr = Math.min(100, Math.max(0, +v || 0)); cmpSave(); adsRerender(); },
    fromProfits(){
      const a = cmpAovFromProfits();
      if(!a){ cmpMsg = 'مفيش تقرير أرباح متشغّل. افتح صفحة الأرباح وارفع ملف الأوردرات الأول.'; }
      else { Object.assign(cmpSet.aov, a); cmpSave(); cmpMsg = '✅ اتاخد متوسط سعر الأوردرات المُسلّمة من تقرير الأرباح.'; }
      adsRerender();
    },
  };

  adsAfterRender();
})();
</script>

<style>
.qp-auth{max-width:420px;margin:6px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px}

.qp-field{margin-bottom:14px}
.qp-field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.qp-field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;background:var(--panel);color:var(--ink);font-family:inherit}
.qp-field input:focus{outline:none;border-color:var(--brass)}
.qp-note{background:#fbf6e8;border:1px solid #e3d19c;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#6b5a1e;margin-bottom:14px}
:root[data-theme="dark"] .qp-note,:root:not([data-theme="light"]) .qp-note{background:#2a2716;color:#d8c78a;border-color:#5a4f28}
.qp-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}

.qp-toolbar input,.qp-toolbar select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px}

@media (max-width:520px){.qp-kpis{grid-template-columns:repeat(2,1fr)}}
.qp-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.qp-kpi .n{font-size:22px;font-weight:700;color:var(--brass)}
.qp-kpi .n.green{color:var(--ok)}
.qp-kpi .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.qp-stbar{display:flex;flex-wrap:wrap;gap:8px}
.qp-chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.qp-chip:hover{border-color:var(--brass)}

.qp-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--panel);color:var(--ink);font-size:14px}
