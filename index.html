table.pr tr.ds-day:hover td{background:#dfe8e5}
table.pr td.ds-neg{color:#b3423a;font-weight:700}
table.pr td.ds-pos{color:#276749;font-weight:700}
</style>
<script>
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { const x = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const isDS = () => (location.hash.replace('#/', '') || 'home').split('/')[0] === 'direct';
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';
  const dayLabel = k => new Date(k + 'T12:00:00').toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  let S = { rows:null, loading:false, busy:false, err:'', msg:'', msgErr:false,
            date: today(), kind:'sale', item:'', amount:'', from:'', to:'', q:'' };

  /* ---------- البيانات ---------- */
  async function load(){
    if(!sb()) return;
    S.loading = true; S.err = ''; draw();
    const { data, error } = await sb().from('direct_sales').select('*')
      .order('sale_date', { ascending:false }).order('created_at', { ascending:false }).limit(5000);
    S.loading = false;
    if(error){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(error.message)
        ? 'جدول المبيعات المباشرة لسه مش موجود في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب المبيعات: ' + error.message;
    } else S.rows = data || [];
    draw();
  }

  const filtered = () => {
    const q = S.q.trim().toLowerCase();
    return (S.rows || []).filter(r =>
      (!S.from || r.sale_date >= S.from) && (!S.to || r.sale_date <= S.to) &&
      (!q || String(r.item || '').toLowerCase().includes(q)));
  };
  function sums(list){
    const t = { s:0, r:0, ns:0, nr:0 };
    list.forEach(x => { if(x.kind === 'return'){ t.r += Number(x.amount); t.nr++; } else { t.s += Number(x.amount); t.ns++; } });
    t.net = t.s - t.r;
    return t;
  }
  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isDS()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function rangeTitle(){
    if(!S.from && !S.to) return 'كل الأيام';
    if(S.from && S.from === S.to) return dayLabel(S.from);
    return 'من ' + (S.from || 'البداية') + ' لـ ' + (S.to || 'النهارده');
  }

  function view(){
    const ret = S.kind === 'return';
    let h = `<div class="pagehead"><h1>🛒 المبيعات المباشرة</h1><p>سجّل المبيعات والمرتجعات بتاريخها، والسيستم بيحسب محصلة كل يوم (مبيعات − مرتجعات).</p></div>`;
    if(S.msg) h += `<div class="ds-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;

    h += `<div class="card">
      <h3>${ret ? '↩️ تسجيل مرتجع' : '➕ تسجيل مبيعة'}</h3>
      <div class="ds-kind">
        <button type="button" class="sale ${!ret ? 'on' : ''}" data-kind="sale">➕ مبيعة</button>
        <button type="button" class="ret ${ret ? 'on' : ''}" data-kind="return">↩️ مرتجع</button>
      </div>
      <div class="ds-form">
        <div><label for="dsDate">التاريخ</label><input class="ds-in" id="dsDate" type="date" value="${esc(S.date)}"></div>
        <div><label for="dsItem">${ret ? 'الطلب اللي رجع' : 'الطلب'}</label><input class="ds-in" id="dsItem" placeholder="مثلاً: طقم سلسلة ومحبس" value="${esc(S.item)}" autocomplete="off"></div>
        <div><label for="dsAmount">${ret ? 'المبلغ اللي رجع' : 'السعر'}</label><input class="ds-in" id="dsAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(S.amount)}"></div>
        <div><button class="ds-btn pri" data-act="add" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳...' : ret ? 'سجّل المرتجع' : 'سجّل المبيعة'}</button></div>
      </div>
    </div>`;

    h += `<div class="card"><div class="ds-bar">
      <label>من <input class="ds-in" type="date" id="dsFrom" value="${esc(S.from)}"></label>
      <label>إلى <input class="ds-in" type="date" id="dsTo" value="${esc(S.to)}"></label>
      <button class="ds-btn" data-range="today">النهارده</button>
      <button class="ds-btn" data-range="yesterday">امبارح</button>
      <button class="ds-btn" data-range="month">الشهر ده</button>
      <button class="ds-btn" data-range="last">الشهر اللي فات</button>
      <button class="ds-btn" data-range="all">الكل</button>
      <span style="flex:1"></span>
      ${window.XLSX ? '<button class="ds-btn" data-act="xlsx">⬇️ Excel</button>' : ''}
      <button class="ds-btn" data-act="reload">🔄 تحديث</button>
    </div>
    <input class="ds-in" id="dsQ" type="search" placeholder="🔍 دوّر باسم الطلب..." value="${esc(S.q)}"></div>`;

    if(S.err) return h + `<div class="ds-msg err">${esc(S.err)}</div>`;
    if(S.rows === null) return h + `<div class="card"><p class="none">⏳ بيحمّل المبيعات...</p></div>`;

    const list = filtered();
    const T = sums(list);
    h += `<div class="ds-kpis">
      <div class="ds-kpi sale"><div class="n">${fmt(T.s)} ج</div><div class="l">المبيعات (${fmt(T.ns)} عملية) — ${esc(rangeTitle())}</div></div>
      <div class="ds-kpi ret"><div class="n">${fmt(T.r)} ج</div><div class="l">المرتجعات (${fmt(T.nr)} عملية)</div></div>
      <div class="ds-kpi net"><div class="n">${fmt(T.net)} ج</div><div class="l">✅ المحصلة (مبيعات − مرتجعات)</div></div>
    </div>`;

    if(!list.length) return h + `<div class="card"><p class="none">مفيش مبيعات أو مرتجعات ${S.from || S.to ? 'في الفترة دي' : 'متسجلة لسه'}.</p></div>`;

    // تجميع حسب اليوم
    const days = {};
    list.forEach(r => (days[r.sale_date] = days[r.sale_date] || []).push(r));
    const keys = Object.keys(days).sort().reverse();
    const admin = !!me().is_admin, myId = me().id;

    let tb = '<tr><th>النوع</th><th>الطلب</th><th>المبلغ</th><th>بواسطة</th><th></th></tr>';
    tb += `<tr class="total"><td class="lbl" colspan="2">إجمالي ${esc(rangeTitle())} — ${fmt(keys.length)} يوم</td><td class="${T.net < 0 ? 'ds-neg' : ''}">${fmt(T.net)} ج</td><td colspan="2">مبيعات ${fmt(T.s)} − مرتجعات ${fmt(T.r)}</td></tr>`;
    keys.forEach(k => {
      const d = sums(days[k]);
      tb += `<tr class="ds-day" data-day="${k}" title="دوس تعرض اليوم ده بس"><td class="lbl" colspan="2">📅 ${esc(dayLabel(k))}</td>
        <td class="${d.net < 0 ? 'ds-neg' : 'ds-pos'}">محصلة اليوم: ${fmt(d.net)} ج</td>
        <td colspan="2">مبيعات ${fmt(d.s)}${d.r ? ' − مرتجعات ' + fmt(d.r) : ''}</td></tr>`;
      days[k].forEach(r => {
        const isRet = r.kind === 'return';
        const canDel = admin || (r.created_by && r.created_by === myId);
        tb += `<tr><td><span class="ds-tag ${isRet ? 'ret' : 'sale'}">${isRet ? '↩️ مرتجع' : '➕ مبيعة'}</span></td>
          <td class="lbl" style="font-weight:400">${esc(r.item)}</td>
          <td class="${isRet ? 'ds-neg' : ''}">${isRet ? '−' : ''}${fmt(r.amount)}</td>
          <td>${esc(r.created_by_name || '—')}</td>
          <td>${canDel ? `<button class="ds-btn sm" data-del="${r.id}" title="امسح">🗑️</button>` : ''}</td></tr>`;
      });
    });
    h += `<div class="card"><h3>كل العمليات بالتاريخ</h3>
      <div class="tablewrap" style="max-height:640px;overflow-y:auto"><table class="pr">${tb}</table></div>
      <p class="none" style="margin-top:8px">دوس على أي يوم عشان تعرضه لوحده. لو سجّلت حاجة غلط امسحها وسجّلها تاني (المسح لصاحب العملية أو الأدمن).</p></div>`;
    return h;
  }

  /* ---------- الأحداث ---------- */
  function setRange(k){
    const t = new Date(), y = t.getFullYear(), m = t.getMonth();
    if(k === 'all'){ S.from = S.to = ''; return; }
    if(k === 'today'){ S.from = S.to = ymd(t); return; }
    if(k === 'yesterday'){ S.from = S.to = ymd(new Date(t.getTime() - 864e5)); return; }
    if(k === 'month'){ S.from = ymd(new Date(y, m, 1)); S.to = ymd(t); return; }
    if(k === 'last'){ S.from = ymd(new Date(y, m - 1, 1)); S.to = ymd(new Date(y, m, 0)); }
  }

  function wire(root){
    const $ = id => root.querySelector('#' + id);
    root.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { S.kind = b.dataset.kind; S.msg = ''; draw(); const i = document.getElementById('dsItem'); if(i) i.focus(); });
    const d = $('dsDate'); if(d) d.onchange = () => { S.date = d.value; };
    const it = $('dsItem'); if(it){ it.oninput = () => { S.item = it.value; }; it.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); const a = document.getElementById('dsAmount'); if(a) a.focus(); } }; }
    const am = $('dsAmount'); if(am){ am.oninput = () => { S.amount = am.value; }; am.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } }; }
    const ad = root.querySelector('[data-act=add]'); if(ad) ad.onclick = add;
    const fr = $('dsFrom'); if(fr) fr.onchange = () => { S.from = fr.value; draw(); };
    const to = $('dsTo'); if(to) to.onchange = () => { S.to = to.value; draw(); };
    root.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { setRange(b.dataset.range); draw(); });
    const q = $('dsQ'); if(q) q.oninput = () => { S.q = q.value; draw(); };
    root.querySelectorAll('[data-day]').forEach(tr => tr.onclick = () => { S.from = S.to = tr.dataset.day; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); del(b.dataset.del); });
    const rl = root.querySelector('[data-act=reload]'); if(rl) rl.onclick = () => { S.msg = ''; load(); };
    const x = root.querySelector('[data-act=xlsx]'); if(x) x.onclick = exportXlsx;
  }

  async function add(){
    const item = S.item.trim(), amount = toNum(S.amount);
    if(!S.date) return flash('اختار التاريخ.', true);
    if(!item) return flash('اكتب الطلب.', true);
    if(amount === null || amount <= 0) return flash('اكتب السعر (رقم أكبر من صفر).', true);
    S.busy = true; draw();
    const { error } = await sb().from('direct_sales').insert({
      sale_date: S.date, kind: S.kind, item, amount, created_by_name: myName()
    });
    S.busy = false;
    if(error) return flash('❌ مقدرناش نسجّل: ' + error.message, true);
    const wasRet = S.kind === 'return';
    // لو التاريخ برا الفترة المعروضة، اعرض الكل عشان العملية تبان
    if((S.from && S.date < S.from) || (S.to && S.date > S.to)){ S.from = S.to = ''; }
    S.item = ''; S.amount = '';
    S.msg = `✅ اتسجّل ${wasRet ? 'مرتجع' : 'مبيعة'} "${item}" بـ ${fmt(amount)} ج يوم ${dayLabel(S.date)}.`; S.msgErr = false;
    await load();
    const i = document.getElementById('dsItem'); if(i) i.focus();
  }

  async function del(id){
    const r = (S.rows || []).find(x => String(x.id) === String(id));
    if(!r || !confirm(`تمسح ${r.kind === 'return' ? 'المرتجع' : 'المبيعة'} "${r.item}" (${fmt(r.amount)} ج)؟`)) return;
    const { data, error } = await sb().from('direct_sales').delete().eq('id', id).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح' + (error ? ': ' + error.message : ' — المسح لصاحب العملية أو الأدمن بس.'), true);
    S.msg = '✅ اتمسحت.'; S.msgErr = false;
    await load();
  }

  function exportXlsx(){
    const list = filtered().slice().sort((a, b) => a.sale_date < b.sale_date ? -1 : a.sale_date > b.sale_date ? 1 : 0);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(list.map(r => ({
      'التاريخ': r.sale_date, 'النوع': r.kind === 'return' ? 'مرتجع' : 'مبيعة', 'الطلب': r.item,
      'المبلغ': r.kind === 'return' ? -Number(r.amount) : Number(r.amount), 'بواسطة': r.created_by_name || '' }))), 'كل العمليات');
    const days = {};
    list.forEach(r => (days[r.sale_date] = days[r.sale_date] || []).push(r));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.keys(days).sort().map(k => { const t = sums(days[k]);
      return { 'التاريخ': k, 'المبيعات': t.s, 'المرتجعات': t.r, 'المحصلة': t.net }; })), 'محصلة كل يوم');
    XLSX.writeFile(wb, 'المبيعات المباشرة ' + (S.from || 'الكل') + (S.to && S.to !== S.from ? ' إلى ' + S.to : '') + '.xlsx');
  }

  /* ---------- لينك في القائمة (تحت المالية) ---------- */
  const anchor = document.querySelector('#sidebar a.navlink[href="#/qp"]') || document.querySelector('#sidebar a.navlink[href="#/profits"]');
  if(anchor && !document.querySelector('#sidebar a.navlink[href="#/direct"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/direct'; a.textContent = '🛒 مبيعات مباشرة';
    anchor.after(a);
  }

  /* ---------- الربط بالراوتر ---------- */
  function mount(){
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/direct'));
    draw(); if(S.rows === null && !S.loading && !S.err) load();
  }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isDS()) mount(); };
  window.addEventListener('hashchange', () => { if(isDS()) mount(); });
  if(isDS()) setTimeout(mount, 0);
})();
</script>

<!-- =====================================================================
     📝 قسم الـ EOD — تقرير آخر اليوم لكل فرد (البيكب / خدمة العملاء / المخزن)
     بيتحفظ في Supabase (جدول eod_reports) وبيتبعت على واتساب
     ===================================================================== -->
<style id="eod-style">
.eod-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.eod-tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px}
.eod-tab.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700}
.eod-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eod-bar label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.eod-in{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:var(--panel);color:var(--ink);box-sizing:border-box}
.eod-in:focus{outline:none;border-color:var(--brass)}
.eod-bar .eod-in{width:auto}
textarea.eod-in{resize:vertical;min-height:70px}
.eod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.eod-f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.eod-f.wide{grid-column:1/-1}
.eod-new{font-size:10.5px;background:#fbf0d9;color:#8a6d3b;border-radius:10px;padding:1px 7px;margin-inline-start:4px;font-weight:600;vertical-align:1px}
.eod-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px;font-family:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.eod-btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700;padding:11px 20px;font-size:15px}
.eod-btn.wa{background:#25D366;border-color:#25D366;color:#fff;font-weight:700;padding:11px 20px;font-size:15px}
.eod-btn.sm{padding:3px 9px;font-size:12px}
.eod-btn:disabled{opacity:.55;cursor:default}
.eod-msg{padding:10px 13px;border-radius:9px;margin-bottom:14px;font-size:14px;background:#e8f3ec;color:#276749}
.eod-msg.err{background:#fdecea;color:#b3423a}
.eod-sum .kpi b.good{color:#276749}
.eod-sum .kpi b.bad{color:#b3423a}
.eod-warn{background:#fdf3e1;color:#7a5410;border:1px solid #ecd39c;border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.eod-status{font-size:13px;color:var(--muted)}
.eod-status b{color:var(--brass-d)}
.eod-rep{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.eod-rep .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eod-rep .nm{font-weight:700}
.eod-rep .meta{font-size:12.5px;color:var(--muted)}
.eod-rep .acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.eod-rep pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--paper);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.eod-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--slate-l);color:var(--slate)}
.eod-tag.pickup{background:#fdf3e1;color:#8a6d3b}
.eod-tag.cs{background:#e9eef7;color:#3b5b92}
.eod-day{font-weight:700;color:var(--brass-d);margin:18px 0 8px}
</style>
<script>
(function(){
  /* ---------- إعدادات ---------- */
  const WA_NUMBER = '201095208066'; // الرقم اللي التقارير بتتبعتله (01095208066)

  /* ---------- فورم كل تقرير — عدّل أو زوّد خانات من هنا ----------
     type: n = رقم ، money = فلوس ، text = كلام ، extra = خانة اتضافت كاقتراح (عليها ✨) */
  const FORMS = {
    pickup: { title:'EOD البيكب', icon:'📦', who:'المسؤولة عن البيكب', sections:[
      { t:'🧾 الأوردرات', f:[
        { k:'total',     l:'إجمالي الأوردرات', type:'n' },
        { k:'acc',       l:'منهم إكسسوارات', type:'n' },
        { k:'kids',      l:'منهم ملابس أطفال', type:'n' },
        { k:'handed',    l:'اتسلّمت للمندوب فعلاً', type:'n', extra:true },
        { k:'nostock',   l:'مخرجتش لعدم توافر مخزون', type:'n' },
        { k:'postponed', l:'اتأجلت لبكرة لأي سبب تاني', type:'n', extra:true },
      ]},
      { t:'💰 الفلوس', f:[
        { k:'sales',     l:'إجمالي المبيعات', type:'money' },
        { k:'collected', l:'إجمالي التحصيل', type:'money' },
      ]},
      { t:'↩️ المرتجعات', f:[
        { k:'ret_courier', l:'المرتجعات حسب المندوب', type:'n' },
        { k:'ret_actual',  l:'المرتجعات الفعلية (اللي استلمناها)', type:'n' },
        { k:'ret_damaged', l:'منها تالف أو ناقص', type:'n', extra:true },
      ]},
      { t:'📝 ملاحظات', f:[
        { k:'nostock_items', l:'الأصناف اللي كانت ناقصة', type:'text', extra:true },
        { k:'notes',         l:'ملاحظات أو شكوى', type:'text' },
      ]},
    ]},
    cs: { title:'EOD خدمة العملاء', icon:'💬', who:'خدمة العملاء', sections:[
      { t:'🧾 الأوردرات', f:[
        { k:'wa',        l:'أوردرات الواتساب', type:'n' },
        { k:'page',      l:'أوردرات البيدج', type:'n' },
        { k:'retarget',  l:'أوردرات الريتارجت', type:'n' },
        { k:'followup',  l:'عدد الفولو أب', type:'n' },
        { k:'fu_orders', l:'أوردرات جت من الفولو أب', type:'n', extra:true },
        { k:'cancelled', l:'أوردرات اتلغت', type:'n', extra:true },
      ]},
      { t:'⏸️ الهولد', f:[
        { k:'hold',          l:'عدد الهولد', type:'n' },
        { k:'hold_followed', l:'اتتابع منهم', type:'n' },
        { k:'hold_replied',  l:'ردّوا من العملاء', type:'n' },
        { k:'hold_solved',   l:'اتحلّوا (هيستلموا)', type:'n', extra:true },
      ]},
      { t:'🔴 الأندلفرد', f:[
        { k:'undel',          l:'عدد الأندلفرد', type:'n' },
        { k:'undel_followed', l:'اتتابع منهم', type:'n' },
        { k:'undel_replied',  l:'ردّوا من العملاء', type:'n' },
        { k:'undel_solved',   l:'اتحلّوا (هيستلموا)', type:'n', extra:true },
      ]},
      { t:'💬 المحادثات والشكاوى', f:[
        { k:'chats',      l:'محادثات اتردّ عليها', type:'n', extra:true },
        { k:'pending',    l:'محادثات لسه مستنية رد آخر اليوم', type:'n', extra:true },
        { k:'complaints', l:'عدد الشكاوى', type:'n', extra:true },
        { k:'notes',      l:'ملاحظات أو شكاوى مهمة', type:'text' },
      ]},
    ]},
  };
  const TYPES = Object.keys(FORMS);
  const fieldsOf = type => FORMS[type].sections.flatMap(s => s.f);

  /* ---------- helpers ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { if(v === '' || v == null) return null; const x = parseFloat(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const dayTitle = k => new Date(k + 'T12:00:00').toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const isEOD = () => (location.hash.replace('#/', '') || 'home').split('/')[0] === 'eod';
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';
  const waUrl = text => 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(text);

  let S = { tab:'pickup', date: today(), data:{}, existing:null, loadingOne:false, loadedKey:'', busy:false,
            msg:'', msgErr:false, err:'',
            list:null, listLoading:false, from: ymd(new Date(Date.now() - 6 * 864e5)), to: today(), ftype:'all', open:{},
            whDate: today() };

  /* ---------- الحسبة والتنبيهات ---------- */
  function derive(type, d){
    const n = k => toNum(d[k]) ?? 0, has = k => toNum(d[k]) !== null;
    const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
    const L = [], W = [];
    if(type === 'pickup'){
      if(has('total')){
        if((has('acc') || has('kids')) && n('acc') + n('kids') !== n('total'))
          W.push(`إكسسوارات + ملابس أطفال = ${fmt(n('acc') + n('kids'))} ومش بيساوي إجمالي الأوردرات (${fmt(n('total'))})`);
        if(has('handed')) L.push(['نسبة اللي خرج للمندوب', pct(n('handed'), n('total'))]);
        if(has('nostock')) L.push(['نسبة اللي وقف بسبب المخزون', pct(n('nostock'), n('total')), n('nostock') ? 'bad' : 'good']);
      }
      if(has('ret_courier') || has('ret_actual')){
        const df = n('ret_courier') - n('ret_actual');
        L.push(['فرق المرتجعات (المندوب − الفعلي)', sgn(df), df ? 'bad' : 'good']);
        if(df) W.push(`فيه فرق ${fmt(Math.abs(df))} مرتجع بين كلام المندوب واللي استلمناه فعلاً — لازم يتراجع معاه`);
      }
      if(has('sales') || has('collected')){
        const df = n('collected') - n('sales');
        L.push(['فرق التحصيل عن المبيعات', sgn(df) + ' ج', df < 0 ? 'bad' : df > 0 ? '' : 'good']);
      }
      if(n('nostock') > 0 && !String(d.nostock_items || '').trim()) W.push('اكتب الأصناف اللي كانت ناقصة عشان المخزن يطلبها');
    } else {
      const tot = n('wa') + n('page') + n('retarget') + n('fu_orders');
      L.push(['إجمالي الأوردرات (واتساب + بيدج + ريتارجت + فولو أب)', fmt(tot)]);
      if(has('followup') && has('fu_orders')) L.push(['نسبة تحويل الفولو أب لأوردر', pct(n('fu_orders'), n('followup'))]);
      [['hold', 'الهولد'], ['undel', 'الأندلفرد']].forEach(([p, l]) => {
        if(!has(p)) return;
        L.push([`نسبة متابعة ${l}`, pct(n(p + '_followed'), n(p))]);
        L.push([`نسبة الرد في ${l}`, pct(n(p + '_replied'), n(p + '_followed'))]);
        if(has(p + '_solved')) L.push([`اتحلّ من ${l}`, pct(n(p + '_solved'), n(p)), 'good']);
        const left = n(p) - n(p + '_followed');
        if(left > 0) W.push(`لسه ${fmt(left)} من ${l} ماتتابعوش`);
        if(left < 0) W.push(`المتابَع في ${l} أكتر من عدد ${l} نفسه — راجع الأرقام`);
        if(n(p + '_replied') > n(p + '_followed')) W.push(`اللي ردّوا في ${l} أكتر من اللي اتتابعوا — راجع الأرقام`);
      });
      if(n('pending') > 0) W.push(`فيه ${fmt(n('pending'))} محادثة لسه مستنية رد`);
    }
    return { L, W };
  }

  function reportText(type, date, name, d){
    const F = FORMS[type], { L, W } = derive(type, d), out = [];
    out.push(`${F.icon} *${F.title}*`);
    out.push('🗓️ ' + dayTitle(date));
    out.push('👤 ' + (name || '—'));
    out.push('');
    F.sections.forEach(s => {
      const nums = s.f.filter(f => f.type !== 'text' && toNum(d[f.k]) !== null);
      const texts = s.f.filter(f => f.type === 'text' && String(d[f.k] || '').trim());
      if(!nums.length && !texts.length) return;
      out.push(`*${s.t}*`);
      nums.forEach(f => out.push(`• ${f.l}: ${fmt(toNum(d[f.k]))}${f.type === 'money' ? ' ج' : ''}`));
      texts.forEach(f => out.push(`• ${f.l}: ${String(d[f.k]).trim()}`));
      out.push('');
    });
    if(L.length){ out.push('*📊 الحسبة*'); L.forEach(([l, v]) => out.push(`• ${l}: ${v}`)); out.push(''); }
    if(W.length){ out.push('*⚠️ تنبيهات*'); W.forEach(w => out.push('• ' + w)); }
    return out.join('\n').trim();
  }

  function clean(type, d){
    const o = {};
    fieldsOf(type).forEach(f => {
      if(f.type === 'text'){ const t = String(d[f.k] || '').trim(); if(t) o[f.k] = t; }
      else { const v = toNum(d[f.k]); if(v !== null) o[f.k] = v; }
    });
    return o;
  }

  /* ---------- البيانات ---------- */
  async function loadOne(tries){
    if(!TYPES.includes(S.tab)) return;
    if(!sb() || !me().id){ // لسه بوابة الدخول بتحمّل
      if((tries || 0) < 40) setTimeout(() => loadOne((tries || 0) + 1), 300);
      return;
    }
    const key = S.tab + '|' + S.date;
    S.loadingOne = true; S.err = ''; draw();
    const { data, error } = await sb().from('eod_reports').select('*')
      .eq('type', S.tab).eq('report_date', S.date).eq('created_by', me().id).maybeSingle();
    S.loadingOne = false;
    if(error){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(error.message)
        ? 'جدول الـ EOD لسه مش موجود في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب تقريرك: ' + error.message;
    } else {
      S.existing = data || null;
      S.data = data ? { ...data.data } : {};
      S.loadedKey = key;
    }
    draw();
  }

  async function loadList(){
    if(!sb()) return;
    S.listLoading = true; S.err = ''; draw();
    let q = sb().from('eod_reports').select('*').order('report_date', { ascending:false }).order('updated_at', { ascending:false }).limit(1000);
    if(S.from) q = q.gte('report_date', S.from);
    if(S.to) q = q.lte('report_date', S.to);
    if(S.ftype !== 'all') q = q.eq('type', S.ftype);
    const { data, error } = await q;
    S.listLoading = false;
    if(error) S.err = /does not exist|relation|schema cache|Could not find/i.test(error.message)
      ? 'جدول الـ EOD لسه مش موجود في Supabase — لازم كود الـ SQL يتشغّل الأول.'
      : 'مقدرناش نجيب التقارير: ' + error.message;
    else S.list = data || [];
    draw();
  }

  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); window.scrollTo({ top:0, behavior:'smooth' }); }

  async function save(send){
    const w = send ? window.open('', '_blank') : null; // بنفتح التاب قبل الحفظ عشان المتصفح مايمنعهوش
    const data = clean(S.tab, S.data);
    if(!Object.keys(data).length){ if(w) w.close(); return flash('اكتب أي رقم في التقرير الأول.', true); }
    S.busy = true; draw();
    const row = { type:S.tab, report_date:S.date, data, created_by: me().id, created_by_name: myName(), updated_at: new Date().toISOString() };
    const { data: saved, error } = await sb().from('eod_reports').upsert(row, { onConflict:'type,report_date,created_by' }).select().single();
    S.busy = false;
    if(error){ if(w) w.close(); return flash('❌ مقدرناش نحفظ التقرير: ' + error.message, true); }
    S.existing = saved; S.data = { ...saved.data }; S.list = null;
    if(w){ w.opener = null; w.location.href = waUrl(reportText(S.tab, S.date, myName(), saved.data)); }
    flash(send ? '✅ اتحفظ التقرير واتفتح الواتساب — دوس إرسال هناك.' : '✅ اتحفظ التقرير.');
  }

  async function delReport(id){
    const r = (S.list || []).find(x => String(x.id) === String(id)); if(!r) return;
    if(!confirm(`تمسح ${FORMS[r.type].title} بتاع ${r.created_by_name || '—'} يوم ${dayTitle(r.report_date)}؟`)) return;
    const { data, error } = await sb().from('eod_reports').delete().eq('id', id).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح' + (error ? ': ' + error.message : ' — المسح لصاحب التقرير أو الأدمن بس.'), true);
    S.msg = '✅ اتمسح التقرير.'; S.msgErr = false;
    if(S.existing && String(S.existing.id) === String(id)){ S.existing = null; S.data = {}; }
    loadList();
  }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isEOD()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function view(){
    const tabs = [...TYPES.map(t => [t, FORMS[t].icon + ' ' + FORMS[t].title]), ['wh', '🏬 EOD المخزن'], ['list', '📊 كل التقارير']];
    let h = `<div class="pagehead"><h1>📝 EOD — تقرير آخر اليوم</h1><p>كل واحد يملأ تقريره آخر اليوم، يتحفظ باسمه وبتاريخه، ويتبعت على الواتساب.</p></div>
      <div class="eod-tabs">${tabs.map(([k, l]) => `<button class="eod-tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
    if(S.msg) h += `<div class="eod-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;
    if(S.err) return h + `<div class="eod-msg err">${esc(S.err)}</div>`;
    if(S.tab === 'wh') return h + vWarehouse();
    if(S.tab === 'list') return h + vList();
    return h + vForm();
  }

  function fieldHtml(f){
    const v = S.data[f.k] ?? '';
    const tag = f.extra ? '<span class="eod-new" title="خانة مقترحة اتضافت">✨ إضافة</span>' : '';
    if(f.type === 'text') return `<div class="eod-f wide"><label for="eod_${f.k}">${esc(f.l)}${tag}</label>
      <textarea class="eod-in" id="eod_${f.k}" data-k="${f.k}" rows="2">${esc(v)}</textarea></div>`;
    return `<div class="eod-f"><label for="eod_${f.k}">${esc(f.l)}${f.type === 'money' ? ' (ج)' : ''}${tag}</label>
      <input class="eod-in" id="eod_${f.k}" data-k="${f.k}" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(v)}"></div>`;
  }

  function sumHtml(){
    const { L, W } = derive(S.tab, S.data);
    if(!L.length && !W.length) return '<p class="none">الحسبة والتنبيهات هتظهر هنا وإنت بتكتب.</p>';
    return L.map(([l, v, c]) => `<div class="kpi">${esc(l)} <b class="${c || ''}">${esc(v)}</b></div>`).join('') +
      W.map(w => `<div class="eod-warn">⚠️ ${esc(w)}</div>`).join('');
  }

  function vForm(){
    const F = FORMS[S.tab];
    const t = today(), y = ymd(new Date(Date.now() - 864e5));
    const ex = S.existing;
    let h = `<div class="card"><div class="eod-bar">
      <label>التاريخ <input class="eod-in" type="date" id="eodDate" value="${esc(S.date)}" max="${t}"></label>
      <button class="eod-btn" data-date="${t}">النهارده</button>
      <button class="eod-btn" data-date="${y}">امبارح</button>
      <span style="flex:1"></span>
      <span class="eod-status">👤 <b>${esc(myName() || '...')}</b></span>
    </div>
    <p class="eod-status" style="margin:10px 0 0">${S.loadingOne ? '⏳ بيشوف لو ليك تقرير متسجل...' :
      ex ? `✏️ إنت مسجّل ${esc(F.title)} لليوم ده (آخر تعديل ${new Date(ex.updated_at).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' })}) — أي تعديل هيتحفظ مكانه.` :
      `📄 تقرير جديد — ${esc(F.who)} — ${esc(dayTitle(S.date))}`}</p></div>`;
    if(S.loadingOne) return h;
    F.sections.forEach(s => {
      h += `<div class="card"><h3>${esc(s.t)}</h3><div class="eod-grid">${s.f.map(fieldHtml).join('')}</div></div>`;
    });
    h += `<div class="card eod-sum"><h3>📊 الحسبة والتنبيهات</h3><div id="eodSum">${sumHtml()}</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
        <button class="eod-btn pri" data-act="save" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳ بيحفظ...' : '💾 احفظ التقرير'}</button>
        <button class="eod-btn wa" data-act="send" ${S.busy ? 'disabled' : ''}>💬 احفظ وابعت على واتساب</button>
      </div>`;
    return h;
  }

  function vWarehouse(){
    return `<div class="card"><h3>🏬 EOD المخزن</h3>
      <p style="font-size:14px;margin:0 0 12px">الـ EOD بتاع المخزن بيتعمل أوتوماتيك من حركات المخزن نفسها: المشتريات، والمرتجعات، والإخراج، والجرد، وقيمة المخزن أول اليوم وآخره، والنواقص. مسؤولة المخزن بتكتب ملاحظاتها هناك وتبعته واتساب على نفس الرقم.</p>
      <div class="eod-bar">
        <label>التاريخ <input class="eod-in" type="date" id="eodWhDate" value="${esc(S.whDate)}" max="${today()}"></label>
        <button class="eod-btn pri" data-act="wh-open">🏬 افتح ملخص المخزن لليوم ده</button>
      </div>
      ${typeof window.InvOpenDay === 'function' ? '' : '<div class="eod-warn">قسم المخزن مش موجود في الصفحة.</div>'}
    </div>`;
  }

  function keyLine(r){
    const d = r.data || {}, n = k => toNum(d[k]) ?? 0;
    if(r.type === 'pickup')
      return `${fmt(n('total'))} أوردر · مبيعات ${fmt(n('sales'))} ج · تحصيل ${fmt(n('collected'))} ج · مرتجعات ${fmt(n('ret_actual'))}`;
    const tot = n('wa') + n('page') + n('retarget') + n('fu_orders');
    return `${fmt(tot)} أوردر · هولد ${fmt(n('hold_followed'))}/${fmt(n('hold'))} · أندلفرد ${fmt(n('undel_followed'))}/${fmt(n('undel'))}`;
  }

  function vList(){
    let h = `<div class="card"><div class="eod-bar">
      <label>من <input class="eod-in" type="date" id="eodFrom" value="${esc(S.from)}"></label>
      <label>إلى <input class="eod-in" type="date" id="eodTo" value="${esc(S.to)}"></label>
      <label>النوع <select class="eod-in" id="eodType">
        <option value="all" ${S.ftype === 'all' ? 'selected' : ''}>الكل</option>
        ${TYPES.map(t => `<option value="${t}" ${S.ftype === t ? 'selected' : ''}>${FORMS[t].title}</option>`).join('')}
      </select></label>
      <button class="eod-btn" data-act="list-go">🔄 اعرض</button>
    </div></div>`;
    if(S.listLoading || S.list === null) return h + `<div class="card"><p class="none">⏳ بيجيب التقارير...</p></div>`;
    if(!S.list.length) return h + `<div class="card"><p class="none">مفيش تقارير في الفترة دي.</p></div>`;
    const days = {};
    S.list.forEach(r => (days[r.report_date] = days[r.report_date] || []).push(r));
    const admin = !!me().is_admin, myId = me().id;
    Object.keys(days).sort().reverse().forEach(k => {
      h += `<div class="eod-day">🗓️ ${esc(dayTitle(k))} — ${fmt(days[k].length)} تقرير</div>`;
      days[k].forEach(r => {
        const { W } = derive(r.type, r.data || {});
        const mine = r.created_by === myId;
        h += `<div class="eod-rep"><div class="top">
          <span class="eod-tag ${r.type}">${FORMS[r.type].icon} ${esc(FORMS[r.type].title)}</span>
          <span class="nm">${esc(r.created_by_name || '—')}</span>
          <span class="meta">${new Date(r.updated_at).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' })}${W.length ? ` · ⚠️ ${fmt(W.length)} تنبيه` : ''}</span>
          <div class="acts">
            <button class="eod-btn sm" data-view="${r.id}">${S.open[r.id] ? '🙈 اقفل' : '👁 التفاصيل'}</button>
            <button class="eod-btn sm" data-wa="${r.id}">💬 ابعت</button>
            ${mine ? `<button class="eod-btn sm" data-edit="${r.id}">✏️ عدّل</button>` : ''}
            ${mine || admin ? `<button class="eod-btn sm" data-del="${r.id}">🗑️</button>` : ''}
          </div></div>
          <div class="meta" style="margin-top:6px">${esc(keyLine(r))}</div>
          ${S.open[r.id] ? `<pre>${esc(reportText(r.type, r.report_date, r.created_by_name, r.data || {}))}</pre>` : ''}
        </div>`;
      });
    });
    return h;
  }

  /* ---------- الأحداث ---------- */
  function openTab(t){
    S.tab = t; S.msg = '';
    if(TYPES.includes(t)){ if(S.loadedKey !== t + '|' + S.date){ S.data = {}; S.existing = null; loadOne(); } else draw(); }
    else if(t === 'list'){ draw(); if(S.list === null && !S.listLoading) loadList(); }
    else draw();
  }
  function setDate(d){ if(!d) return; S.date = d; S.msg = ''; S.data = {}; S.existing = null; loadOne(); }

  function wire(root){
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openTab(b.dataset.tab));
    const dt = root.querySelector('#eodDate'); if(dt) dt.onchange = () => setDate(dt.value);
    root.querySelectorAll('[data-date]').forEach(b => b.onclick = () => setDate(b.dataset.date));
    root.querySelectorAll('[data-k]').forEach(el => el.oninput = () => {
      S.data[el.dataset.k] = el.value;
      const s = document.getElementById('eodSum'); if(s) s.innerHTML = sumHtml();
    });
    const sv = root.querySelector('[data-act=save]'); if(sv) sv.onclick = () => save(false);
    const sd = root.querySelector('[data-act=send]'); if(sd) sd.onclick = () => save(true);

    const wd = root.querySelector('#eodWhDate'); if(wd) wd.onchange = () => { S.whDate = wd.value; };
    const wo = root.querySelector('[data-act=wh-open]'); if(wo) wo.onclick = () => { if(window.InvOpenDay) window.InvOpenDay(S.whDate); };

    const fr = root.querySelector('#eodFrom'); if(fr) fr.onchange = () => { S.from = fr.value; };
    const to = root.querySelector('#eodTo'); if(to) to.onchange = () => { S.to = to.value; };
    const ty = root.querySelector('#eodType'); if(ty) ty.onchange = () => { S.ftype = ty.value; loadList(); };
    const lg = root.querySelector('[data-act=list-go]'); if(lg) lg.onclick = loadList;
    const find = id => (S.list || []).find(x => String(x.id) === String(id));
    root.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.open[b.dataset.view] = !S.open[b.dataset.view]; draw(); });
    root.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
      const r = find(b.dataset.wa); if(r) window.open(waUrl(reportText(r.type, r.report_date, r.created_by_name, r.data || {})), '_blank', 'noopener');
    });
    root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const r = find(b.dataset.edit); if(!r) return;
      S.tab = r.type; S.date = r.report_date; S.existing = r; S.data = { ...(r.data || {}) }; S.loadedKey = r.type + '|' + r.report_date; S.msg = '';
      draw(); window.scrollTo({ top:0, behavior:'smooth' });
    });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delReport(b.dataset.del));
  }

  /* ---------- لينك في القائمة (تحت العمل) ---------- */
  const anchor = document.querySelector('#sidebar a.navlink[href="#/squad"]');
  if(anchor && !document.querySelector('#sidebar a.navlink[href="#/eod"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/eod'; a.textContent = '📝 EOD';
    anchor.after(a);
  }

  /* ---------- الربط بالراوتر ---------- */
  function mount(){
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/eod'));
    draw();
    if(TYPES.includes(S.tab) && S.loadedKey !== S.tab + '|' + S.date && !S.loadingOne) loadOne();
    if(S.tab === 'list' && S.list === null && !S.listLoading) loadList();
  }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isEOD()) mount(); };
  window.addEventListener('hashchange', () => { if(isEOD()) mount(); });
  if(isEOD()) setTimeout(mount, 0);
})();
</script>

<!-- =====================================================================
     🧩 تحليل مكونات الطلبات — بتلصق عمود "الطلب" من جوجل شيت، والسيستم يفكّ
     كل طلب لمكوناته ويطلع إجمالي اللي خرج (تقرير عرض بس، مش بيخصم من المخزن)
     ===================================================================== -->
<style id="bd-style">
.bd-ta{width:100%;min-height:200px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--ink);box-sizing:border-box;resize:vertical;line-height:1.6}
.bd-ta:focus{outline:none;border-color:var(--brass)}
.bd-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.bd-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px;font-family:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.bd-btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700;padding:10px 20px;font-size:15px}
.bd-btn:disabled{opacity:.55;cursor:default}
.bd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.bd-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.bd-kpi .n{font-size:24px;font-weight:700;color:var(--brass-d)}
.bd-kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.bd-kpi.bad{border:2px solid #b3423a;cursor:pointer}
.bd-kpi.bad .n{color:#b3423a}
.bd-big td.q{font-size:18px;font-weight:700;color:var(--brass-d)}
table.pr tr.bd-cat td{background:var(--slate-l);font-weight:700}
.bd-chip{display:inline-block;background:var(--slate-l);color:var(--slate);border-radius:6px;padding:1px 8px;margin:2px;font-size:12.5px;white-space:nowrap}
.bd-chip.unk{background:#fdecea;color:#b3423a}
.bd-msg{padding:10px 13px;border-radius:9px;margin-bottom:14px;font-size:14px;background:#e8f3ec;color:#276749}
.bd-msg.err{background:#fdecea;color:#b3423a}
</style>
<script>
(function(){
  /* =====================================================================
     📚 قواعد التحليل — لو فيه منتج جديد ضيفه هنا
     all: كلمات لازم تكون كلها موجودة في السطر ، any: يكفي كلمة واحدة منهم
     (اكتب الكلمات من غير تشكيل، والتاء المربوطة "ه": سلسله / دبله / دفايه)
     items: المكونات [الاسم، النوع، العدد] — النوع: j مجوهرات ، p تغليف ، k ملابس أطفال
     set: true = بيتحسب "طقم" (كل طقم ليه شنطة) ، jewelry: true = الأوردر بياخد شنطة
     ===================================================================== */
  const RULES = [
    { name:'طقم سلسلة ومحبس وحلق (ايطالي)', all:['سلسله', 'محبس', 'حلق'], set:true, jewelry:true,
      items: l => { const m = l.match(/(\d+)\s*حلق/);   // "و٢حلق" = 2 حلق
        return [['سلسلة ايطالي', 'j', 1], ['محبس ايطالي', 'j', 1], ['حلق ايطالي', 'j', m ? +m[1] : 1], ['علبة قطيفة', 'p', 1]]; } },
    { name:'طقم Shine Jewelry Zirconia', all:['shine'], set:true, jewelry:true,
      items: () => [['سلسلة فص', 'j', 1], ['حلق فص', 'j', 1], ['خاتم فص', 'j', 1], ['علبة طقم', 'p', 1]] },
    { name:'دبلة تنجستين (هدية)', any:['تنجستين', 'دبله'], jewelry:true,
      items: () => [['دبلة تنجستين', 'j', 1]] },
    { name:'باكدج هدايا', any:['باكدج', 'باكيدج', 'package'],
      items: () => [['باكدج', 'p', 1]] },
    { name:'انسيال فصوص زاركونيا', any:['انسيال'], jewelry:true,
      items: () => [['انسيال زاركونيا', 'j', 1], ['علبة انسيال', 'p', 1]] },
    { name:'طقم الدفاية', any:['دفايه'],
      items: () => [['طقم الدفاية', 'k', 1]] },
    { name:'طقم الأسد ولادي وبناتي', any:['الاسد'],
      items: () => [['طقم الأسد ولادي وبناتي', 'k', 1]] },
  ];
  // الشنطة: شنطة واحدة للأوردر، ولو فيه أكتر من طقم يبقى شنطة لكل طقم (أوردرات المجوهرات بس)
  const BAG = ['شنطة', 'p'];
  const CATS = { j:'💍 مجوهرات', p:'🎁 علب وتغليف', k:'👕 ملابس أطفال' };
  const HEADERS = ['الطلب', 'الطلبات', 'الاوردر', 'الاوردرات', 'تفاصيل الطلب'];

  /* ---------- helpers ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n || 0).toLocaleString('ar-EG');
  const norm = s => String(s || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[^\p{L}\p{N}\s×*]/gu, ' ')
    .replace(/\s+/g, ' ').trim();
  const isBD = () => (location.hash.replace('#/', '') || 'home').split('/')[0] === 'breakdown';
  const RN = RULES.map(r => ({ ...r, all: (r.all || []).map(norm), any: (r.any || []).map(norm) }));

  /* ---------- قراءة اللصق من جوجل شيت (الخلية اللي فيها كذا سطر بتيجي بين "...") ---------- */
  function parseCells(text){
    text = String(text || '').replace(/\r\n?/g, '\n');
    const cells = []; let i = 0;
    while(i < text.length){
      if(text[i] === '"'){
        let j = i + 1, cur = '';
        while(j < text.length){
          if(text[j] === '"'){ if(text[j + 1] === '"'){ cur += '"'; j += 2; continue; } j++; break; }
          cur += text[j++];
        }
        while(j < text.length && text[j] !== '\n') j++; // أي أعمدة تانية بعد الخلية بتتجاهل
        cells.push(cur); i = j + 1;
      } else {
        let j = text.indexOf('\n', i); if(j < 0) j = text.length;
        cells.push(text.slice(i, j).split('\t')[0]); i = j + 1;
      }
    }
    return cells.filter(c => c.trim() && !HEADERS.includes(norm(c)));
  }

  // عدد مكتوب على السطر نفسه: "×2" ، "x2" ، "عدد 2" ، "2 طقم ..."
  function lineMult(l){
    let m;
    if((m = l.match(/(?:^|\s)(?:x|×|\*)\s*(\d{1,2})$/))) return +m[1];
    if((m = l.match(/^(\d{1,2})\s*(?:x|×|\*)\s/))) return +m[1];
    if((m = l.match(/عدد\s*(\d{1,2})/))) return +m[1];
    if((m = l.match(/^(\d{1,2})\s+(?!حلق)/))) return +m[1];
    return 1;
  }

  function analyze(text){
    const cells = parseCells(text);
    const comps = {}, products = {}, unknown = {}, orders = [];
    let lines = 0, unkLines = 0, sets = 0;
    const addComp = (o, name, cat, q) => {
      (comps[name] = comps[name] || { cat, qty:0 }).qty += q;
      o.comps[name] = (o.comps[name] || 0) + q;
    };
    cells.forEach(raw => {
      const o = { raw: raw.trim(), comps:{}, unknown:[], sets:0, jewelry:false, prods:{} };
      raw.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
        const l = norm(line); if(!l) return;
        lines++;
        const hits = RN.filter(r => (!r.all.length || r.all.every(w => l.includes(w))) && (!r.any.length || r.any.some(w => l.includes(w))));
        if(!hits.length){ unkLines++; o.unknown.push(line); unknown[line] = (unknown[line] || 0) + 1; return; }
        const mult = Math.min(99, Math.max(1, lineMult(l)));
        hits.forEach(r => {
          r.items(l).forEach(([name, cat, q]) => addComp(o, name, cat, q * mult));
          o.prods[r.name] = (o.prods[r.name] || 0) + mult;
          if(r.set) o.sets += mult;
          if(r.jewelry) o.jewelry = true;
        });
      });
      Object.entries(o.prods).forEach(([n, q]) => {
        const p = products[n] = products[n] || { qty:0, orders:0 };
        p.qty += q; p.orders++;
      });
      if(o.jewelry) addComp(o, BAG[0], BAG[1], Math.max(1, o.sets));
      sets += o.sets;
      orders.push(o);
    });
    return { orders, comps, products, unknown, lines, unkLines, sets };
  }

  /* ---------- الحالة والرسم ---------- */
  let S = { text:'', res:null, msg:'', msgErr:false };

  function draw(){
    if(!isBD()) return;
    const main = document.getElementById('main'); if(!main) return;
    main.innerHTML = view();
    wire(main);
  }

  function compsGrouped(R){
    return Object.keys(CATS).map(c => ({ c, rows: Object.entries(R.comps).filter(([, v]) => v.cat === c).sort((a, b) => b[1].qty - a[1].qty) }))
      .filter(g => g.rows.length);
  }

  function view(){
    let h = `<div class="pagehead"><h1>🧩 تحليل مكونات الطلبات</h1><p>الصق عمود "الطلب" من جوجل شيت، والسيستم يفكّ كل طلب لمكوناته ويطلعلك إجمالي اللي خرج من كل حاجة.</p></div>
      <div class="card">
        <label for="bdText" style="display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">📋 الصق هنا (حدد عمود الطلب في الشيت ← Ctrl+C ← وهنا Ctrl+V)</label>
        <textarea class="bd-ta" id="bdText" placeholder="سلسله ومحبس وحلق ( ايطالي ) + دبله تنجستين هديه&#10;طقم الدفايه&#10;...">${esc(S.text)}</textarea>
        <div class="bd-bar">
          <button class="bd-btn pri" data-act="go">🧩 حلّل الطلبات</button>
          <button class="bd-btn" data-act="clear">🗑️ امسح</button>
          <span style="font-size:12.5px;color:var(--muted)">الخلية اللي فيها كذا سطر = كل سطر منتج لوحده. ده تقرير عرض بس ومش بيخصم من المخزن.</span>
        </div>
      </div>`;
    if(S.msg) h += `<div class="bd-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;
    const R = S.res; if(!R) return h + rulesCard();

    const jewel = Object.values(R.comps).filter(v => v.cat === 'j').reduce((s, v) => s + v.qty, 0);
    const kids = Object.values(R.comps).filter(v => v.cat === 'k').reduce((s, v) => s + v.qty, 0);
    const unkN = Object.keys(R.unknown).length;
    h += `<div class="bd-kpis">
      <div class="bd-kpi"><div class="n">${fmt(R.orders.length)}</div><div class="l">أوردر</div></div>
      <div class="bd-kpi"><div class="n">${fmt(R.sets)}</div><div class="l">طقم مجوهرات</div></div>
      <div class="bd-kpi"><div class="n">${fmt(jewel)}</div><div class="l">💍 قطعة مجوهرات</div></div>
      <div class="bd-kpi"><div class="n">${fmt(kids)}</div><div class="l">👕 قطعة ملابس أطفال</div></div>
      <div class="bd-kpi ${R.unkLines ? 'bad' : ''}" ${R.unkLines ? 'data-act="to-unk"' : ''}><div class="n">${fmt(R.unkLines)}</div><div class="l">${R.unkLines ? '⚠️ سطر مش مفهوم · دوس تشوفهم' : '✅ كل الأسطر اتفهمت'}</div></div>
    </div>`;

    // إجمالي المكونات
    let tb = '<tr><th>المكوّن</th><th>العدد اللي خرج</th></tr>';
    compsGrouped(R).forEach(g => {
      const sub = g.rows.reduce((s, [, v]) => s + v.qty, 0);
      tb += `<tr class="bd-cat"><td class="lbl">${CATS[g.c]}</td><td>${fmt(sub)}</td></tr>`;
      g.rows.forEach(([n, v]) => tb += `<tr><td class="lbl" style="font-weight:400">${esc(n)}</td><td class="q">${fmt(v.qty)}</td></tr>`);
    });
    h += `<div class="card"><div class="bd-bar" style="margin:0 0 10px;justify-content:space-between"><h3 style="margin:0;border:none;padding:0">📦 إجمالي المكونات اللي خرجت</h3>
        <div style="display:flex;gap:8px"><button class="bd-btn" data-act="copy">📋 انسخ الجدول</button>${window.XLSX ? '<button class="bd-btn" data-act="xlsx">⬇️ Excel</button>' : ''}</div></div>
      <div class="tablewrap"><table class="pr bd-big">${tb}</table></div>
      <p class="none" style="margin-top:8px">الشنطة: واحدة لكل أوردر مجوهرات، ولو الأوردر فيه أكتر من طقم بتبقى شنطة لكل طقم.</p></div>`;

    // عدد كل منتج
    const prods = Object.entries(R.products).sort((a, b) => b[1].qty - a[1].qty);
    h += `<div class="card"><h3>🧾 عدد كل منتج</h3><div class="tablewrap"><table class="pr">
      <tr><th>المنتج</th><th>العدد</th><th>في كام أوردر</th></tr>
      ${prods.map(([n, p]) => `<tr><td class="lbl">${esc(n)}</td><td class="num">${fmt(p.qty)}</td><td>${fmt(p.orders)}</td></tr>`).join('') || '<tr><td colspan="3" class="none">—</td></tr>'}
    </table></div></div>`;

    // الأسطر المش مفهومة
    if(unkN){
      h += `<div class="card" id="bdUnk"><h3 style="color:#b3423a">⚠️ أسطر مش مفهومة — ${fmt(R.unkLines)} سطر (${fmt(unkN)} شكل مختلف)</h3>
        <p class="none" style="margin-bottom:8px">الأسطر دي مش داخلة في الحسبة. ابعتلي مكوناتها وأضيفها في قواعد التحليل.</p>
        <div class="tablewrap"><table class="pr"><tr><th>السطر</th><th>اتكرر</th></tr>
        ${Object.entries(R.unknown).sort((a, b) => b[1] - a[1]).map(([l, n]) => `<tr><td class="lbl" style="font-weight:400">${esc(l)}</td><td>${fmt(n)}</td></tr>`).join('')}
        </table></div></div>`;
    }

    // تفاصيل كل أوردر
    h += `<details class="card"><summary style="cursor:pointer;font-weight:700;color:var(--brass-d)">🔍 مكونات كل أوردر (${fmt(R.orders.length)})</summary>
      <div class="tablewrap" style="margin-top:12px;max-height:600px;overflow-y:auto"><table class="pr">
        <tr><th>#</th><th>الطلب</th><th>المكونات</th></tr>
        ${R.orders.map((o, i) => `<tr><td>${fmt(i + 1)}</td>
          <td class="lbl" style="font-weight:400;white-space:pre-line">${esc(o.raw)}</td>
          <td style="white-space:normal;text-align:right">${Object.entries(o.comps).map(([n, q]) => `<span class="bd-chip">${esc(n)} × ${fmt(q)}</span>`).join('')}${o.unknown.map(u => `<span class="bd-chip unk">❓ ${esc(u)}</span>`).join('')}</td></tr>`).join('')}
      </table></div></details>`;
    return h + rulesCard();
  }

  function rulesCard(){
    return `<details class="card"><summary style="cursor:pointer;font-weight:700;color:var(--brass-d)">📚 قواعد التحليل الحالية</summary>
      <div class="tablewrap" style="margin-top:12px"><table class="pr">
        <tr><th>المنتج</th><th>بيتعرف لو السطر فيه</th><th>المكونات</th></tr>
        ${RULES.map(r => `<tr><td class="lbl">${esc(r.name)}</td>
          <td style="white-space:normal">${[(r.all || []).length ? 'كل دول: ' + r.all.join(' + ') : '', (r.any || []).length ? 'أي واحدة: ' + r.any.join(' / ') : ''].filter(Boolean).map(esc).join('<br>')}</td>
          <td style="white-space:normal;text-align:right">${r.items('').map(([n, , q]) => `<span class="bd-chip">${esc(n)} × ${fmt(q)}</span>`).join('')}${r.jewelry ? '<span class="bd-chip">+ شنطة</span>' : ''}</td></tr>`).join('')}
      </table></div>
      <p class="none" style="margin-top:8px">"و٢حلق" بتتحسب 2 حلق. ولو السطر مكتوب فيه عدد زي "×2" أو "عدد 2" أو "2 طقم..."، كل مكوناته بتتضرب في العدد ده.</p></details>`;
  }

  function tableTSV(){
    const rows = [['المكوّن', 'العدد']];
    compsGrouped(S.res).forEach(g => { rows.push([CATS[g.c], '']); g.rows.forEach(([n, v]) => rows.push([n, v.qty])); });
    return rows.map(r => r.join('\t')).join('\n');
  }

  function wire(root){
    const ta = root.querySelector('#bdText'); if(ta) ta.oninput = () => { S.text = ta.value; };
    const go = root.querySelector('[data-act=go]'); if(go) go.onclick = () => {
      if(!S.text.trim()){ S.msg = 'الصق الطلبات الأول.'; S.msgErr = true; S.res = null; draw(); return; }
      S.res = analyze(S.text);
      S.msg = S.res.orders.length ? '' : 'ملقيتش أي طلبات في اللي اتلصق.'; S.msgErr = !S.res.orders.length;
      draw();
    };
    const cl = root.querySelector('[data-act=clear]'); if(cl) cl.onclick = () => { S.text = ''; S.res = null; S.msg = ''; draw(); };
    const tu = root.querySelector('[data-act=to-unk]'); if(tu) tu.onclick = () => { const u = document.getElementById('bdUnk'); if(u) u.scrollIntoView({ behavior:'smooth', block:'start' }); };
    const cp = root.querySelector('[data-act=copy]'); if(cp) cp.onclick = async () => {
      try{ await navigator.clipboard.writeText(tableTSV()); cp.textContent = '✅ اتنسخ — الصقه في الشيت'; }
      catch(e){ cp.textContent = '❌ النسخ اترفض'; }
    };
    const xl = root.querySelector('[data-act=xlsx]'); if(xl) xl.onclick = () => {
      const R = S.res, wb = XLSX.utils.book_new();
      const c = []; compsGrouped(R).forEach(g => g.rows.forEach(([n, v]) => c.push({ 'النوع': CATS[g.c], 'المكوّن': n, 'العدد': v.qty })));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(c), 'المكونات');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(R.products).map(([n, p]) => ({ 'المنتج': n, 'العدد': p.qty, 'في كام أوردر': p.orders }))), 'المنتجات');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(R.orders.map((o, i) => ({ '#': i + 1, 'الطلب': o.raw,
        'المكونات': Object.entries(o.comps).map(([n, q]) => n + ' × ' + q).join('، '), 'مش مفهوم': o.unknown.join('، ') }))), 'كل أوردر');
      XLSX.writeFile(wb, 'تحليل مكونات الطلبات ' + new Date().toISOString().slice(0, 10) + '.xlsx');
    };
  }

  /* ---------- لينك في القائمة (تحت العمل) ---------- */
  const anchor = document.querySelector('#sidebar a.navlink[href="#/eod"]') || document.querySelector('#sidebar a.navlink[href="#/squad"]');
  if(anchor && !document.querySelector('#sidebar a.navlink[href="#/breakdown"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/breakdown'; a.textContent = '🧩 تحليل مكونات الطلبات';
    anchor.after(a);
  }

  /* ---------- الربط بالراوتر ---------- */
  function mount(){
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/breakdown'));
    draw();
  }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isBD()) mount(); };
  window.addEventListener('hashchange', () => { if(isBD()) mount(); });
  if(isBD()) setTimeout(mount, 0);
})();
</script>

<script>
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { const x = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const monthStart = () => { const t = new Date(); return ymd(new Date(t.getFullYear(), t.getMonth(), 1)); };
  const isAC = () => (location.hash.replace('#/', '') || 'home').split('/')[0] === 'accounts';
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';
  const dayLabel = k => new Date(k + 'T12:00:00').toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // البنود الجاهزة — زوّد أو شيل من هنا (والموظف يقدر يكتب بند جديد بإيده)
  const CATS = {
    income:  ['مبيعات أونلاين', 'تحصيل شركة الشحن', 'مبيعات مباشرة', 'إيرادات أخرى'],
    expense: ['إعلانات', 'بضاعة وخامات', 'شحن', 'تغليف', 'مرتبات', 'عمولات', 'إيجار', 'كهربا ونت وموبايلات', 'مواصلات', 'مصاريف أخرى'],
  };
  const METHODS = ['كاش', 'فودافون كاش', 'إنستاباي', 'تحويل بنكي'];

  let S = { rows:null, loading:false, busy:false, err:'', msg:'', msgErr:false,
            date: today(), kind:'expense', category:'', item:'', amount:'', method:'كاش',
            from: monthStart(), to: today(), q:'', show:'all' };

  /* ---------- البيانات ---------- */
  async function load(){
    if(!sb()) return;
    S.loading = true; S.err = ''; draw();
    const { data, error } = await sb().from('accounts_entries').select('*')
      .order('entry_date', { ascending:false }).order('created_at', { ascending:false }).limit(10000);
    S.loading = false;
    if(error){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(error.message)
        ? 'جدول الحسابات لسه مش موجود في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب الحسابات: ' + error.message;
    } else S.rows = data || [];
    draw();
  }

  const inRange = r => (!S.from || r.entry_date >= S.from) && (!S.to || r.entry_date <= S.to);
  const filtered = () => {
    const q = S.q.trim().toLowerCase();
    return (S.rows || []).filter(r => inRange(r) &&
      (S.show === 'all' || r.kind === S.show) &&
      (!q || [r.category, r.item, r.method, r.created_by_name].some(v => String(v || '').toLowerCase().includes(q))));
  };
  function sums(list){
    const t = { i:0, e:0, ni:0, ne:0 };
    list.forEach(x => { if(x.kind === 'income'){ t.i += Number(x.amount); t.ni++; } else { t.e += Number(x.amount); t.ne++; } });
    t.net = t.i - t.e;
    return t;
  }
  function byCat(list, kind){
    const m = {};
    list.filter(r => r.kind === kind).forEach(r => { const k = r.category || 'بدون بند'; m[k] = (m[k] || 0) + Number(r.amount); });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isAC()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function rangeTitle(){
    if(!S.from && !S.to) return 'كل الأيام';
    if(S.from && S.from === S.to) return dayLabel(S.from);
    return 'من ' + (S.from || 'البداية') + ' لـ ' + (S.to || 'النهارده');
  }

  function catBars(list, kind){
    const rows = byCat(list, kind);
    if(!rows.length) return '<p class="none">مفيش.</p>';
    const max = rows[0][1] || 1, col = kind === 'income' ? '#276749' : '#b3423a';
    return rows.map(([k, v]) => `<div class="ac-cat"><span class="nm">${esc(k)}</span>
      <span class="bar"><i style="width:${Math.max(2, v / max * 100)}%;background:${col}"></i></span>
      <span class="v">${fmt(v)} ج</span></div>`).join('');
  }

  function view(){
    const inc = S.kind === 'income';
    let h = `<div class="pagehead"><h1>💼 الحسابات</h1><p>سجّل الإيرادات والمصروفات بتاريخها، والسيستم بيحسب صافي كل يوم (إيرادات − مصروفات) وإجمالي أي فترة.</p></div>`;
    if(S.msg) h += `<div class="ac-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;

    // ملخص النهارده دايمًا ظاهر
    if(S.rows){
      const T0 = sums(S.rows.filter(r => r.entry_date === today()));
      h += `<div class="card" style="padding:12px 16px"><b>📅 النهارده:</b>
        إيرادات <b style="color:#276749">${fmt(T0.i)} ج</b> ·
        مصروفات <b style="color:#b3423a">${fmt(T0.e)} ج</b> ·
        الصافي <b style="color:${T0.net < 0 ? '#b3423a' : 'var(--brass-d)'}">${fmt(T0.net)} ج</b></div>`;
    }

    h += `<div class="card">
      <h3>${inc ? '➕ تسجيل إيراد' : '➖ تسجيل مصروف'}</h3>
      <div class="ac-kind">
        <button type="button" class="exp ${!inc ? 'on' : ''}" data-kind="expense">➖ مصروف</button>
        <button type="button" class="inc ${inc ? 'on' : ''}" data-kind="income">➕ إيراد</button>
      </div>
      <div class="ac-form">
        <div><label for="acDate">التاريخ</label><input class="ac-in" id="acDate" type="date" value="${esc(S.date)}"></div>
        <div><label for="acCat">البند</label><input class="ac-in" id="acCat" list="acCatList" placeholder="اختار أو اكتب" value="${esc(S.category)}" autocomplete="off">
          <datalist id="acCatList">${CATS[S.kind].map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div><label for="acItem">البيان</label><input class="ac-in" id="acItem" placeholder="${inc ? 'مثلاً: تحصيل QP أسبوع 1' : 'مثلاً: إعلانات فيسبوك بيدج كارا'}" value="${esc(S.item)}" autocomplete="off"></div>
        <div><label for="acAmount">المبلغ</label><input class="ac-in" id="acAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(S.amount)}"></div>
        <div><label for="acMethod">طريقة الدفع</label><select class="ac-in" id="acMethod">${METHODS.map(m => `<option ${S.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
        <div><button class="ac-btn pri" data-act="add" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳...' : inc ? 'سجّل الإيراد' : 'سجّل المصروف'}</button></div>
      </div>
    </div>`;

    h += `<div class="card"><div class="ac-bar">
      <label>من <input class="ac-in" type="date" id="acFrom" value="${esc(S.from)}"></label>
      <label>إلى <input class="ac-in" type="date" id="acTo" value="${esc(S.to)}"></label>
      <button class="ac-btn" data-range="today">النهارده</button>
      <button class="ac-btn" data-range="yesterday">امبارح</button>
      <button class="ac-btn" data-range="month">الشهر ده</button>
      <button class="ac-btn" data-range="last">الشهر اللي فات</button>
      <button class="ac-btn" data-range="all">الكل</button>
      <span style="flex:1"></span>
      ${window.XLSX ? '<button class="ac-btn" data-act="xlsx">⬇️ Excel</button>' : ''}
      <button class="ac-btn" data-act="reload">🔄 تحديث</button>
    </div>
    <div class="ac-bar" style="margin-bottom:8px">
      <button class="ac-btn ${S.show === 'all' ? 'on' : ''}" data-show="all">الكل</button>
      <button class="ac-btn ${S.show === 'income' ? 'on' : ''}" data-show="income">الإيرادات بس</button>
      <button class="ac-btn ${S.show === 'expense' ? 'on' : ''}" data-show="expense">المصروفات بس</button>
    </div>
    <input class="ac-in" id="acQ" type="search" placeholder="🔍 دوّر بالبند أو البيان أو اسم اللي سجّل..." value="${esc(S.q)}"></div>`;

    if(S.err) return h + `<div class="ac-msg err">${esc(S.err)}</div>`;
    if(S.rows === null) return h + `<div class="card"><p class="none">⏳ بيحمّل الحسابات...</p></div>`;

    const list = filtered();
    const T = sums(list);
    h += `<div class="ac-kpis">
      <div class="ac-kpi inc"><div class="n">${fmt(T.i)} ج</div><div class="l">الإيرادات (${fmt(T.ni)} عملية) — ${esc(rangeTitle())}</div></div>
      <div class="ac-kpi exp"><div class="n">${fmt(T.e)} ج</div><div class="l">المصروفات (${fmt(T.ne)} عملية)</div></div>
      <div class="ac-kpi net ${T.net < 0 ? 'neg' : ''}"><div class="n">${fmt(T.net)} ج</div><div class="l">${T.net < 0 ? '🔻 عجز' : '✅ الصافي'} (إيرادات − مصروفات)</div></div>
    </div>`;

    if(!list.length) return h + `<div class="card"><p class="none">مفيش عمليات ${S.from || S.to ? 'في الفترة دي' : 'متسجلة لسه'}.</p></div>`;

    h += `<div class="card"><h3>📊 حسب البند — ${esc(rangeTitle())}</h3><div class="ac-cats">
      <div><h4 style="margin:0 0 6px;color:#276749">الإيرادات</h4>${catBars(list, 'income')}</div>
      <div><h4 style="margin:0 0 6px;color:#b3423a">المصروفات</h4>${catBars(list, 'expense')}</div>
    </div></div>`;

    const days = {};
    list.forEach(r => (days[r.entry_date] = days[r.entry_date] || []).push(r));
    const keys = Object.keys(days).sort().reverse();
    const admin = !!me().is_admin, myId = me().id;

    let tb = '<tr><th>النوع</th><th>البند</th><th>البيان</th><th>المبلغ</th><th>طريقة الدفع</th><th>بواسطة</th><th></th></tr>';
    tb += `<tr class="total"><td class="lbl" colspan="3">إجمالي ${esc(rangeTitle())} — ${fmt(keys.length)} يوم</td><td class="${T.net < 0 ? 'ac-neg' : ''}">${fmt(T.net)} ج</td><td colspan="3">إيرادات ${fmt(T.i)} − مصروفات ${fmt(T.e)}</td></tr>`;
    keys.forEach(k => {
      const d = sums(days[k]);
      tb += `<tr class="ac-day" data-day="${k}" title="دوس تعرض اليوم ده بس"><td class="lbl" colspan="3">📅 ${esc(dayLabel(k))}</td>
        <td class="${d.net < 0 ? 'ac-neg' : 'ac-pos'}">صافي اليوم: ${fmt(d.net)} ج</td>
        <td colspan="3">إيرادات ${fmt(d.i)} − مصروفات ${fmt(d.e)}</td></tr>`;
      days[k].forEach(r => {
        const isInc = r.kind === 'income';
        const canDel = admin || (r.created_by && r.created_by === myId);
        tb += `<tr><td><span class="ac-tag ${isInc ? 'inc' : 'exp'}">${isInc ? '➕ إيراد' : '➖ مصروف'}</span></td>
          <td>${esc(r.category || '—')}</td>
          <td class="lbl" style="font-weight:400">${esc(r.item || '—')}</td>
          <td class="${isInc ? 'ac-pos' : 'ac-neg'}">${isInc ? '' : '−'}${fmt(r.amount)}</td>
          <td>${esc(r.method || '—')}</td>
          <td>${esc(r.created_by_name || '—')}</td>
          <td>${canDel ? `<button class="ac-btn sm" data-del="${r.id}" title="امسح">🗑️</button>` : ''}</td></tr>`;
      });
    });
    h += `<div class="card"><h3>كل العمليات يوم بيوم</h3>
      <div class="tablewrap" style="max-height:640px;overflow-y:auto"><table class="pr">${tb}</table></div>
      <p class="none" style="margin-top:8px">دوس على أي يوم عشان تعرضه لوحده. لو سجّلت حاجة غلط امسحها وسجّلها تاني (المسح لصاحب العملية أو الأدمن).</p></div>`;
    return h;
  }

  /* ---------- الأحداث ---------- */
  function setRange(k){
    const t = new Date(), y = t.getFullYear(), m = t.getMonth();
    if(k === 'all'){ S.from = S.to = ''; return; }
    if(k === 'today'){ S.from = S.to = ymd(t); return; }
    if(k === 'yesterday'){ S.from = S.to = ymd(new Date(t.getTime() - 864e5)); return; }
    if(k === 'month'){ S.from = ymd(new Date(y, m, 1)); S.to = ymd(t); return; }
    if(k === 'last'){ S.from = ymd(new Date(y, m - 1, 1)); S.to = ymd(new Date(y, m, 0)); }
  }

  function wire(root){
    const $ = id => root.querySelector('#' + id);
    root.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
      if(S.kind !== b.dataset.kind) S.category = '';
      S.kind = b.dataset.kind; S.msg = ''; draw();
      const i = document.getElementById('acCat'); if(i) i.focus();
    });
    const d = $('acDate'); if(d) d.onchange = () => { S.date = d.value; };
    const ct = $('acCat'); if(ct) ct.oninput = () => { S.category = ct.value; };
    const it = $('acItem'); if(it){ it.oninput = () => { S.item = it.value; }; it.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); const a = document.getElementById('acAmount'); if(a) a.focus(); } }; }
    const am = $('acAmount'); if(am){ am.oninput = () => { S.amount = am.value; }; am.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } }; }
    const mt = $('acMethod'); if(mt) mt.onchange = () => { S.method = mt.value; };
    const ad = root.querySelector('[data-act=add]'); if(ad) ad.onclick = add;
    const fr = $('acFrom'); if(fr) fr.onchange = () => { S.from = fr.value; draw(); };
    const to = $('acTo'); if(to) to.onchange = () => { S.to = to.value; draw(); };
    root.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { setRange(b.dataset.range); draw(); });
    root.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { S.show = b.dataset.show; draw(); });
    const q = $('acQ'); if(q) q.oninput = () => { S.q = q.value; draw(); };
    root.querySelectorAll('[data-day]').forEach(tr => tr.onclick = () => { S.from = S.to = tr.dataset.day; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); del(b.dataset.del); });
    const rl = root.querySelector('[data-act=reload]'); if(rl) rl.onclick = () => { S.msg = ''; load(); };
    const x = root.querySelector('[data-act=xlsx]'); if(x) x.onclick = exportXlsx;
  }

  async function add(){
    const category = S.category.trim(), item = S.item.trim(), amount = toNum(S.amount);
    if(!S.date) return flash('اختار التاريخ.', true);
    if(!category) return flash('اختار البند أو اكتبه.', true);
    if(amount === null || amount <= 0) return flash('اكتب المبلغ (رقم أكبر من صفر).', true);
    S.busy = true; draw();
    const { error } = await sb().from('accounts_entries').insert({
      entry_date: S.date, kind: S.kind, category, item, amount, method: S.method, created_by_name: myName()
    });
    S.busy = false;
    if(error) return flash('❌ مقدرناش نسجّل: ' + error.message, true);
    const wasInc = S.kind === 'income';
    if((S.from && S.date < S.from) || (S.to && S.date > S.to)){ S.from = S.to = ''; }
    S.item = ''; S.amount = '';
    S.msg = `✅ اتسجّل ${wasInc ? 'إيراد' : 'مصروف'} "${category}${item ? ' — ' + item : ''}" بـ ${fmt(amount)} ج يوم ${dayLabel(S.date)}.`; S.msgErr = false;
    await load();
    const i = document.getElementById('acItem'); if(i) i.focus();
  }

  async function del(id){
    const r = (S.rows || []).find(x => String(x.id) === String(id));
    if(!r || !confirm(`تمسح ${r.kind === 'income' ? 'الإيراد' : 'المصروف'} "${r.category}${r.item ? ' — ' + r.item : ''}" (${fmt(r.amount)} ج)؟`)) return;
    const { data, error } = await sb().from('accounts_entries').delete().eq('id', id).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح' + (error ? ': ' + error.message : ' — المسح لصاحب العملية أو الأدمن بس.'), true);
    S.msg = '✅ اتمسحت.'; S.msgErr = false;
    await load();
  }

  function exportXlsx(){
    const list = filtered().slice().sort((a, b) => a.entry_date < b.entry_date ? -1 : a.entry_date > b.entry_date ? 1 : 0);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(list.map(r => ({
      'التاريخ': r.entry_date, 'النوع': r.kind === 'income' ? 'إيراد' : 'مصروف', 'البند': r.category || '', 'البيان': r.item || '',
      'المبلغ': r.kind === 'income' ? Number(r.amount) : -Number(r.amount), 'طريقة الدفع': r.method || '', 'بواسطة': r.created_by_name || '' }))), 'كل العمليات');
    const days = {};
    list.forEach(r => (days[r.entry_date] = days[r.entry_date] || []).push(r));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.keys(days).sort().map(k => { const t = sums(days[k]);
      return { 'التاريخ': k, 'الإيرادات': t.i, 'المصروفات': t.e, 'الصافي': t.net }; })), 'صافي كل يوم');
    const cats = [...byCat(list, 'income').map(([k, v]) => ({ 'النوع':'إيراد', 'البند':k, 'الإجمالي':v })),
                  ...byCat(list, 'expense').map(([k, v]) => ({ 'النوع':'مصروف', 'البند':k, 'الإجمالي':v }))];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cats), 'حسب البند');
    XLSX.writeFile(wb, 'الحسابات ' + (S.from || 'الكل') + (S.to && S.to !== S.from ? ' إلى ' + S.to : '') + '.xlsx');
  }

  /* ---------- لينك في القائمة (أول حاجة تحت المالية) ---------- */
  const anchor = document.querySelector('#sidebar a.navlink[href="#/profits"]');
  if(anchor && !document.querySelector('#sidebar a.navlink[href="#/accounts"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/accounts'; a.textContent = '💼 الحسابات';
    anchor.before(a);
  }

  /* ---------- الربط بالراوتر ---------- */
  function mount(){
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/accounts'));
    draw(); if(S.rows === null && !S.loading && !S.err) load();
  }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isAC()) mount(); };
  window.addEventListener('hashchange', () => { if(isAC()) mount(); });
  if(isAC()) setTimeout(mount, 0);
})();
</script>

</body>
</html>
