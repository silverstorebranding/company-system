.qp-prog i{display:block;height:100%;background:var(--brass);width:0;transition:width .2s}
</style>

<script>
(function(){
  const QP_API      = 'https://api.qpxpress.com';
  const QP_TOKEN_EP = QP_API + '/api/token/';
  const QP_ORDERS_EP= QP_API + '/addorders/order/';
  const QP_PAGE_SIZE= 100;
  const QP_MAX_PAGES= 400;   // حد أمان (ماكس 40 ألف أوردر)
  const QP_LS       = 'qp_creds';

  /* ================= تصنيف الحالات =================
     كل رقم حالة في QP (Order_Delivery_Status) بيتربط بتصنيف من الخمسة اللي في شركة الشحن.
     الربط ده بيتعدّل من جوه الصفحة (كارت "🔧 ربط حالات QP") وبيتحفظ على الجهاز،
     وكل الأرقام (الكروت + الفلاتر + الأرباح + المرتجعات) بتتحسب منه. */
  const QP_CATS = {
    pending:     { label:'Pending — بيندينج',                    short:'Pending',          color:'#6b6659', pr:'Pending' },
    ofd:         { label:'Out For Delivery — تحت التسليم',       short:'Out For Delivery', color:'#9a6b14', pr:'Out for Delivery' },
    hold:        { label:'Hold — هولد',                           short:'Hold',             color:'#8a6d3b', pr:'Hold' },
    delivered:   { label:'Delivered — اتسلم',                     short:'Delivered',        color:'#276749', pr:'Delivered' },
    undelivered: { label:'Undelivered — راجع للفرع / مستلمش',    short:'Undelivered',      color:'#b3423a', pr:'Undelivered' },
  };
  const QP_CAT_ORDER = ['pending','ofd','hold','undelivered','delivered'];
  const QP_MAP_LS = 'qp_status_map';
  const QP_MAP_DEFAULT = { '1':'pending', '2':'ofd', '3':'delivered', '4':'hold', '5':'undelivered', '6':'undelivered' };
  let qpMap = (() => { try{ return Object.assign({}, QP_MAP_DEFAULT, JSON.parse(localStorage.getItem(QP_MAP_LS)) || {}); }catch(e){ return Object.assign({}, QP_MAP_DEFAULT); } })();
  const qpSaveMap = () => { try{ localStorage.setItem(QP_MAP_LS, JSON.stringify(qpMap)); }catch(e){} };

  const stCode = o => String(o.Order_Delivery_Status ?? '').trim();
  const catOf  = o => qpMap[stCode(o)] || 'unknown';
  // أسماء الحالات زي ما QP باعتها (لو الـ API بيبعت اسم نصي جنب الرقم)
  let qpNames = {};
  function qpDetectNames(list){
    const m = {};
    (list || []).forEach(o => {
      const k = stCode(o);
      Object.entries(o).forEach(([key, v]) => {
        if(key === 'Order_Delivery_Status' || typeof v !== 'string') return;
        if(!/status|state|stage/i.test(key)) return;
        const t = v.trim(); if(!t || !isNaN(t) || t.length > 40) return;
        (m[k] = m[k] || {})[t] = ((m[k] || {})[t] || 0) + 1;
      });
    });
    qpNames = {};
    Object.entries(m).forEach(([k, names]) => {
      qpNames[k] = Object.entries(names).sort((a,b) => b[1] - a[1]).slice(0,2).map(x => x[0]).join(' / ');
    });
  }
  const qpStatus = s => {
    const k = String(s), c = QP_CATS[qpMap[k]];
    const label = qpNames[k] || (c ? c.short : 'غير مصنّفة');
    return { label: label + ' #' + k, color: c ? c.color : '#6b6659', pr: c ? c.pr : 'Pending' };
  };
  const isDelivered = o => catOf(o) === 'delivered';
  const hasReturnDate = o => { const v = String(o.returned_Client_date ?? '').trim(); return !!v && v !== 'NaT' && v !== 'null'; };
  // مرتجع لينا عند QP: حالته Undelivered ولسه ماخدش تاريخ إرجاع
  const isStuckReturn = o => catOf(o) === 'undelivered' && !hasReturnDate(o);

  let creds = (() => { try{ return JSON.parse(localStorage.getItem(QP_LS)) || null; }catch(e){ return null; } })();
  let token = null;
  let qpFrom = '2026-08-01';
  let qpTo   = new Date().toISOString().slice(0,10);
  let qpOrders = null, qpLoading = false, qpErr = '', qpInfo = '', qpProg = 0, qpFetchedAt = null;
  let qpStFilter = 'all', qpQuery = '';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Math.round(n).toLocaleString('ar-EG');
  const num = v => parseFloat(String(v ?? '').replace(/[^\d.-]/g,'')) || 0;
  const qpBrand = notes => (typeof prGetBrand === 'function' ? (prGetBrand(notes) || 'بدون براند') : (notes || 'بدون براند'));
  const isReturned = o => !!(o.Returned_Client || o.Returned_shipper || o.returned_Client_date || (num(o.return_count) > 0) || o.has_return);
  const route = () => (location.hash.replace('#/','') || 'home').split('/')[0];

  function qpRerender(){ if(route() === 'qp'){ const m = document.getElementById('main'); if(m) m.innerHTML = viewQP(); } }

  /* ---------- تسجيل الدخول والتوكن ---------- */
  async function qpGetToken(force){
    if(token && !force) return token;
    if(!creds) throw new Error('مفيش بيانات دخول محفوظة.');
    const res = await fetch(QP_TOKEN_EP, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ username: creds.u, password: creds.p })
    });
    if(res.status === 401) throw new Error('اليوزرنيم أو الباسورد غلط.');
    if(!res.ok) throw new Error('السيرفر رفض تسجيل الدخول (' + res.status + ').');
    const j = await res.json();
    if(!j.access) throw new Error('مفيش توكن رجع من السيرفر.');
    token = j.access;
    return token;
  }

  async function qpApiGet(url, retry){
    const t = await qpGetToken();
    const res = await fetch(url, { headers:{ 'Authorization':'Bearer ' + t } });
    if(res.status === 401 && !retry){ token = null; return qpApiGet(url, true); } // التوكن خلص، جدّده
    if(!res.ok) throw new Error('السيرفر رجّع خطأ (' + res.status + ').');
    return res.json();
  }

  function qpSaveCreds(u, p){
    creds = { u: u.trim(), p };
    try{ localStorage.setItem(QP_LS, JSON.stringify(creds)); }catch(e){}
  }
  function qpLogout(){
    creds = null; token = null; qpOrders = null; qpErr = ''; qpInfo = '';
    try{ localStorage.removeItem(QP_LS); }catch(e){}
    qpRerender();
  }

  async function qpDoLogin(u, p){
    if(!u || !p){ qpErr = 'اكتب اليوزرنيم والباسورد.'; qpRerender(); return; }
    qpLoading = true; qpErr = ''; qpRerender();
    qpSaveCreds(u, p); token = null;
    try{
      await qpGetToken(true);
      qpLoading = false; qpInfo = 'تم الدخول ✅ دوس "جيب الأوردرات".'; qpErr = '';
      qpRerender();
    }catch(e){
      qpLoading = false; qpErr = e.message; creds = null;
      try{ localStorage.removeItem(QP_LS); }catch(x){}
      qpRerender();
    }
  }

  /* ---------- جلب الأوردرات على صفحات (دالة قابلة لإعادة الاستخدام) ----------
     بترجّع مصفوفة الأوردرات للمدة المطلوبة، وبتنادي onProg(count, pct) كل صفحة */
  async function qpFetchRange(from, to, onProg){
    const all = [];
    const fromT = new Date(from + 'T00:00:00').getTime();
    const toT   = new Date(to   + 'T23:59:59').getTime();
    for(let page = 1; page <= QP_MAX_PAGES; page++){
      const url = QP_ORDERS_EP + '?rejected=0&printO=All&status=&order_serial=&full_name=&phone_number=&city=' +
        '&order_date=' + from + '&to_date=' + to + '&page=' + page + '&page_size=' + QP_PAGE_SIZE;
      const j = await qpApiGet(url);
      const rows = j.results || [];
      if(!rows.length) break;
      let older = false;
      rows.forEach(o => {
        const t = new Date(o.order_date).getTime();
        if(isNaN(t)) { all.push(o); return; }
        if(t < fromT){ older = true; return; }
        if(t > toT) return;
        all.push(o);
      });
      if(onProg){
        const pct = j.count ? Math.min(100, Math.round(all.length / Math.min(j.count, QP_MAX_PAGES * QP_PAGE_SIZE) * 100)) : 0;
        onProg(all.length, pct);
      }
      if(older) break;            // وصلنا لأوردرات أقدم من التاريخ المطلوب (مترتبة من الأحدث)
      if(!j.next) break;          // مفيش صفحة بعد كده
    }
    const seen = new Set();       // شيل التكرار لو حصل
    return all.filter(o => { if(seen.has(o.serial)) return false; seen.add(o.serial); return true; });
  }

  async function qpFetch(){
    qpLoading = true; qpErr = ''; qpInfo = ''; qpProg = 0; qpRerender();
    try{
      qpOrders = await qpFetchRange(qpFrom, qpTo, (n, pct) => {
        qpProg = pct; qpInfo = 'بيجيب... ' + n + ' أوردر'; qpRerender();
      });
      qpDetectNames(qpOrders);
      qpFetchedAt = new Date();
      qpLoading = false; qpProg = 100;
      qpInfo = 'تم ✅ ' + qpOrders.length + ' أوردر من ' + qpFrom + ' لـ ' + qpTo;
      qpRerender();
    }catch(e){
      qpLoading = false;
      qpErr = /Failed to fetch|NetworkError/i.test(e.message)
        ? 'مش قادر يوصل لموقع الشحن. اتأكد إن فيه إنترنت وإن الموقع شغّال.'
        : e.message;
      qpRerender();
    }
  }

  /* ---------- إحصائيات ---------- */
  function qpStats(list){
    const st = {}, brand = {}, cat = { pending:0, ofd:0, hold:0, delivered:0, undelivered:0, unknown:0 };
    let sales = 0, fees = 0, ret = 0, salesDel = 0, feesDel = 0;
    list.forEach(o => {
      const k = stCode(o), c = catOf(o);
      st[k] = (st[k] || 0) + 1;
      cat[c] = (cat[c] || 0) + 1;
      const del = c === 'delivered';
      const b = qpBrand(o.notes); brand[b] = brand[b] || { n:0, sales:0, del:0, salesDel:0 };
      brand[b].n++; brand[b].sales += num(o.price);
      sales += num(o.price); fees += num(o.total_fees);
      if(isReturned(o)) ret++;
      if(del){ salesDel += num(o.price); feesDel += num(o.total_fees); brand[b].del++; brand[b].salesDel += num(o.price); }
    });
    const deliveredCount = cat.delivered;
    const rate = list.length ? (deliveredCount / list.length * 100) : 0;
    return { st, cat, brand, sales, fees, ret, salesDel, feesDel, deliveredCount, rate };
  }
  const qpFiltered = () => {
    if(!qpOrders) return [];
    let l = qpOrders;
    if(qpStFilter === 'stuck') l = l.filter(isStuckReturn);
    else if(qpStFilter.startsWith('cat:')) l = l.filter(o => catOf(o) === qpStFilter.slice(4));
    else if(qpStFilter !== 'all') l = l.filter(o => stCode(o) === qpStFilter);
    const q = qpQuery.trim().toLowerCase();
    if(q) l = l.filter(o => [o.full_name, o.phone, o.serial, o.notes, o.city, o.customer_phone].some(v => String(v ?? '').toLowerCase().includes(q)));
    return l;
  };

  /* ---------- الصفحة ---------- */
  function viewQP(){
    let h = `<div class="pagehead"><h1>🚚 QP</h1><p>الأوردرات جاية مباشرة من موقع شركة الشحن QP Express.</p></div>`;

    if(!creds){
      return h + `<div class="qp-auth"><h3>الدخول على QP Express</h3>
        <div class="qp-note">البيانات بتتحفظ على الجهاز ده بس، ومش بتتكتب في كود الصفحة. الأفضل تستخدم حساب فرعي لو متاح، وتغيّر الباسورد لو شاركت الجهاز.</div>
        ${qpErr ? `<div class="mono-note">${esc(qpErr)}</div>` : ''}
        ${qpInfo ? `<p class="qp-userline">${esc(qpInfo)}</p>` : ''}
        <div class="qp-field"><label>اليوزرنيم</label><input id="qpU" type="text" autocomplete="off" value="${esc(creds ? creds.u : '')}"></div>
        <div class="qp-field"><label>الباسورد</label><input id="qpP" type="password" autocomplete="off"></div>
        <button class="mockbtn" onclick="QP.login()" ${qpLoading ? 'disabled' : ''}>${qpLoading ? 'بيتحقق...' : 'دخول'}</button>
      </div>`;
    }

    h += `<div class="qp-toolbar">
      <span class="qp-userline">داخل باسم <b>${esc(creds.u)}</b></span>
      <label>من <input type="date" value="${qpFrom}" onchange="QP.setDate('from',this.value)"></label>
      <label>إلى <input type="date" value="${qpTo}" onchange="QP.setDate('to',this.value)"></label>
      <button class="mockbtn" onclick="QP.fetch()" ${qpLoading ? 'disabled' : ''}>${qpLoading ? '⏳ بيجيب...' : '⬇️ جيب الأوردرات'}</button>
      <button class="linkbtn" onclick="QP.logout()">خروج</button>
      ${qpFetchedAt ? `<span class="qp-userline">آخر تحديث: ${qpFetchedAt.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span>` : ''}
    </div>`;

    if(qpLoading) h += `<div class="card"><p class="qp-userline">${esc(qpInfo || 'بيشتغل...')}</p><div class="qp-prog"><i style="width:${qpProg}%"></i></div></div>`;
    if(qpErr) h += `<div class="mono-note">${esc(qpErr)}</div>`;

    if(!qpOrders){
      if(!qpLoading) h += `<div class="card"><p class="none">اختار الفترة (الافتراضي من 1 أغسطس) ودوس "جيب الأوردرات".</p></div>`;
      return h;
    }

    const all = qpStats(qpOrders);
    const stuck = qpOrders.filter(isStuckReturn).length;
    const catCard = c => { const C = QP_CATS[c], on = qpStFilter === 'cat:' + c;
      return `<div class="qp-kpi" onclick="QP.filterSt('cat:${c}')" style="cursor:pointer;border-top:4px solid ${C.color}${on ? ';background:var(--slate-l);outline:2px solid ' + C.color : ''}">
        <div class="n" style="color:${C.color}">${fmt(all.cat[c] || 0)}</div><div class="l">${C.label} · دوس تعرضهم</div></div>`; };
    h += `<div class="qp-note">الأرقام دي محسوبة على الأوردرات من <b>${esc(qpFrom)}</b> لـ <b>${esc(qpTo)}</b> بس. لو لوحة شركة الشحن بتعرض كل الأوردرات من غير تاريخ، رجّع تاريخ "من" لأقدم تاريخ عشان الأرقام تتطابق.</div>`;
    h += `<div class="qp-kpis">${QP_CAT_ORDER.map(catCard).join('')}
      ${all.cat.unknown ? `<div class="qp-kpi" style="border-top:4px solid var(--warn)"><div class="n" style="color:var(--warn)">${fmt(all.cat.unknown)}</div><div class="l">⚠️ حالات مش متصنّفة — اربطها من "🔧 ربط حالات QP" تحت</div></div>` : ''}
    </div>`;
    h += `<div class="qp-kpis">
      <div class="qp-kpi" onclick="QP.filterSt('all')" style="cursor:pointer"><div class="n">${fmt(qpOrders.length)}</div><div class="l">إجمالي الأوردرات</div></div>
      <div class="qp-kpi"><div class="n">${all.rate.toFixed(1)}%</div><div class="l">✅ نسبة التسليم</div></div>
      <div class="qp-kpi"><div class="n green">${fmt(all.salesDel)} ج</div><div class="l">💰 إجمالي القيمة (المُسلَّم بس)</div></div>
      <div class="qp-kpi"><div class="n">${fmt(all.fees)} ج</div><div class="l">🚚 إجمالي الشحن</div></div>
      <div class="qp-kpi"><div class="n">${fmt(all.ret)}</div><div class="l">↩️ مرتجعات (ليها علامة إرجاع)</div></div>
      <div class="qp-kpi" onclick="QP.filterSt('stuck')" style="cursor:pointer;border:2px solid var(--warn)${qpStFilter==='stuck'?';background:#f4e2de':''}">
        <div class="n" style="color:var(--warn)">${fmt(stuck)}</div>
        <div class="l">📦 مرتجع لينا عند QP — Undelivered ومن غير تاريخ إرجاع · دوس تعرضهم</div>
      </div>
    </div>`;

    // ربط أرقام الحالات بالتصنيفات
    const stKeys = Object.keys(all.st).sort((a,b) => all.st[b] - all.st[a]);
    h += `<details class="card" ${all.cat.unknown ? 'open' : ''}><summary style="cursor:pointer;font-weight:700;color:var(--brass-d)">🔧 ربط حالات QP (لو أي رقم مش مطابق لشركة الشحن صلّحه من هنا)</summary>
      <p class="none" style="margin:10px 0">كل سطر = رقم حالة جاي من QP وعدد أوردراته. اختار هو تبع أنهي تصنيف، والأرقام فوق هتتحسب فورًا وتتحفظ على الجهاز ده.${Object.keys(qpNames).length ? ' عمود "الاسم في QP" جاي من بيانات الشحنة نفسها.' : ''}</p>
      <div class="tablewrap"><table class="pr">
        <tr><th>رقم الحالة</th>${Object.keys(qpNames).length ? '<th>الاسم في QP</th>' : ''}<th>عدد الأوردرات</th><th>التصنيف</th><th></th></tr>
        ${stKeys.map(k => `<tr><td><b>#${esc(k)}</b></td>${Object.keys(qpNames).length ? `<td>${esc(qpNames[k] || '—')}</td>` : ''}<td>${fmt(all.st[k])}</td>
          <td><select onchange="QP.mapSt('${esc(k)}',this.value)" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-family:inherit">
            <option value="" ${!qpMap[k] ? 'selected' : ''}>— مش متصنّفة —</option>
            ${QP_CAT_ORDER.map(c => `<option value="${c}" ${qpMap[k] === c ? 'selected' : ''}>${QP_CATS[c].label}</option>`).join('')}
          </select></td>
          <td><button class="linkbtn" onclick="QP.filterSt('${esc(k)}')">اعرضهم</button></td></tr>`).join('')}
      </table></div>
      <div style="margin-top:10px"><button class="linkbtn" onclick="QP.resetMap()">↩️ رجّع الربط الافتراضي</button></div>
    </details>`;

    // ملخص البراندات
    const brs = Object.entries(all.brand).sort((a,b) => b[1].n - a[1].n);
    h += `<div class="card"><h3>حسب البراند</h3><div class="tablewrap"><table class="pr">
      <tr><th>البراند</th><th>عدد الأوردرات</th><th>اتسلم</th><th>نسبة التسليم</th><th>قيمة المُسلَّم</th></tr>
      ${brs.map(([b,v]) => `<tr><td class="lbl" style="text-align:right">${esc(b)}</td><td>${fmt(v.n)}</td><td>${fmt(v.del||0)}</td><td>${v.n?((v.del||0)/v.n*100).toFixed(1)+'%':'—'}</td><td>${fmt(v.salesDel||0)}</td></tr>`).join('')}
    </table></div></div>`;

    // الجدول
    const list = qpFiltered();
    const cap = 400;
    let rows = list.slice(0, cap).map(o => {
      const s = qpStatus(o.Order_Delivery_Status);
      const d = new Date(o.order_date);
      return `<tr>
        <td>${esc(o.serial)}</td>
        <td class="lbl" style="text-align:right">${esc(o.full_name || '—')}</td>
        <td>${esc(o.phone || '—')}</td>
        <td>${esc(o.city || '—')}</td>
        <td>${esc(qpBrand(o.notes))}</td>
        <td>${fmt(num(o.price))}</td>
        <td>${fmt(num(o.total_fees))}</td>
        <td><span class="qp-tag" style="background:${s.color}22;color:${s.color}">${esc(s.label)}</span>${isReturned(o) ? ' <span class="qp-tag qp-ret">مرتجع</span>' : ''}</td>
        <td>${isNaN(d) ? '—' : d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</td>
      </tr>`;
    }).join('');
    h += `<div class="card"><h3>الأوردرات — ${fmt(list.length)}${qpStFilter==='stuck' ? ' (مرتجعات لينا عند QP — راجع للفرع)' : qpStFilter.startsWith('cat:') ? ' (' + esc(QP_CATS[qpStFilter.slice(4)].label) + ')' : qpStFilter!=='all' ? ' (' + esc(qpStatus(qpStFilter).label) + ')' : ''}</h3>
      <input class="qp-search" placeholder="🔍 دوّر باسم العميل، التليفون، السيريال، البراند، أو المدينة..." value="${esc(qpQuery)}" oninput="QP.search(this.value)">
      <div class="tablewrap" style="max-height:520px;overflow-y:auto"><table class="pr">
        <tr><th>السيريال</th><th>العميل</th><th>الموبايل</th><th>المدينة</th><th>البراند</th><th>القيمة</th><th>الشحن</th><th>الحالة</th><th>التاريخ</th></tr>
        ${rows || '<tr><td colspan="9" class="none">مفيش نتايج للبحث ده.</td></tr>'}
      </table></div>
      ${list.length > cap ? `<p class="none" style="margin-top:8px">بيعرض أول ${cap} أوردر بس. ضيّق بالبحث أو بالحالة عشان تشوف الباقي. الإحصائيات فوق محسوبة على الكل.</p>` : ''}
    </div>`;

    h += `<div class="card"><h3>ربط بتقرير الأرباح</h3>
      <p class="none" style="margin-bottom:10px">تقدر تغذّي تقرير الأرباح بالأوردرات دي بدل ما ترفع ملف الإكسل.</p>
      <button class="mockbtn" onclick="QP.toProfits()">💰 استخدم الأوردرات دي في تقرير الأرباح</button>
      <span class="qp-userline" id="qpToProfits" style="margin-inline-start:10px"></span></div>`;
    return h;
  }

  /* ---------- تحويل أوردرات QP لصفوف يفهمها تقرير الأرباح ---------- */
  function qpToProfitRows(list){
    // ترتيب الأعمدة زي ملف الأوردرات: E=سعر(5) F=شحن(6) I=تاريخ إرجاع(9) J=ملاحظة(10) K=تاريخ(11) L=محتويات(12) O=حالة(15)
    return (list || qpOrders || []).map(o => {
      const r = new Array(15).fill('');
      r[4]  = num(o.price);                 // E
      r[5]  = num(o.total_fees);            // F
      r[8]  = o.returned_Client_date || ''; // I
      r[9]  = o.notes || '';                // J
      r[10] = new Date(o.order_date);       // K
      r[11] = o.shipment_contents || '';    // L
      r[14] = (QP_CATS[catOf(o)] || { pr:'Pending' }).pr; // O
      return r;
    });
  }
  function qpFeedProfits(statusSpan){
    if(!qpOrders || !qpOrders.length){ if(statusSpan) statusSpan.textContent = 'جيب الأوردرات الأول.'; return false; }
    if(typeof prProcess !== 'function'){ if(statusSpan) statusSpan.textContent = 'تقرير الأرباح مش متاح.'; return false; }
    prProcess(qpToProfitRows());
    const res = document.getElementById('prResults'); if(res) res.style.display = 'block';
    return true;
  }

  /* ---------- ربط بالراوتر والقائمة ---------- */
  function qpAfterRender(){
    const r = route();
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/' + r));
    if(r === 'qp') qpRerender();
    else if(r === 'profits' && qpOrders && qpOrders.length) qpInjectProfitsBtn();
  }
  function qpInjectProfitsBtn(){
    const card = document.getElementById('prFileIn')?.closest('.card');
    if(!card || document.getElementById('qpProfitsBtn')) return;
    const box = document.createElement('div');
    box.className = 'ads-fill'; box.style.marginTop = '12px';
    box.innerHTML = `<button class="mockbtn" id="qpProfitsBtn" onclick="QP.toProfitsHere(this)">🚚 استخدم أوردرات QP بدل الإكسل (${qpOrders.length})</button><span class="qp-userline" id="qpProfitsMsg"></span>`;
    card.appendChild(box);
  }
  // بيتأكد إن صندوق ملء الإعلانات موجود (وفيه #adsFillStatus) عشان Ads.fill() ما يبوظش
  function qpEnsureAdsBox(){
    const tbl = document.getElementById('prFullTable');
    if(!tbl || document.getElementById('adsFillBox')) return;
    const box = document.createElement('div');
    box.id = 'adsFillBox'; box.className = 'ads-fill';
    box.innerHTML = `<button class="mockbtn" onclick="Ads.fill()">📢 املأ الإعلانات من جوجل شيت</button><span id="adsFillStatus"></span>`;
    tbl.closest('.card').insertBefore(box, tbl.parentElement);
  }

  // لينك في السايدبار تحت "الأرباح" (أو "البوصلة" لو موجودة)
  const anchor = document.querySelector('#sidebar a.navlink[href="#/compass"]') || document.querySelector('#sidebar a.navlink[href="#/profits"]');
  if(anchor && !document.querySelector('#sidebar a.navlink[href="#/qp"]')){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/qp'; a.textContent = '🚚 QP';
    anchor.after(a);
  }

  const _render = render;
  render = function(){ _render.apply(this, arguments); qpAfterRender(); };
  window.addEventListener('hashchange', qpAfterRender);

  window.QP = {
    // بيستخدمه قسم الـ Squad في المطابقة
    api: {
      hasCreds: () => !!creds,
      fetchRange: (from, to, onProg) => qpFetchRange(from, to, onProg),
      category: o => catOf(o),
      label: o => qpStatus(o.Order_Delivery_Status).label,
    },
    login(){ qpDoLogin(document.getElementById('qpU').value, document.getElementById('qpP').value); },
    logout: qpLogout,
    fetch: qpFetch,
    setDate(k, v){ if(k === 'from') qpFrom = v; else qpTo = v; },
    filterSt(k){ qpStFilter = k; qpRerender(); },
    mapSt(k, c){ if(c) qpMap[k] = c; else delete qpMap[k]; qpSaveMap(); qpRerender(); },
    resetMap(){ qpMap = Object.assign({}, QP_MAP_DEFAULT); try{ localStorage.removeItem(QP_MAP_LS); }catch(e){} qpRerender(); },
    search(v){ qpQuery = v; qpRerender();
      const inp = document.querySelector('.qp-search'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } },
    toProfits(){
      const span = document.getElementById('qpToProfits');
      if(qpFeedProfits(span)){ span.textContent = '✅ اتبعتت للأرباح...'; go('#/profits'); }
    },
    toProfitsHere(btn){
      const msg = document.getElementById('qpProfitsMsg');
      if(qpFeedProfits(msg)) msg.textContent = '✅ اتحسبت الأرباح من ' + qpOrders.length + ' أوردر QP.';
    },
    // 🔽 الحساب التلقائي من صفحة الأرباح: يجيب أوردرات المدة من QP + إعلانات نفس المدة
    async calcProfitsRange(){
      const st = document.getElementById('prAutoStatus');
      const from = document.getElementById('prAutoFrom') && document.getElementById('prAutoFrom').value;
      const to   = document.getElementById('prAutoTo')   && document.getElementById('prAutoTo').value;
      if(!from || !to){ if(st) st.textContent = 'اختار المدة (من / إلى) الأول.'; return; }
      if(from > to){ if(st) st.textContent = 'تاريخ "من" لازم يكون قبل "إلى".'; return; }
      if(!creds){ if(st) st.innerHTML = '⚠️ لازم تسجّل دخول QP الأول من قسم <b>🚚 QP</b> في القائمة، وبعدين ترجع هنا.'; return; }
      if(typeof prProcess !== 'function'){ if(st) st.textContent = 'تقرير الأرباح مش متاح.'; return; }
      try{
        if(st) st.textContent = '⏳ بيجيب أوردرات QP من ' + from + ' لـ ' + to + '...';
        const list = await qpFetchRange(from, to, n => { if(st) st.textContent = '⏳ بيجيب أوردرات QP... ' + n + ' أوردر'; });
        if(!list.length){ if(st) st.textContent = 'مفيش أوردرات في المدة دي على QP.'; return; }
        qpOrders = list; qpFrom = from; qpTo = to; qpFetchedAt = new Date(); qpDetectNames(list);
        if(st) st.textContent = '⚙️ بيحسب الأرباح من ' + list.length + ' أوردر...';
        prProcess(qpToProfitRows(list));
        const res = document.getElementById('prResults'); if(res) res.style.display = 'block';
        let adsMsg = '';
        try{
          qpEnsureAdsBox();
          if(window.Ads && typeof window.Ads.fill === 'function'){ await window.Ads.fill(); adsMsg = ' — وجِبت الإعلانات لنفس المدة (اطمن على قيمها في صف "📢 إعلانات" بالجدول).'; }
        }catch(e){ adsMsg = ' (تعذّر جلب الإعلانات تلقائيًا — تقدر تملأها من صفحة 📢 الإعلانات)'; }
        if(st) st.innerHTML = '✅ تم الحساب من <b>' + list.length + '</b> أوردر QP للمدة من ' + from + ' لـ ' + to + '.' + adsMsg;
        if(res && res.scrollIntoView) res.scrollIntoView({ behavior:'smooth', block:'start' });
      }catch(e){
        if(st) st.textContent = /Failed to fetch|NetworkError/i.test(e.message)
          ? 'مش قادر يوصل لموقع الشحن QP. اتأكد إنك داخل على QP وإن فيه إنترنت.'
          : ('خطأ: ' + e.message);
      }
    },
  };

  qpAfterRender();
})();
</script>
<!-- =====================================================================
     💬 باتش الواتساب + متابعة الهولد لقسم QP
     الصق البلوك ده كله مرة واحدة قبل سطر </body> على طول
     (يعني تحت خالص، بعد آخر </script> بتاع قسم QP وقبل </body>)
     مش محتاج تعدّل أي حاجة تانية في الملف.
     ===================================================================== -->
<script>
(function(){
  const MARK = 'data-wa-done';

  // تحويل الأرقام العربية للإنجليزية
  const toEn = s => String(s||'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

  // تطبيع رقم الموبايل المصري لصيغة واتساب الدولية (2010xxxxxxxx)
  function waPhone(raw){
    let p = toEn(raw).replace(/[^\d]/g,'');
    if(!p) return '';
    if(p.startsWith('00')) p = p.slice(2);
    if(p.startsWith('20')) return p;
    if(p.startsWith('0'))  return '20' + p.slice(1);
    return '20' + p;
  }

  // الرسالة اللي هتتبعت للعميل — عدّل النص زي ما تحب
  function buildMessage(d){
    const L = [];
    L.push('السلام عليكم' + (d.name && d.name !== '—' ? ' أ/ ' + d.name : '') + ' 🌸');
    L.push('معاكم خدمة عملاء متجرنا بخصوص طلب حضرتك.');
    if(d.serial && d.serial !== '—') L.push('رقم الشحنة: ' + d.serial);
    if(d.brand  && d.brand  !== '—') L.push('النوع: ' + d.brand);
    if(d.price  && d.price  !== '—') L.push('الإجمالي: ' + d.price + ' ج');
    if(d.city   && d.city   !== '—') L.push('المحافظة: ' + d.city);
    if(d.status && d.status !== '—') L.push('حالة الشحنة حاليًا: ' + d.status);
    L.push('');
    L.push('حابين نطمن على وصول طلبك 🙏');
    L.push('هل تواصل معاك مندوب الشحن؟ وهل فيه أي مشكلة في التوصيل؟');
    L.push('لو المندوب مكلمكش أو فيه أي مشكلة، قولنا وإحنا نظبّطها فورًا.');
    return L.join('\n');
  }

  // نلاقي جدول أوردرات QP (اللي فيه أعمدة السيريال + الموبايل + الحالة)
  function qpTable(){
    const tables = document.querySelectorAll('#main .card table.pr');
    for(const t of tables){
      const heads = [...t.querySelectorAll('tr:first-child th')].map(th => th.textContent.trim());
      if(heads.includes('الموبايل') && heads.includes('الحالة') && heads.includes('السيريال')) return t;
    }
    return null;
  }
  const cellVal = (row, heads, name) => {
    const i = heads.indexOf(name);
    return i < 0 || !row.children[i] ? '' : row.children[i].textContent.trim();
  };

  // (1) زرار واتساب جنب كل أوردر
  function injectButtons(){
    const t = qpTable();
    if(!t) return;
    const headRow = t.querySelector('tr:first-child');
    if(!headRow) return;
    if(!headRow.querySelector('th[data-wa-head]')){
      const th = document.createElement('th');
      th.setAttribute('data-wa-head','1');
      th.textContent = 'واتساب';
      headRow.appendChild(th);
    }
    const heads = [...headRow.children].filter(th => !th.hasAttribute('data-wa-head')).map(th => th.textContent.trim());
    [...t.querySelectorAll('tr')].slice(1).forEach(r => {
      if(r.hasAttribute(MARK)) return;
      if(r.children.length < heads.length){ r.setAttribute(MARK,'1'); return; } // صف "مفيش نتايج"
      const d = {
        serial: cellVal(r, heads, 'السيريال'),
        name:   cellVal(r, heads, 'العميل'),
        phone:  cellVal(r, heads, 'الموبايل'),
        city:   cellVal(r, heads, 'المدينة'),
        brand:  cellVal(r, heads, 'البراند'),
        price:  cellVal(r, heads, 'القيمة'),
        status: cellVal(r, heads, 'الحالة'),
      };
      const td = document.createElement('td');
      const phone = waPhone(d.phone);
      if(phone){
        const a = document.createElement('a');
        a.href = 'https://web.whatsapp.com/send?phone=' + phone + '&text=' + encodeURIComponent(buildMessage(d));
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = '💬 واتساب';
        a.style.cssText = 'display:inline-block;background:#25D366;color:#fff;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap';
        td.appendChild(a);
      }else{
        td.innerHTML = '<span style="color:var(--muted);font-size:12px">مفيش رقم</span>';
      }
      r.appendChild(td);
      r.setAttribute(MARK,'1');
    });
  }

  // (2) كروت المتابعة (Hold / Undelivered) بقت جزء من قسم QP نفسه — مفيش حقن هنا

  function run(){ try{ injectButtons(); }catch(e){} }

  // نعيد الحقن بعد أي إعادة رسم للصفحة
  let scheduled = false;
  const schedule = () => { if(scheduled) return; scheduled = true; setTimeout(() => { scheduled = false; run(); }, 60); };
  function start(){
    const main = document.getElementById('main');
    if(main) new MutationObserver(schedule).observe(main, { childList:true, subtree:true });
    schedule();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
<script>
/* ===== 📤 تصدير أوردرات المتابعة (Hold / Un) لجوجل شيت ===== */
const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzsO2TcA4PQQTV1ON9NIPcvleSQ0XXrMoOLPtBFfuz8yzXzqjabXgiKAKIGkt4Wwq1F/exec';

// نوع التصدير حسب الحالة المفتوحة في الجدول — التاب في الشيت بتخلص بالكلمة دي
const EXPORT_TYPES = [
  { type: 'hold', re: /Hold/ },
  { type: 'un',   re: /راجع للفرع|Undelivered/ },
];

function addExportBtn() {
  if (!location.hash.includes('qp')) return;
  if (document.getElementById('holdExportBtn')) return;
  const title = [...document.querySelectorAll('#main .card h3')].find(el => el.textContent.trim().startsWith('الأوردرات'));
  if (!title) return;
  const t = EXPORT_TYPES.find(x => x.re.test(title.textContent));
  if (!t) return;

  const btn = document.createElement('button');
  btn.id = 'holdExportBtn';
  btn.dataset.type = t.type;
  btn.innerHTML = '📤 تصدير لجوجل شيت';
  btn.style.cssText = 'background:#2e7d32;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;margin-inline-start:12px;vertical-align:middle';
  btn.onclick = () => exportToSheet(btn);
  title.appendChild(btn);
}

let _exportTimer;
new MutationObserver(() => {
  clearTimeout(_exportTimer);
  _exportTimer = setTimeout(addExportBtn, 200);
}).observe(document.body, { childList: true, subtree: true });
window.addEventListener('hashchange', () => setTimeout(addExportBtn, 300));
setTimeout(addExportBtn, 500);

async function exportToSheet(btn) {
  const type = btn.dataset.type || 'hold';
  const table = [...document.querySelectorAll('table')]
    .find(t => t.innerText.includes('السيريال') && t.innerText.includes('واتساب'));
  if (!table) return alert('مش لاقي جدول الأوردرات');

  const clean = s => {
    let v = s.trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    if (/^[\d.,٬]+$/.test(v)) v = v.replace(/[,٬]/g, '');
    return v;
  };

  const allRows = [...table.querySelectorAll('tr')];
  const headRow = allRows.find(tr => tr.innerText.includes('السيريال'));
  if (!headRow) return alert('مش لاقي صف العناوين');

  const headCells = [...headRow.children].map(c => c.innerText.trim());
  const keep = headCells.map((h, i) => i).filter(i => headCells[i] && headCells[i] !== 'واتساب');
  const headers = keep.map(i => headCells[i]);

  const rows = allRows
    .filter(tr => tr !== headRow && tr.offsetParent !== null && tr.querySelector('td'))
    .map(tr => {
      const cells = [...tr.children];
      return keep.map(i => clean(cells[i] ? cells[i].innerText : ''));
    })
    .filter(r => r[0] && /\d/.test(r[0]));

  if (!rows.length) return alert('مفيش أوردرات للتصدير');

  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '⏳ جاري التصدير...';
  try {
    const res = await fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type, headers, rows })
    });
    const r = await res.json();
    if (r.error) return alert('❌ خطأ من الشيت: ' + r.error);
    alert(`✅ اتضاف ${r.added} أوردر في تاب "${r.sheet}"` +
      (r.dups ? `\n🟧 منهم ${r.dups} متكرر في تابات قبل كده` : '') +
      (r.skipped ? `\n(${r.skipped} كانوا موجودين في نفس التاب)` : ''));
  } catch (e) {
    alert('❌ حصل خطأ في التصدير: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = old;
  }
}
</script>

        </div></div>`).join('')}
        <div class="adm-grp"><div class="adm-checks">
          <label><input type="checkbox" data-admin ${u.is_admin ? 'checked' : ''} ${self ? 'disabled' : ''}> 👑 أدمن (يشوف كل حاجة ويتحكم في الحسابات)</label>
        </div></div>
        <div class="adm-actions">
          <button type="button" data-act="all">تحديد الكل</button>
          <button type="button" data-act="none">شيل الكل</button>
          <button type="button" class="save" data-act="save">💾 حفظ</button>
          <span class="adm-st"></span>
        </div>
      </div>
    </details>`;
  }

  function wireAdmin(list){
    list.querySelectorAll('.adm-user').forEach(card => {
      const id = card.dataset.id;
      const st = card.querySelector('.adm-st');
      card.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
        const boxes = card.querySelectorAll('input[data-sec]');
        if(b.dataset.act === 'all'){ boxes.forEach(x => x.checked = true); return; }
        if(b.dataset.act === 'none'){ boxes.forEach(x => x.checked = false); return; }
        const allowed = [...boxes].filter(x => x.checked).map(x => x.dataset.sec);
        const adminBox = card.querySelector('input[data-admin]');
        const patch = { allowed_sections: allowed };
        if(!adminBox.disabled) patch.is_admin = adminBox.checked;
        b.disabled = true; st.textContent = '⏳ بيحفظ...';
        const { data, error } = await sb.from('profiles').update(patch).eq('id', id).select('id');
        b.disabled = false;
        if(error) st.textContent = '❌ ' + error.message;
        else if(!data || !data.length) st.textContent = '❌ الحفظ اترفض — اتأكد إنك شغّلت كود الـ SQL وإن حسابك أدمن.';
        else {
          st.textContent = '✅ اتحفظ — هيسري لما صاحب الحساب يعمل تحديث للصفحة';
          const u = admUsers.find(x => x.id === id);
          if(u){ u.allowed_sections = allowed; if('is_admin' in patch) u.is_admin = patch.is_admin; }
          const badge = card.querySelector('.adm-badge');
          if(badge){
            const isAdm = 'is_admin' in patch ? patch.is_admin : (u && u.is_admin);
            badge.className = 'adm-badge' + (isAdm ? ' admin' : !allowed.length ? ' new' : '');
            badge.textContent = isAdm ? 'أدمن — بيشوف كله' : !allowed.length ? 'جديد — مستني صلاحيات' : allowed.length + ' قسم';
          }
        }
      });
    });
  }

  /* ---------- 📋 زرار "الأقسام": ليستة بالأقسام المتاحة للمستخدم ---------- */
  const hrefOf = s => s.key.startsWith('dept:') ? '#/dept/' + s.key.slice(5) : '#/' + s.routes[0];
  function mySections(){
    const groups = GROUPS().map(g => ({ title:g.title, items:g.items.filter(s => canSee(hrefOf(s))).map(s => ({ label:s.label, href:hrefOf(s) })) }))
      .filter(g => g.items.length);
    if(me && me.is_admin) groups.push({ title:'الإدارة', items:[{ label:'⚙️ الحسابات والصلاحيات', href:'#/admin' }] });
    return groups;
  }
  function onMenuKey(e){ if(e.key === 'Escape') closeMyMenu(); }
  function closeMyMenu(){
    const m = document.getElementById('myMenu'); if(m) m.remove();
    document.removeEventListener('keydown', onMenuKey);
  }
  function openMyMenu(){
    if(!me) return;
    closeMyMenu();
    const groups = mySections();
    const count = groups.reduce((s, g) => s + g.items.length, 0);
    const cur = location.hash || '#/home';
    const bg = document.createElement('div');
    bg.id = 'myMenu'; bg.className = 'mm-bg';
    bg.innerHTML = `<div class="mm-box" role="dialog" aria-modal="true" aria-labelledby="mmTitle">
      <div class="mm-head"><h2 id="mmTitle">📋 الأقسام</h2><button type="button" class="mm-x" aria-label="إغلاق">✕</button></div>
      <div class="mm-sub">${count} قسم — اختار القسم للانتقال إليه.</div>
      ${count > 6 ? '<input type="search" class="mm-q" placeholder="🔍 بحث عن قسم..." aria-label="بحث عن قسم">' : ''}
      <div class="mm-list">${count ? groups.map(g => `<div class="mm-grp"><h4>${esc(g.title)}</h4><div class="mm-items">
        ${g.items.map(i => `<a class="mm-item ${cur === i.href || cur.startsWith(i.href + '/') ? 'on' : ''}" href="${i.href}" data-t="${esc(i.label)}">${esc(i.label)}</a>`).join('')}
      </div></div>`).join('') : '<div class="mm-empty">لا توجد أقسام متاحة حاليًا. برجاء التواصل مع الأدمن.</div>'}</div>
    </div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if(e.target === bg) closeMyMenu(); };
    bg.querySelector('.mm-x').onclick = closeMyMenu;
    bg.querySelectorAll('.mm-item').forEach(a => a.onclick = closeMyMenu);
    const q = bg.querySelector('.mm-q');
    if(q){
      q.oninput = () => {
        const t = q.value.trim().toLowerCase();
        bg.querySelectorAll('.mm-grp').forEach(g => {
          let any = false;
          g.querySelectorAll('.mm-item').forEach(a => { const ok = !t || a.dataset.t.toLowerCase().includes(t); a.style.display = ok ? '' : 'none'; if(ok) any = true; });
          g.style.display = any ? '' : 'none';
        });
      };
      q.focus();
    } else { const f = bg.querySelector('.mm-item'); if(f) f.focus(); }
    document.addEventListener('keydown', onMenuKey);
  }
  function addMyMenuBtn(){
    if(!me) return;
    if(!document.getElementById('myMenuBtn')){
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'myMenuBtn'; b.innerHTML = '📋 الأقسام';
      b.setAttribute('aria-label', 'الأقسام');
      b.onclick = openMyMenu;
      document.body.appendChild(b);
    }
    const box = document.getElementById('userbox');
    if(box && !box.querySelector('.mm-side')){
      const s = document.createElement('button');
      s.type = 'button'; s.className = 'mm-side'; s.textContent = '📋 الأقسام';
      s.onclick = openMyMenu;
      box.appendChild(s);
    }
  }
  window.addEventListener('hashchange', closeMyMenu);

  /* ---------- الربط بالراوتر ---------- */
  // capture: بيشتغل قبل الراوتر الأصلي، فالصفحة الممنوعة ماتترسمش أصلاً
  window.addEventListener('hashchange', e => {
    if(!ready){ e.stopImmediatePropagation(); return; }
    if(!canSee(location.hash)){
      e.stopImmediatePropagation();
      const t = firstAllowed();
      if(t) location.replace(t); else showWaiting();
    }
  }, true);
  window.addEventListener('hashchange', () => { if(ready) afterRender(); });

  const _render = render;
  render = function(){
    if(ready && !canSee(location.hash)){ const t = firstAllowed(); if(t){ location.replace(t); return; } }
    _render.apply(this, arguments);
    if(ready) afterRender();
  };

  /* ---------- التشغيل ---------- */
  async function boot(){
    if(!sb){ gate('<div class="ag-msg">مكتبة الدخول ماتحمّلتش. اتأكد إن فيه إنترنت وحدّث الصفحة.</div>'); return; }
    gate('<div class="ag-sub">⏳ بيتحقق من الدخول...</div>');
    const { data: { session } } = await sb.auth.getSession();
    if(!session) return showLogin('login');

    let { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if(error){ gate(`<div class="ag-msg">مقدرناش نقرا بيانات حسابك: ${esc(error.message)}</div><button class="ag-btn ghost" onclick="AuthGate.logout()">خروج</button>`); return; }
    if(!prof){
      const username = session.user.email.split('@')[0];
      await sb.from('profiles').upsert({ id: session.user.id, username });
      ({ data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
      prof = prof || { id: session.user.id, username, allowed_sections: [], is_admin: false };
    }
    if(!('allowed_sections' in prof)){
      gate('<div class="ag-msg">نظام الصلاحيات لسه مش متفعّل في قاعدة البيانات — لازم كود الـ SQL يتشغّل في Supabase الأول.</div><button class="ag-btn ghost" onclick="AuthGate.logout()">خروج</button>');
      return;
    }
    me = { ...prof, allowed_sections: prof.allowed_sections || [] };
    ready = true;

    if(!canSee(location.hash)){
      const t = firstAllowed();
      if(!t) return showWaiting();
      location.replace(t);
    }
    document.documentElement.classList.add('auth-ok');
    hideGate();
    afterRender();
    addMyMenuBtn();

    let tm;
    const bar = document.getElementById('sidebar');
    if(bar) new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(filterSidebar, 50); }).observe(bar, { childList:true, subtree:true });
  }
  boot();
})();
</script>

<script>
/* =====================================================================
   🏬 المخزن — أصناف / إدخال / إخراج / جرد / سجل حركات (Supabase)
   بيحل مكان صفحة القسم #/dept/warehouse
   ===================================================================== */
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtN = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { const x = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const where = () => { const [r, p] = (location.hash.replace('#/', '') || 'home').split('/'); return { r, p }; };
  const isInv = () => { const w = where(); return w.r === 'dept' && w.p === 'warehouse'; };
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';

  const TABS = [
    ['stock', '📦 المخزون'], ['in', '➕ إدخال'], ['out', '➖ إخراج'],
    ['count', '📋 جرد'], ['moves', '🕘 الحركات'], ['day', '🗓️ ملخص اليوم'], ['buy', '📊 المشتريات'], ['items', '🏷️ الأصناف']
  ];
  const KIND = { in: ['إدخال', 'in'], out: ['إخراج', 'out'], adjust: ['تسوية جرد', 'adj'] };
  const SRC = { purchase:'🛒 مشتريات من مورد', return:'↩️ مرتجع من عميل', other:'📥 إدخال تاني' };
  const moveLabel = m => m.kind !== 'in' ? (KIND[m.kind] || [m.kind])[0]
    : m.source === 'purchase' ? 'مشتريات' : m.source === 'return' ? 'مرتجع' : m.source === 'opening' ? 'رصيد أول المدة' : 'إدخال';
  const isPurchase = m => m.kind === 'in' && (m.source === 'purchase' || (!m.source && m.note !== 'رصيد أول المدة'));
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  // 🔍 بحث الأصناف في الإدخال والإخراج:
  // بيوحّد أ/إ/آ = ا ، ة = ه ، ى = ي ، والأرقام العربي = إنجليزي، وبيدوّر بأكتر من كلمة
  const SEARCH_PH = '🔍 سيرش بار اهو عشان منعدش ندور كتير';
  const normQ = s => String(s ?? '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\s+/g, ' ').trim();
  let ddOpen = null, ddQ = ''; // رقم السطر اللي قايمته مفتوحة + كلام السيرش
  function matchItems(q){
    const words = normQ(q).split(' ').filter(Boolean);
    if(!words.length) return active();
    return active().filter(i => {
      const t = normQ([i.name, i.sku, i.category].filter(Boolean).join(' '));
      return words.every(w => t.includes(w));
    });
  }

  let S = { tab:'stock', items:null, moves:null, loading:false, busy:false, err:'', msg:'', q:'', mq:'',
            lines:[{ item:'', qty:'' }], note:'', countNote:'', count:{}, editing:null,
            showLow:false, req:{}, src:'purchase', resetMode:'moves', resetTxt:'',
            day: ymd(new Date()), dayData:null, dayLoading:false, dayErr:'', dayNote:'',
            buy:null, buyLoading:false, buyErr:'', buyFrom: ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), buyTo: ymd(new Date()), target:(() => { try{ return Number(localStorage.getItem('inv_target')) || 300; }catch(e){ return 300; } })() };

  const active = () => (S.items || []).filter(i => i.active !== false);
  const itemById = id => (S.items || []).find(i => String(i.id) === String(id));
  function status(i){
    const q = Number(i.qty || 0), m = Number(i.min_qty || 0);
    if(q <= 0) return ['خلص', 'out'];
    if(m > 0 && q <= m) return ['قليل', 'low'];
    return ['متاح', 'ok'];
  }

  /* ---------- البيانات ---------- */
  async function load(){
    if(!sb()) return;
    S.loading = true; S.err = ''; draw();
    const [a, b] = await Promise.all([
      sb().from('inv_stock').select('*').order('name'),
      sb().from('inv_moves').select('*, inv_items(name, unit)').order('created_at', { ascending:false }).limit(500)
    ]);
    S.loading = false;
    const e = a.error || b.error;
    if(e){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(e.message)
        ? 'جداول المخزن لسه مش موجودة في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب بيانات المخزن: ' + e.message;
    } else { S.items = a.data || []; S.moves = b.data || []; S.dayData = null; if(S.tab === 'day') setTimeout(loadDay, 0); }
    draw();
  }

  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); window.scrollTo({ top:0, behavior:'smooth' }); }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isInv()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function view(){
    const tabs = me().is_admin ? [...TABS, ['admin', '🧹 تصفير ونسخة احتياطية']] : TABS;
    if(S.tab === 'admin' && !me().is_admin) S.tab = 'stock';
    let h = `<div class="pagehead"><h1>🏬 المخزن</h1><p>إدخال وإخراج الأصناف، والمخزون الحالي، والجرد — كله متسجل باسم اللي عمله.</p></div>
      <div class="inv-tabs">${tabs.map(([k, l]) => `<button class="inv-tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}
        <button class="inv-btn" data-act="reload" style="margin-inline-start:auto">🔄 تحديث</button></div>`;
    if(S.msg) h += `<div class="inv-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;
    if(S.err) return h + `<div class="inv-msg err">${esc(S.err)}</div>`;
    if(S.items === null) return h + `<div class="card"><p class="none">⏳ بيحمّل المخزن...</p></div>`;
    if(!S.items.length && S.tab !== 'items' && S.tab !== 'admin')
      return h + `<div class="card"><p class="none" style="margin-bottom:10px">لسه مفيش أصناف. ابدأ بإضافة الأصناف ورصيدها الحالي.</p><button class="inv-btn pri" data-tab="items">🏷️ ضيف أول صنف</button></div>`;
    return h + ({ stock:vStock, in:() => vMove('in'), out:() => vMove('out'), count:vCount, moves:vMoves, day:vDay, buy:vBuy, items:vItems, admin:vAdmin }[S.tab])();
  }

  function vStock(){
    const q = S.q.trim().toLowerCase();
    const list = active().filter(i => !q || [i.name, i.sku, i.category].some(v => String(v || '').toLowerCase().includes(q)));
    const all = active();
    const low = all.filter(i => status(i)[1] !== 'ok').length;
    const pcs = all.reduce((s, i) => s + Number(i.qty || 0), 0);
    const val = all.reduce((s, i) => s + Number(i.qty || 0) * Number(i.cost || 0), 0);
    return `<div class="inv-kpis">
        <div class="inv-kpi"><div class="n">${fmtN(all.length)}</div><div class="l">عدد الأصناف</div></div>
        <div class="inv-kpi"><div class="n">${fmtN(pcs)}</div><div class="l">إجمالي القطع في المخزن</div></div>
        <div class="inv-kpi ${low ? 'warn' : ''}" data-act="low" style="cursor:pointer;${S.showLow ? 'border-color:var(--brass);border-width:2px' : ''}"><div class="n">${fmtN(low)}</div><div class="l">⚠️ أصناف خلصت أو قربت تخلص · ${S.showLow ? 'دوس تقفل' : 'دوس تشوفهم'}</div></div>
        ${val ? `<div class="inv-kpi"><div class="n">${fmtN(Math.round(val))} ج</div><div class="l">قيمة المخزون (بسعر التكلفة)</div></div>` : ''}
      </div>
      ${S.showLow ? vLow() : ''}
      <div class="card">

  /* ---------- 📊 تقرير المشتريات ---------- */
  function setRange(k){
    const t = new Date(), y = t.getFullYear(), mo = t.getMonth();
    const map = {
      month: [new Date(y, mo, 1), t],
      last:  [new Date(y, mo - 1, 1), new Date(y, mo, 0)],
      d30:   [new Date(t.getTime() - 29 * 864e5), t],

  async function loadBuy(){
    if(!S.buyFrom || !S.buyTo) return;
    if(S.buyFrom > S.buyTo){ S.buyErr = 'تاريخ "من" لازم يكون قبل "إلى".'; draw(); return; }
    S.buyLoading = true; S.buyErr = ''; draw();
    const { data, error } = await sb().from('inv_moves')
      .select('*, inv_items(name, sku, category, unit, cost)')
      .eq('kind', 'in')
      .gte('created_at', new Date(S.buyFrom + 'T00:00:00').toISOString())
      .lte('created_at', new Date(S.buyTo + 'T23:59:59').toISOString())
      .order('created_at', { ascending:false }).limit(10000);
    S.buyLoading = false;
    if(error){ S.buyErr = 'مقدرناش نجيب المشتريات: ' + error.message; S.buy = []; }
    else S.buy = (data || []).filter(isPurchase);
    draw();
  }
  function buyCalc(){
    const g = {}; let qty = 0, cost = 0, missing = 0, est = 0;
    (S.buy || []).forEach(m => {
      const it = m.inv_items || {};
      const uc = m.unit_cost != null ? Number(m.unit_cost) : (it.cost != null ? Number(it.cost) : null);
      if(m.unit_cost == null && uc != null) est++;
      const r = g[m.item_id] = g[m.item_id] || { name: it.name || '—', sku: it.sku, cat: it.category, unit: it.unit, qty: 0, costed: 0, cost: 0, times: 0, missing: 0 };
      r.qty += Number(m.qty); r.times++; qty += Number(m.qty);
      if(uc == null){ r.missing++; missing++; }
      else { r.cost += uc * Number(m.qty); r.costed += Number(m.qty); cost += uc * Number(m.qty); }
    });
    const rows = Object.values(g).sort((a, b) => b.cost - a.cost || b.qty - a.qty);
    return { rows, qty, cost, missing, est, count: (S.buy || []).length };

    ['return',   '↩️ مرتجعات من عملاء',        true],
    ['otherIn',  '📥 إدخال تاني / رصيد أول المدة', false],
    ['out',      '➖ إخراج',                   true],
    ['adjust',   '📋 تسوية جرد',               false],
  ];

  async function loadDay(){
    if(!S.day || S.items === null || !sb()) return;
    S.dayLoading = true; S.dayErr = ''; draw();
    const start = new Date(S.day + 'T00:00:00'), endT = new Date(S.day + 'T23:59:59.999').getTime();
    // بنجيب حركات اليوم وكل اللي بعده عشان نرجّع الرصيد لأول وآخر اليوم
    const { data, error } = await sb().from('inv_moves')
      .select('*, inv_items(name, unit, cost)')
      .gte('created_at', start.toISOString())
      .order('created_at', { ascending:true }).limit(20000);
    S.dayLoading = false;
    if(error){ S.dayErr = 'مقدرناش نجيب حركات اليوم: ' + error.message; S.dayData = null; draw(); return; }
    const dayMoves = [], after = [];
    (data || []).forEach(m => (new Date(m.created_at).getTime() <= endT ? dayMoves : after).push(m));
    S.dayData = calcDay(dayMoves, after);
    draw();
  }

  function calcDay(dayMoves, after){
    const sumBy = list => { const o = {}; list.forEach(m => o[m.item_id] = (o[m.item_id] || 0) + Number(m.qty)); return o; };
    const aft = sumBy(after), dd = sumBy(dayMoves);
    let vB = 0, vA = 0, pB = 0, pA = 0, noCost = 0;
    (S.items || []).forEach(i => {
      const qA = Number(i.qty || 0) - (aft[i.id] || 0); // الرصيد آخر اليوم
      const qB = qA - (dd[i.id] || 0);                   // الرصيد أول اليوم
      pA += qA; pB += qB;
      if(i.cost != null && i.cost !== ''){ vA += qA * Number(i.cost); vB += qB * Number(i.cost); }
      else if(qA || qB) noCost++;
    });
    const groups = { purchase:[], return:[], otherIn:[], out:[], adjust:[] };
    dayMoves.forEach(m => {
      const g = m.kind === 'out' ? 'out' : m.kind === 'adjust' ? 'adjust'
        : m.source === 'return' ? 'return' : isPurchase(m) ? 'purchase' : 'otherIn';
      groups[g].push(m);
    });
    const agg = list => {
      const o = {};
      list.forEach(m => {
        const it = m.inv_items || itemById(m.item_id) || {};
        const r = o[m.item_id] = o[m.item_id] || { name: it.name || '—', unit: it.unit || '', qty: 0, value: 0, notes: [] };
        r.qty += Number(m.qty);
        const uc = m.unit_cost != null ? Number(m.unit_cost) : (it.cost != null ? Number(it.cost) : 0);
        r.value += Math.abs(Number(m.qty)) * uc;
        if(m.note && !r.notes.includes(m.note)) r.notes.push(m.note);
      });
      const rows = Object.values(o).sort((a, b) => Math.abs(b.qty) - Math.abs(a.qty));
      return { rows, qty: rows.reduce((s, r) => s + r.qty, 0), value: rows.reduce((s, r) => s + r.value, 0), n: list.length };
    };
    const G = {}; Object.keys(groups).forEach(k => G[k] = agg(groups[k]));
    const people = [...new Set(dayMoves.map(m => m.created_by_name).filter(Boolean))];
    return { day: S.day, G, count: dayMoves.length, vB, vA, pB, pA, noCost, people };
  }

  // بيجيب كل الصفوف على دفعات (Supabase بيرجّع 1000 بالكتير في المرة)
  async function fetchAll(table, select, order){
    const out = [];
    for(let from = 0; ; from += 1000){
      const { data, error } = await sb().from(table).select(select)
        .order(order, { ascending:true }).range(from, from + 999);
      if(error) throw new Error(error.message);
      out.push(...(data || []));
      if(!data || data.length < 1000) break;
    }
    return out;
  }

  async function downloadBackup(){
    if(!window.XLSX) throw new Error('مكتبة الإكسل ماتحمّلتش — حدّث الصفحة.');
    const [items, moves] = await Promise.all([
      fetchAll('inv_stock', '*', 'name'),
      fetchAll('inv_moves', '*, inv_items(name, sku, unit)', 'created_at')
    ]);
    const sheet = rows => XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'ملاحظة': 'مفيش بيانات' }]);
    const wb = XLSX.utils.book_new();

    // 1) المخزون الحالي
    XLSX.utils.book_append_sheet(wb, sheet(items.filter(i => i.active !== false).map(i => ({
      'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الكمية': Number(i.qty || 0),
      'الوحدة': i.unit || '', 'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '',
      'قيمة المخزون': i.cost != null ? Number(i.qty || 0) * Number(i.cost) : '', 'الحالة': status(i)[0] }))), 'المخزون الحالي');

    // 2) كل الأصناف (حتى المتوقفة)
    XLSX.utils.book_append_sheet(wb, sheet(items.map(i => ({
      'رقم الصنف': i.id, 'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الوحدة': i.unit || '',
      'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '', 'الكمية': Number(i.qty || 0),
      'نشط': i.active === false ? 'متوقف' : 'نشط' }))), 'كل الأصناف');

    // 3) ملخص كل صنف من الحركات
    const sm = {};
    moves.forEach(m => {
      const it = m.inv_items || {};
      const r = sm[m.item_id] = sm[m.item_id] || { 'الصنف': it.name || '—', 'الكود': it.sku || '', 'رصيد أول المدة': 0,
        'مشتريات': 0, 'مرتجعات': 0, 'إدخال تاني': 0, 'إخراج': 0, 'تسويات جرد': 0, 'تكلفة المشتريات': 0, 'الرصيد': 0 };
      const q = Number(m.qty);
      r['الرصيد'] += q;
      if(m.kind === 'out') r['إخراج'] += Math.abs(q);
      else if(m.kind === 'adjust') r['تسويات جرد'] += q;
      else if(m.source === 'opening' || m.note === 'رصيد أول المدة') r['رصيد أول المدة'] += q;
      else if(m.source === 'return') r['مرتجعات'] += q;
      else if(isPurchase(m)){ r['مشتريات'] += q; if(m.unit_cost != null) r['تكلفة المشتريات'] += q * Number(m.unit_cost); }
      else r['إدخال تاني'] += q;
    });
    XLSX.utils.book_append_sheet(wb, sheet(Object.values(sm)), 'ملخص كل صنف');

    // 4) كل الحركات من أول يوم
    XLSX.utils.book_append_sheet(wb, sheet(moves.map(m => {
      const it = m.inv_items || {}, d = new Date(m.created_at);
      return { 'التاريخ': ymd(d), 'الوقت': d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }),
        'الصنف': it.name || '', 'الكود': it.sku || '', 'النوع': moveLabel(m), 'الكمية': Number(m.qty), 'الوحدة': it.unit || '',
        'سعر القطعة': m.unit_cost ?? '', 'الإجمالي': m.unit_cost != null ? Math.abs(Number(m.qty)) * Number(m.unit_cost) : '',
        'ملاحظة': m.note || '', 'بواسطة': m.created_by_name || '' };
    })), 'كل الحركات');

    const now = new Date();
    XLSX.writeFile(wb, `نسخة المخزن الكاملة ${ymd(now)} ${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}.xlsx`);
    return { items: items.length, moves: moves.length };
  }

    const all = S.resetMode === 'all';
    if(!confirm(all ? 'متأكد؟ هتتمسح كل الأصناف وكل الحركات نهائيًا.' : 'متأكد؟ هتتمسح كل الحركات والأرصدة هترجع صفر.')) return;
    S.busy = true; S.msg = '⏳ بينزّل نسخة احتياطية الأول...'; S.msgErr = false; draw();
    try{ await downloadBackup(); }
    catch(e){ S.busy = false; return flash('❌ النسخة الاحتياطية فشلت، فماتمسحش حاجة: ' + e.message, true); }
    S.msg = '⏳ بيصفّر المخزن...'; draw();
    const { error } = await sb().rpc('inv_reset', { keep_items: !all });
    S.busy = false;
    if(error) return flash(/admins only/i.test(error.message) ? '❌ التصفير للأدمن بس.'
      : /inv_reset|function|schema cache/i.test(error.message) ? '❌ لازم كود الـ SQL بتاع التصفير يتشغّل في Supabase الأول.'
      : '❌ مقدرناش نصفّر: ' + error.message, true);
    S.resetTxt = ''; S.buy = null; S.dayData = null; S.count = {}; S.req = {}; S.lines = [{ item:'', qty:'' }]; S.note = '';
    S.tab = all ? 'items' : 'stock';

    S.msgErr = false;

  }

  function wire(root){
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.msg = ''; S.editing = null; S.draft = null; draw(); if(S.tab === 'buy' && S.buy === null && !S.buyLoading) loadBuy(); if(S.tab === 'day' && !S.dayData && !S.dayLoading) loadDay(); });
    root.querySelectorAll('[data-act=reload]').forEach(b => b.onclick = () => { S.msg = ''; load(); });
    root.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
      S.tab = b.dataset.quick; S.lines = [{ item:b.dataset.id, qty:'' }]; S.note = ''; S.msg = ''; draw();
      const q = document.getElementById('invQty0'); if(q) q.focus();
    });
    const q = root.querySelector('#invQ'); if(q) q.oninput = () => { S.q = q.value; draw(); };
    const mq = root.querySelector('#invMQ'); if(mq) mq.oninput = () => { S.mq = mq.value; draw(); };

    // 🔽 فتح/قفل قايمة الصنف — أول ما تفتح المؤشر بيقف في السيرش بار
    root.querySelectorAll('[data-dd]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.dd;
      ddOpen = ddOpen === idx ? null : idx; ddQ = '';
      draw();
      const s = document.getElementById('invS' + idx); if(s) s.focus();
    });
    const pick = (idx, id) => {
      S.lines[idx].item = String(id); ddOpen = null; ddQ = '';
      draw();
      const qn = document.getElementById('invQty' + idx); if(qn) qn.focus();
    };
    root.querySelectorAll('[data-search]').forEach(el => {
      const idx = +el.dataset.search;
      const wirePicks = () => document.querySelectorAll('#invL' + idx + ' [data-pick]').forEach(o => o.onclick = () => pick(idx, o.dataset.pick));
      wirePicks();
      el.oninput = () => {
        ddQ = el.value;
        const list = document.getElementById('invL' + idx);
        if(list){ list.innerHTML = ddListHtml(S.lines[idx].item, ddQ); wirePicks(); }
      };
      el.onkeydown = e => {
        if(e.key === 'Escape'){ ddOpen = null; ddQ = ''; draw(); return; }
        if(e.key !== 'Enter') return;
        e.preventDefault();
        const hits = matchItems(ddQ);
        if(hits.length) pick(idx, hits[0].id);
      };
    });

    root.querySelectorAll('[data-line]').forEach(el => {
      const upd = () => { S.lines[+el.dataset.line][el.dataset.f] = el.value; };
      el.oninput = () => { upd(); const av = document.getElementById('invAv' + el.dataset.line);
        if(av) av.innerHTML = availHtml(S.lines[+el.dataset.line], S.tab === 'in' && S.src === 'purchase'); };
      if(el.tagName === 'SELECT') el.onchange = () => { upd(); draw(); };
    });
    root.querySelectorAll('[data-del-line]').forEach(b => b.onclick = () => { S.lines.splice(+b.dataset.delLine, 1); ddOpen = null; draw(); });
    const add = root.querySelector('[data-act=addline]'); if(add) add.onclick = () => {
      S.lines.push({ item:'', qty:'' }); ddOpen = null; draw();
    };
    const note = root.querySelector('#invNote'); if(note) note.oninput = () => { S.note = note.value; };
    root.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { S.src = b.dataset.src; draw(); });
    const bf = root.querySelector('#buyFrom'); if(bf) bf.onchange = () => { S.buyFrom = bf.value; };
    const bt = root.querySelector('#buyTo'); if(bt) bt.onchange = () => { S.buyTo = bt.value; };
    const bg = root.querySelector('[data-act=buy-go]'); if(bg) bg.onclick = loadBuy;
    root.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { setRange(b.dataset.range); loadBuy(); });
    const bx = root.querySelector('[data-act=buy-xlsx]'); if(bx) bx.onclick = exportBuy;
    const bp = root.querySelector('[data-act=buy-print]'); if(bp) bp.onclick = printBuy;
    const sm = root.querySelector('[data-act=save-move]'); if(sm) sm.onclick = () => saveMove(sm.dataset.kind);

    root.querySelectorAll('[data-count]').forEach(el => el.oninput = () => {
      S.count[el.dataset.count] = el.value;
      const it = itemById(el.dataset.count), cell = root.querySelector(`[data-diff="${el.dataset.count}"]`);
      const n = toNum(el.value);
      if(cell){
        if(el.value === '' || n === null){ cell.textContent = ''; cell.className = 'inv-diff'; }
        else { const d = n - Number(it.qty || 0); cell.textContent = d === 0 ? '✓' : (d > 0 ? '+' : '') + fmtN(d); cell.className = 'inv-diff ' + (d > 0 ? 'plus' : d < 0 ? 'minus' : ''); }
      }
    });
    const cn = root.querySelector('#invCNote'); if(cn) cn.oninput = () => { S.countNote = cn.value; };
    const sc = root.querySelector('[data-act=save-count]'); if(sc) sc.onclick = saveCount;

    root.querySelectorAll('[data-del-move]').forEach(b => b.onclick = () => delMove(b.dataset.delMove));
    const si = root.querySelector('[data-act=save-item]'); if(si) si.onclick = saveItem;
    const ce = root.querySelector('[data-act=cancel-edit]'); if(ce) ce.onclick = () => { S.editing = null; S.draft = null; draw(); };
    root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editing = b.dataset.edit; S.draft = null; S.msg = ''; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleItem(b.dataset.toggle));
    const x = root.querySelector('[data-act=xlsx]'); if(x) x.onclick = exportXlsx;
    const lk = root.querySelector('[data-act=low]'); if(lk) lk.onclick = () => {
      S.showLow = !S.showLow; draw();
      if(S.showLow){ const c = document.getElementById('invLow'); if(c) c.scrollIntoView({ behavior:'smooth', block:'start' }); }
    };
    const tg = root.querySelector('#invTarget'); if(tg) tg.onchange = () => {
      const n = toNum(tg.value); if(!n || n <= 0) return;
      S.target = n; S.req = {}; try{ localStorage.setItem('inv_target', n); }catch(e){} draw();
    };
    root.querySelectorAll('[data-req]').forEach(el => el.oninput = () => {
      S.req[el.dataset.req] = el.value;
      const t = document.getElementById('invLowTotal'); if(t) t.textContent = fmtN(lowRows().reduce((a, r) => a + r.need, 0));
    });
    const pr = root.querySelector('[data-act=print-low]'); if(pr) pr.onclick = printShortage;

    // 🧹 تصفير + ⬇️ نسخة كاملة
    const bk = root.querySelector('[data-act=backup]'); if(bk) bk.onclick = async () => {
      S.busy = true; draw();
      try{ const r = await downloadBackup(); S.busy = false; flash(`✅ اتنزّل الشيت: ${fmtN(r.items)} صنف و ${fmtN(r.moves)} حركة.`); }
      catch(e){ S.busy = false; flash('❌ مقدرناش ننزّل الشيت: ' + e.message, true); }
    };
    root.querySelectorAll('[data-rmode]').forEach(b => b.onclick = () => { S.resetMode = b.dataset.rmode; draw(); });
    const rt = root.querySelector('#invResetTxt'); if(rt) rt.oninput = () => {
      S.resetTxt = rt.value;
      const b = document.getElementById('invResetBtn'); if(b) b.disabled = S.busy || rt.value.trim() !== RESET_WORD;
    };
    const rb = root.querySelector('#invResetBtn'); if(rb) rb.onclick = resetInv;

    // 🗓️ ملخص اليوم
    const dpk = root.querySelector('#dayPick'); if(dpk) dpk.onchange = () => { if(!dpk.value) return; S.day = dpk.value; S.dayData = null; loadDay(); };
    root.querySelectorAll('[data-dayq]').forEach(b => b.onclick = () => { S.day = b.dataset.dayq; S.dayData = null; loadDay(); });
    const dg = root.querySelector('[data-act=day-go]'); if(dg) dg.onclick = () => { S.dayData = null; loadDay(); };
    const dw = root.querySelector('[data-act=day-wa]'); if(dw) dw.onclick = sendDay;
    const dn = root.querySelector('#dayNote'); if(dn) dn.oninput = () => { S.dayNote = dn.value; };
    const ts = root.querySelector('[data-act=today-sum]'); if(ts) ts.onclick = () => { S.tab = 'day'; S.msg = ''; S.day = ymd(new Date()); S.dayData = null; loadDay(); };
  }

  async function saveMove(kind){
    const lines = S.lines.map(l => ({ item: l.item, qty: toNum(l.qty), cost: toNum(l.cost) })).filter(l => l.item || l.qty);
    if(!lines.length) return flash('اختار صنف واكتب الكمية.', true);
    for(const l of lines){
      if(!l.item) return flash('فيه سطر من غير صنف.', true);
      if(!l.qty || l.qty <= 0) return flash('الكمية لازم تكون أكبر من صفر في كل سطر.', true);
    }
    if(kind === 'out'){
      const need = {};
      lines.forEach(l => need[l.item] = (need[l.item] || 0) + l.qty);
      for(const id in need){
        const it = itemById(id);
        if(need[id] > Number(it.qty || 0)) return flash(`مينفعش تخرّج ${fmtN(need[id])} من "${it.name}" — المتاح ${fmtN(it.qty)} بس.`, true);
      }
    }
    S.busy = true; draw();
    const buy = kind === 'in' && S.src === 'purchase';
    const rows = lines.map(l => {
      const r = { item_id: Number(l.item), kind, qty: kind === 'out' ? -l.qty : l.qty, note: S.note.trim() || null, created_by_name: myName() };
      if(kind === 'in'){
        r.source = S.src;
        if(buy){ const it = itemById(l.item); r.unit_cost = l.cost ?? (it && it.cost != null ? Number(it.cost) : null); }
      }
      return r;
    });
    const { error } = await sb().from('inv_moves').insert(rows);
    S.busy = false;
    if(error) return flash(/unit_cost|source/i.test(error.message)
      ? '❌ لازم سطرين الـ SQL الجداد يتشغّلوا في Supabase الأول (عمود السعر ونوع الإدخال).'
      : '❌ مقدرناش نسجّل: ' + error.message, true);
    if(buy){ // آخر سعر شراء يبقى سعر تكلفة الصنف
      for(const l of lines) if(l.cost != null) await sb().from('inv_items').update({ cost: l.cost }).eq('id', l.item);
    }
    S.buy = null;
    const n = rows.length;
    S.lines = [{ item:'', qty:'' }]; S.note = '';
    S.msg = `✅ اتسجّل ${kind === 'out' ? 'إخراج' : 'إدخال'} ${n} صنف.`; S.msgErr = false;
    await load();
  }

  async function saveCount(){
    const rows = [];
    for(const id in S.count){
      const v = S.count[id]; if(v === '' || v === undefined) continue;
      const n = toNum(v), it = itemById(id);
      if(n === null || n < 0 || !it) continue;
      const d = n - Number(it.qty || 0);
      if(d !== 0) rows.push({ item_id: Number(id), kind:'adjust', qty: d, note: ('جرد' + (S.countNote.trim() ? ' — ' + S.countNote.trim() : '')), created_by_name: myName() });
    }
    if(!rows.length) return flash('مفيش فروق تتسجّل — كل الأعداد اللي كتبتها زي السيستم (أو ماكتبتش حاجة).', !Object.keys(S.count).length);
    if(!confirm(`هيتعدّل رصيد ${rows.length} صنف حسب العدد الفعلي. تكمل؟`)) return;
    S.busy = true; draw();
    const { error } = await sb().from('inv_moves').insert(rows);
    S.busy = false;
    if(error) return flash('❌ مقدرناش نحفظ الجرد: ' + error.message, true);
    S.count = {}; S.countNote = '';
    S.msg = `✅ اتحفظ الجرد — اتعدّل ${rows.length} صنف.`; S.msgErr = false;
    await load();
  }

  async function saveItem(){
    const g = id => (document.getElementById(id) || {}).value;
    const name = (g('itName') || '').trim();
    if(!name) return flash('اكتب اسم الصنف.', true);
    const data = {
      name, sku: (g('itSku') || '').trim() || null, category: (g('itCat') || '').trim() || null,
      unit: (g('itUnit') || '').trim() || 'قطعة', min_qty: toNum(g('itMin')) || 0, cost: toNum(g('itCost'))
    };
    const open = toNum(g('itOpen'));
    S.draft = { ...data, open: g('itOpen') || '' }; // عشان الفورم مايتمسحش لو حصل خطأ
    S.busy = true; draw();
    if(S.editing){
      const { error } = await sb().from('inv_items').update(data).eq('id', S.editing);
      S.busy = false;
      if(error) return flash('❌ ' + (/duplicate|unique/i.test(error.message) ? 'الكود ده مستخدم لصنف تاني.' : error.message), true);
      S.editing = null; S.draft = null; S.msg = '✅ اتعدّل الصنف.'; S.msgErr = false;
    } else {
      const { data: row, error } = await sb().from('inv_items').insert(data).select().single();
      if(error){ S.busy = false; return flash('❌ ' + (/duplicate|unique/i.test(error.message) ? 'الكود ده مستخدم لصنف تاني.' : error.message), true); }
      if(open && open > 0){
        await sb().from('inv_moves').insert({ item_id: row.id, kind:'in', qty: open, note:'رصيد أول المدة', source:'opening', created_by_name: myName() });
      }
      S.busy = false; S.draft = null; S.msg = `✅ اتضاف "${name}"${open > 0 ? ' برصيد ' + fmtN(open) : ''}.`; S.msgErr = false;
    }
    await load();
  }

  async function toggleItem(id){
    const it = itemById(id); if(!it) return;
    const { error } = await sb().from('inv_items').update({ active: it.active === false }).eq('id', id);
    if(error) return flash('❌ ' + error.message, true);
    S.msg = ''; await load();
  }

  async function delMove(id){
    if(!confirm('تمسح الحركة دي؟ الرصيد هيتحسب من غيرها.')) return;
    const { data, error } = await sb().from('inv_moves').delete().eq('id', id).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح الحركة' + (error ? ': ' + error.message : ' (المسح للأدمن بس).'), true);
    S.msg = '✅ اتمسحت الحركة.'; S.msgErr = false; await load();
  }

  function exportXlsx(){
    const rows = active().map(i => ({ 'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الكمية': Number(i.qty || 0),
      'الوحدة': i.unit || '', 'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '', 'الحالة': status(i)[0] }));
    const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المخزون');
    XLSX.writeFile(wb, 'المخزون ' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }

  // دوسة برا القايمة بتقفلها
  document.addEventListener('click', e => {
    if(ddOpen === null || !isInv()) return;
    if(e.target.closest && e.target.closest('.inv-dd')) return;
    ddOpen = null; ddQ = ''; draw();
  });

  /* ---------- الربط بالراوتر ---------- */
  function mount(){ draw(); if(S.items === null && !S.loading && !S.err) load(); }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isInv()) mount(); };
  window.addEventListener('hashchange', () => { if(isInv()) mount(); });
  // بيفتح ملخص يوم معيّن في المخزن من أي قسم تاني (زي قسم الـ EOD)
  window.InvOpenDay = d => {
    S.tab = 'day'; S.msg = ''; S.day = d || ymd(new Date()); S.dayData = null;
    if(isInv()){ if(S.items) loadDay(); else mount(); }
    else { location.hash = '#/dept/warehouse'; if(S.items) setTimeout(loadDay, 50); }
  };
  if(isInv()) setTimeout(mount, 0);
})();
</script>

<!-- =====================================================================
     🛒 قسم المبيعات المباشرة — مبيعات ومرتجعات يوم بيوم (Supabase)
     الصق البلوك ده كله قبل سطر </body> على طول
     (يعني تحت آخر </script> بتاع قسم المخزن 🏬)
     ===================================================================== -->
<style id="ds-style">

.ds-kpi.sale .n{color:#276749}
.ds-kpi.ret .n{color:#b3423a}
.ds-kpi.net{border:2px solid var(--brass)}
.ds-kpi.net .n{color:var(--brass-d)}
.ds-kind{display:flex;gap:6px;margin-bottom:12px}
.ds-kind button{flex:1;max-width:180px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600}
.ds-kind button.on.sale{background:#276749;border-color:#276749;color:#fff}
.ds-kind button.on.ret{background:#b3423a;border-color:#b3423a;color:#fff}

@media (max-width:700px){.ds-form{grid-template-columns:1fr 1fr}}
.ds-form label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.ds-in{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit;background:var(--panel);color:var(--ink);box-sizing:border-box}
.ds-in:focus{outline:none;border-color:var(--brass)}
.ds-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px;font-family:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.ds-btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700;padding:10px 18px;font-size:14.5px}
